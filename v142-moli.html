<!DOCTYPE html><html lang="zh-HK"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>V143 手遊版</title>
<style>
*{touch-action:none;-webkit-tap-highlight-color:transparent;user-select:none}
body{margin:0;background:#000;display:flex;justify-content:center;font-family:-apple-system,system-ui,sans-serif;overflow:hidden}
#game{width:100%;max-width:430px;height:100vh;height:100dvh;background:linear-gradient(#a8e0ff,#fff6d0);position:relative;overflow:hidden;display:flex;flex-direction:column}
#top{height:44px;background:rgba(0,0,0,.75);color:white;display:flex;justify-content:space-between;align-items:center;padding:0 12px;font-weight:900;font-size:13px;z-index:30}
#mapWrap{flex:1;position:relative;overflow:hidden;background:#c8e8a0}
#map{position:absolute;width:800px;height:800px;background:#c8e8a0}
.tile{position:absolute;width:40px;height:40px;box-sizing:border-box}
.path{background:#f5e6c0}.grass{background:#8bc34a;border:1px solid #7cb342}.bush{background:#5a9a2a;border:2px dashed #3d7a1a}.water{background:#6ec6ff}
#player{position:absolute;width:40px;height:40px;background:white;border-radius:50%;border:3px solid #333;z-index:10;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 4px 12px rgba(0,0,0,.3);transition:.08s}
#msg{position:absolute;bottom:140px;left:10px;right:10px;background:rgba(0,0,0,.75);color:white;border-radius:12px;padding:10px 12px;font-size:13px;font-weight:700;z-index:20;line-height:1.3}
#controls{position:absolute;inset:0;pointer-events:none}
.joy{position:absolute;left:18px;bottom:18px;width:120px;height:120px;background:rgba(255,255,255,.25);border:3px solid rgba(255,255,255,.6);border-radius:50%;pointer-events:auto;z-index:30}
.joy-knob{position:absolute;left:50%;top:50%;width:56px;height:56px;background:rgba(255,255,255,.9);border:3px solid #5a3a22;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 4px 0 rgba(0,0,0,.3)}
.skill{position:absolute;right:14px;bottom:18px;display:flex;flex-direction:column;gap:12px;pointer-events:auto;z-index:30}
.sbtn{width:64px;height:64px;border-radius:50%;border:3px solid #5a3a22;box-shadow:0 5px 0 #5a3a22;font-weight:900;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background:white}
.sbtn:active{transform:translateY(5px);box-shadow:none}
.sbtn.atk{background:#ffcc80}.sbtn.ball{background:#f48fb1}.sbtn.dex{background:#90caf9}
#battle{position:absolute;inset:0;background:linear-gradient(#a8e0ff,#fff6e0);z-index:40;display:none;flex-direction:column;padding:10px}
.battle-row{display:flex;justify-content:space-around;align-items:end;height:110px}
.pet{width:78px;height:78px;object-fit:contain;background:white;border:3px solid #5a3a22;border-radius:16px}
.hp{height:14px;background:#222;border-radius:7px;margin-top:6px;width:78px;overflow:hidden}.hp-fill{height:100%;background:linear-gradient(#66bb6a,#2e7d32);transition:width .3s}
#mathBox{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:100;padding:14px}
.box{background:white;border-radius:24px;padding:20px;width:100%;max-width:340px;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,.4)}
.num-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.num-key{padding:18px;background:white;border:3px solid #5a3a22;border-radius:16px;font-size:22px;font-weight:900;box-shadow:0 4px 0 #5a3a22}
.num-key:active{transform:translateY(4px);box-shadow:none;background:#ff9800;color:white}
</style></head><body>
<div id="game">
<div id="top"><span>🌲 法蘭城外 步數 <span id="steps">0</span></span><span>圖鑑 <span id="dexCount">1/4</span></span></div>
<div id="mapWrap"><div id="map"></div><div id="player">🧑‍🌾</div></div>
<div id="msg">新檔V143手遊版：左手搖桿行路，右手技能掣！入深綠草叢遇怪，半血可捉！</div>
<div id="controls"><div class="joy" id="joy"><div class="joy-knob" id="knob"></div></div><div class="skill"><button class="sbtn atk" onclick="if(battleOn)act('atk')"><span>⚔️</span>攻擊</button><button class="sbtn ball" onclick="if(battleOn)act('ball')"><span>🎀</span>捕捉</button><button class="sbtn dex" onclick="openDex()"><span>📖</span>圖鑑</button></div></div>
<div id="battle"><div style="display:flex;justify-content:space-between;font-weight:900"><span>⚔️ 野生 <span id="ename">BB龍</span></span><span id="ehpText"></span><button onclick="closeBattle()" style="border:none;background:#eee;border-radius:8px;padding:4px 8px;font-weight:900">✕</button></div><div class="battle-row" id="enemyRow" style="margin-top:12px"></div><div class="battle-row" id="myRow" style="margin-top:16px"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px"><button class="sbtn" style="width:100%;height:56px;border-radius:16px;background:#ffcc80" onclick="act('atk')">⚔️ 攻擊(加減)</button><button class="sbtn" style="width:100%;height:56px;border-radius:16px;background:#f48fb1" onclick="act('ball')">🎀 捕捉</button></div><div id="bmsg" style="margin-top:10px;background:rgba(0,0,0,.75);color:white;border-radius:12px;padding:10px;font-weight:700;font-size:13px">打到60%以下先捉到！</div></div>
<div id="mathBox"><div class="box"><h2 id="mTitle">攻擊！</h2><h1 id="mQ" style="font-size:38px;margin:8px 0">16-13=?</h1><div id="ans" style="font-size:46px;font-weight:900;border:3px solid #5a3a22;border-radius:16px;padding:10px;background:#fffbe6;min-height:56px">?</div><div class="num-grid"><button class="num-key" onclick="add('1')">1</button><button class="num-key" onclick="add('2')">2</button><button class="num-key" onclick="add('3')">3</button><button class="num-key" onclick="add('4')">4</button><button class="num-key" onclick="add('5')">5</button><button class="num-key" onclick="add('6')">6</button><button class="num-key" onclick="add('7')">7</button><button class="num-key" onclick="add('8')">8</button><button class="num-key" onclick="add('9')">9</button><button class="num-key" onclick="clr()">⌫</button><button class="num-key" onclick="add('0')">0</button><button class="num-key" style="background:#ff9800;color:white" onclick="ok()">OK</button></div><button onclick="hideM()" style="margin-top:10px;width:100%;padding:12px;border:3px solid #5a3a22;border-radius:12px;font-weight:900;background:#eee">返回</button></div></div>
<div id="dexBox" style="position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:101;padding:14px"><div class="box"><h3>📖 圖鑑 <span id="dex2">1/4</span></h3><div id="dexGrid" style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:8px"></div><button onclick="closeDex()" style="margin-top:12px;width:100%;padding:12px;border:3px solid #5a3a22;border-radius:12px;font-weight:900;background:#eee">關閉</button></div></div>
</div>
<script>
const pets=[{img:"./dino1.png.jpg",name:"蛋蛋龍",hp:20},{img:"./dino2.png.jpg",name:"BB龍",hp:24},{img:"./dino3.png.WEBP",name:"火焰龍",hp:28},{img:"./dino4.png.jpg",name:"霸王龍",hp:32}];
let px=10,py=10,steps=0,dex=JSON.parse(localStorage.getItem('yuki_dex143')||'[true,false,false,false]'),team=0,emy=1,emyHp=24,myHp=20,ans=0,input="",mode="",battleOn=false;
let mapData=[];for(let y=0;y<20;y++){mapData[y]=[];for(let x=0;x<20;x++){let r=Math.random();if(r<0.08)mapData[y][x]=3;else if(r<0.25)mapData[y][x]=1;else if(r<0.30)mapData[y][x]=2;else mapData[y][x]=0;}}
function buildMap(){let m=document.getElementById('map');m.innerHTML='';for(let y=0;y<20;y++)for(let x=0;x<20;x++){let d=document.createElement('div');d.className='tile';let t=mapData[y][x];if(t==0)d.classList.add('path');if(t==1)d.classList.add('grass');if(t==2)d.classList.add('bush');if(t==3)d.classList.add('water');d.style.left=x*40+'px';d.style.top=y*40+'px';m.appendChild(d);}place();updateCamera();}
function place(){document.getElementById('player').style.left=px*40+'px';document.getElementById('player').style.top=py*40+'px';}
function updateCamera(){let wrap=document.getElementById('mapWrap');let cx=wrap.clientWidth/2-20,cy=wrap.clientHeight/2-20;let mapEl=document.getElementById('map');mapEl.style.left=(cx-px*40)+'px';mapEl.style.top=(cy-py*40)+'px';}
function move(dx,dy){let nx=px+dx,ny=py+dy;if(nx<0||nx>=20||ny<0||ny>=20)return;if(mapData[ny][nx]==3)return;px=nx;py=ny;place();updateCamera();steps++;document.getElementById('steps').innerText=steps;let t=mapData[ny][nx];if(t==1||t==2)if(Math.random()<0.18){startBattle(); if(navigator.vibrate) navigator.vibrate(30);}}
function startBattle(){emy=Math.floor(Math.random()*4);emyHp=pets[emy].hp;myHp=pets[team].hp;battleOn=true;document.getElementById('battle').style.display='flex';document.getElementById('ename').innerText=pets[emy].name;renderBattle();msg2('野生'+pets[emy].name+'出現！打到60%以下可捉！');}
function renderBattle(){let er=document.getElementById('enemyRow'),mr=document.getElementById('myRow');er.innerHTML=`<div style="text-align:center"><img src="${pets[emy].img}" class="pet"><div class="hp"><div class="hp-fill" style="width:${emyHp/pets[emy].hp*100}%"></div></div><div style="font-weight:900;font-size:12px">${emyHp}/${pets[emy].hp} ${Math.round(emyHp/pets[emy].hp*100)}%</div></div>`;mr.innerHTML=`<div style="text-align:center"><img src="${pets[team].img}" class="pet"><div class="hp"><div class="hp-fill" style="width:${myHp/pets[team].hp*100}%"></div></div><div style="font-weight:900;font-size:12px">${pets[team].name} ${myHp}/${pets[team].hp}</div></div>`;document.getElementById('ehpText').innerText=emyHp+'/'+pets[emy].hp;document.getElementById('dexCount').innerText=dex.filter(Boolean).length+'/4';}
function msg(t){document.getElementById('msg').innerText=t;}
function msg2(t){document.getElementById('bmsg').innerText=t;}
function act(a){if(a=='ball'){if(emyHp/pets[emy].hp>0.6){msg2('仲有'+Math.round(emyHp/pets[emy].hp*100)+'%血！打到60%以下先捉到！');return;}openM('捕捉！','ball');return;}openM('攻擊！加減','atk');}
function openM(title,m){mode=m;document.getElementById('mTitle').innerText=title;let a=Math.floor(Math.random()*30)+1,b=Math.floor(Math.random()*20)+1,op=Math.random()<0.5?'+':'-';if(op=='-'){if(a<b)[a,b]=[b,a];ans=a-b;document.getElementById('mQ').innerText=a+' - '+b+' = ?';}else{ans=a+b;document.getElementById('mQ').innerText=a+' + '+b+' = ?';}input='';document.getElementById('ans').innerText='?';document.getElementById('mathBox').style.display='flex';}
function add(n){input=(input||'')+n;if(input.length>4)input=input.slice(0,4);document.getElementById('ans').innerText=input;}
function clr(){input=input.slice(0,-1);document.getElementById('ans').innerText=input||'?';}
function hideM(){document.getElementById('mathBox').style.display='none';}
function closeBattle(){document.getElementById('battle').style.display='none';battleOn=false;}
function ok(){let v=parseInt(input);if(isNaN(v))return;hideM();if(v===ans){if(mode=='ball'){dex[emy]=true;localStorage.setItem('yuki_dex143',JSON.stringify(dex));msg('捉到'+pets[emy].name+'！圖鑑'+dex.filter(Boolean).length+'/4');closeBattle();if(navigator.vibrate) navigator.vibrate([30,50,30]);}else{emyHp=Math.max(0,emyHp-12);msg2('打中！-12！正解'+ans);renderBattle();if(emyHp<=0){msg2(pets[emy].name+'倒下！用捕捉捉佢！');}else{setTimeout(enemyAtk,600);}}}else{msg2('答錯！正解'+ans+'，被反擊 -4');myHp=Math.max(0,myHp-4);renderBattle();if(myHp<=0){msg2('返城補血！');setTimeout(closeBattle,800);myHp=pets[team].hp;}else setTimeout(enemyAtk,600);} }
function enemyAtk(){if(!battleOn)return;let dmg=3+Math.floor(Math.random()*4);myHp=Math.max(0,myHp-4);renderBattle();msg2('敵人反擊 -'+dmg);if(myHp<=0){msg2('全滅返城！');setTimeout(closeBattle,800);myHp=pets[team].hp;}}
function openDex(){let g=document.getElementById('dexGrid');g.innerHTML='';pets.forEach((p,i)=>{let c=dex[i];g.innerHTML+=`<div style="background:white;border:3px solid ${c?'#ff9800':'#ccc'};border-radius:16px;padding:8px;text-align:center;font-weight:900;${c?'':'opacity:.4'}"><img src="${p.img}" style="width:60px;height:60px;object-fit:contain;display:block;margin:0 auto"><div>${p.name}</div><div style="font-size:10px">${c?(team==i?'隊伍中':'已捉到'):'未見過'}</div></div>`});document.getElementById('dexBox').style.display='flex';document.getElementById('dex2').innerText=dex.filter(Boolean).length+'/4';let cs=document.getElementById('dexGrid').children;[...cs].forEach((el,i)=>{if(dex[i])el.onclick=()=>{team=i;myHp=pets[i].hp;msg(pets[i].name+'入隊！');closeDex();}});}
function closeDex(){document.getElementById('dexBox').style.display='none';}
// joystick
let joy=document.getElementById('joy'),knob=document.getElementById('knob'),drag=false,lastMove=0;
function joyPos(e){let r=joy.getBoundingClientRect();let cx=r.left+r.width/2,cy=r.top+r.height/2;let x=(e.touches?e.touches[0].clientX:e.clientX)-cx,y=(e.touches?e.touches[0].clientY:e.clientY)-cy;let dist=Math.min(Math.sqrt(x*x+y*y),44);let ang=Math.atan2(y,x);let nx=Math.cos(ang)*dist,ny=Math.sin(ang)*dist;knob.style.transform=`translate(calc(-50% + ${nx}px), calc(-50% + ${ny}px))`;return {x:nx,y:ny};}
joy.addEventListener('touchstart',e=>{drag=true;e.preventDefault();});joy.addEventListener('mousedown',e=>{drag=true;});
window.addEventListener('touchend',e=>{drag=false;knob.style.transform='translate(-50%,-50%)';});window.addEventListener('mouseup',e=>{drag=false;knob.style.transform='translate(-50%,-50%)';});
window.addEventListener('touchmove',e=>{if(!drag||battleOn)return;let p=joyPos(e);let now=Date.now();if(now-lastMove<90)return;lastMove=now;let dx=Math.abs(p.x)>20?(p.x>0?1:-1):0,dy=Math.abs(p.y)>20?(p.y>0?1:-1):0;if(dx||dy)move(dx,dy);},{passive:false});
window.addEventListener('mousemove',e=>{if(!drag||battleOn)return;let p=joyPos(e);let now=Date.now();if(now-lastMove<90)return;lastMove=now;let dx=Math.abs(p.x)>20?(p.x>0?1:-1):0,dy=Math.abs(p.y)>20?(p.y>0?1:-1):0;if(dx||dy)move(dx,dy);});
buildMap();window.addEventListener('resize',updateCamera);
</script></body></html>
