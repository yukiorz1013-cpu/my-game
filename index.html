<!DOCTYPE html><html lang="zh-HK"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>V158 無龍圖版</title>
<style>
*{touch-action:none;user-select:none;box-sizing:border-box}
body{margin:0;background:#000;display:flex;justify-content:center;font-family:-apple-system,sans-serif}
#game{width:100%;max-width:430px;height:100vh;height:100dvh;background:#e6c87a;position:relative;overflow:hidden;display:flex;flex-direction:column}
#top{height:48px;background:linear-gradient(#1a2a4a,#0e0e1a);border-bottom:2px solid #ffb300;display:flex;justify-content:space-between;align-items:center;padding:0 8px;color:#ffd54f;font-weight:900;font-size:10px}
#mapWrap{flex:1;position:relative;overflow:hidden;background:#e6c87a}
#map{position:absolute;left:0;top:0;width:4800px;height:4800px;background:#e6c87a}
.tile{position:absolute;width:42px;height:42px;margin:-1px;background-color:#e6c87a;background-image:url('./tileset.png');background-size:420px 336px;image-rendering:pixelated}
.desert{background-position:0px 0px}.cactus{background-position:-120px 0px}.grass{background-position:-180px 0px}.water{background-position:-300px 0px}
.wall{background-position:-260px -80px;background-color:#c0a070}.wall2{background-position:-320px -80px}
.house1{background-position:-60px -150px}.house2{background-position:-120px -150px}.palm{background-position:0px -230px}.market{background-position:-60px -235px}.well{background-position:-190px -235px}
.town{border:3px solid #ffb300;z-index:2}.shop{border:3px solid #ff6f00;z-index:2}
#player{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;background:#fff;border:3px solid #ffb300;border-radius:50%;z-index:20;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 0 0 3px #000,0 0 10px #ffb300}
#msg{position:absolute;left:6px;right:6px;bottom:88px;background:rgba(0,0,0,.88);border-left:4px solid #ffb300;color:#fff;border-radius:8px;padding:6px 10px;font-size:11px;font-weight:700;z-index:10}
#controls{position:absolute;left:0;right:0;bottom:0;height:84px;background:linear-gradient(rgba(0,0,0,.92),#000);border-top:2px solid #ffb300;display:flex;justify-content:space-between;align-items:center;padding:0 8px 6px 8px;z-index:20;padding-bottom:max(6px,env(safe-area-inset-bottom))}
#joy{width:72px;height:72px;background:rgba(255,255,255,.18);border:2px solid #ffb300;border-radius:50%;position:relative}#knob{position:absolute;left:50%;top:50%;width:34px;height:34px;background:#fff;border-radius:50%;transform:translate(-50%,-50%);border:2px solid #000}
#skills{display:flex;gap:4px}.sbtn{width:50px;height:50px;border-radius:10px;border:2px solid #ffb300;background:#222;color:#ffd54f;font-weight:900;font-size:7px}.sbtn.seal{background:#e91e63;color:#fff}
#battle{position:absolute;inset:0;background:radial-gradient(#1e3a5f,#0a0a14);z-index:30;display:none;flex-direction:column;color:#fff}
#pop{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:100;padding:12px}.box{background:linear-gradient(#fff8e0,#ffe0b2);border:3px solid #ffb300;border-radius:18px;padding:12px;width:100%;max-width:340px;color:#3e2723;text-align:center}
</style></head><body>
<div id="game"><div id="top"><span id="area">🏜️奇利村</span> Lv<span id="lv">1</span><span>💰<span id="gold">120</span> 🎀<span id="balls">14</span> 步<span id="steps">0</span></span></div><div id="mapWrap"><div id="map"></div><div id="player">🧑‍🌾</div><div id="msg">V158已收埋四張龍圖！純真魔力磚+emoji寵！</div><div id="controls"><div id="joy"><div id="knob"></div></div><div id="skills"><button class="sbtn" onclick="doAtk()">🏹亂射</button><button class="sbtn" onclick="doAtk()">💥乾坤</button><button class="sbtn" onclick="openShop()">🏪商店</button><button class="sbtn" onclick="openDex()">📖圖鑑</button><button class="sbtn seal" onclick="trySeal()">🎀封印</button></div></div></div><div id="battle"><div style="height:44px;background:#111;border-bottom:2px solid #ffb300;display:flex;justify-content:space-between;align-items:center;padding:0 10px;color:#ffd54f;font-weight:900"><span>⚔️ <span id="ename">黃蜂</span> Lv<span id="elv">1</span> <span id="ehpT">70%</span></span><button onclick="closeB()" style="background:#222;color:#ffd54f;border:1px solid #ffb300;border-radius:6px;padding:4px 8px">逃走</button></div><div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center"><div id="eBox" style="width:130px;height:130px;background:#fff;border:3px solid #ffb300;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:80px;box-shadow:0 0 20px rgba(255,179,0,.6)">🐝</div><div id="bmsg" style="margin-top:12px;background:rgba(0,0,0,.7);padding:6px 14px;border-radius:8px;font-size:12px;font-weight:700">野怪！</div><div style="display:flex;gap:8px;width:92%;margin-top:12px"><button class="sbtn" style="flex:1;height:46px;font-size:10px" onclick="doAtk()">攻擊</button><button class="sbtn seal" style="flex:1;height:46px;font-size:10px" onclick="trySeal()">封印</button></div></div></div><div id="pop"><div class="box" id="popBox"></div></div></div>
<script>
// 純cg.skyey.tw資料，無龍圖
const pets=[
{name:"黃蜂",emoji:"🐝",area:"奇利村"},
{name:"哥布林",emoji:"👺",area:"奇利村"},
{name:"小蝙蝠",emoji:"🦇",area:"奇利村"},
{name:"口臭鬼",emoji:"👻",area:"奇利村"},
{name:"水龍蜥",emoji:"🦎",area:"烏克蘭村"},
{name:"史萊姆",emoji:"💧",area:"法蘭周邊"},
{name:"幽靈",emoji:"👻",area:"里謝里雅堡"},
{name:"骷髏",emoji:"💀",area:"里謝里雅堡"},
{name:"水蜘蛛",emoji:"🕷️",area:"水邊"},
{name:"螳螂",emoji:"🦗",area:"草原"},
{name:"迷你石怪",emoji:"🪨",area:"洞窟"},
{name:"貓妖",emoji:"🐱",area:"城鎮"}
];
let px=60,py=60,gold=120,balls=14,dex=[true,true,false,false,false,true,false,false,false,false,false,false],steps=0,emy=0,emyHp=70,battle=false,ans=0,input="",mapSize=120;
let map=[];for(let y=0;y<mapSize;y++){map[y]=[];for(let x=0;x<mapSize;x++){
if(x==60&&y==60)map[y][x]=10;else if(x==62&&y==60)map[y][x]=11;else if(x==58&&y==62)map[y][x]=12;else if(x==65&&y==60)map[y][x]=13;else if(x==60&&y==65)map[y][x]=14;
else if(x%15==0&&y%15==0)map[y][x]=5;else if(x%12==1&&y%12==1)map[y][x]=6;
else{let r=Math.random();if(r<0.04)map[y][x]=3;else if(r<0.10)map[y][x]=2;else if(r<0.14)map[y][x]=1;else if(r<0.18)map[y][x]=4;else if(r<0.22)map[y][x]=7;else map[y][x]=0;}
}}
const mapEl=document.getElementById('map');
function build(){mapEl.innerHTML='';for(let y=0;y<mapSize;y++)for(let x=0;x<mapSize;x++){let d=document.createElement('div');d.className='tile';let t=map[y][x];
if(t==0)d.classList.add('desert');if(t==1)d.classList.add('cactus');if(t==2)d.classList.add('grass');if(t==3)d.classList.add('water');if(t==4)d.classList.add('wall');if(t==5)d.classList.add('wall2');if(t==6)d.classList.add('wall');
if(t==10){d.classList.add('house1');d.classList.add('town');}if(t==11){d.classList.add('house2');d.classList.add('shop');}if(t==12){d.classList.add('palm');}if(t==13){d.classList.add('market');d.classList.add('shop');}if(t==14){d.classList.add('well');d.classList.add('town');}
d.style.left=x*40+'px';d.style.top=y*40+'px';mapEl.appendChild(d);}updateCam();}
function updateCam(){let w=document.getElementById('mapWrap');let W=w.clientWidth||430,H=w.clientHeight||600;mapEl.style.left=(W/2-px*40-20)+'px';mapEl.style.top=(H/2-py*40-20)+'px';
let t=map[py][px];let a="🏜️奇利村沙漠";if(t==2)a="🌿烏克蘭草原";if(t==3)a="💧水邊";if(t==4||t==5||t==6)a="🏰里謝里雅堡";if(t==10||t==11)a="🏠村內";document.getElementById('area').innerText=a;}
function updateUI(){document.getElementById('gold').innerText=gold;document.getElementById('balls').innerText=balls;document.getElementById('steps').innerText=steps;}
function move(dx,dy){if(battle)return;let nx=px+dx,ny=py+dy;if(nx<0||nx>=mapSize||ny<0||ny>=mapSize)return;if(map[ny][nx]==3)return;px=nx;py=ny;steps++;updateCam();updateUI();if(Math.random()<0.22)startB();}
function msg(t){document.getElementById('msg').innerText=t;}
function startB(){let t=map[py][px];if(t==0||t==1)emy=Math.random()<0.5?0:1;else if(t==2)emy=4;else if(t==4||t==5||t==6)emy=Math.random()<0.5?6:7;else if(t==3)emy=8;else emy=Math.floor(Math.random()*pets.length);
emyHp=70+Math.floor(Math.random()*20);battle=true;document.getElementById('battle').style.display='flex';
document.getElementById('ename').innerText=pets[emy].name;document.getElementById('elv').innerText=Math.floor(Math.random()*5)+1;document.getElementById('ehpT').innerText=emyHp+'%';document.getElementById('bmsg').innerText='野生 '+pets[emy].name+' 出現！('+pets[emy].area+')';
document.getElementById('eBox').innerText=pets[emy].emoji;}
function closeB(){document.getElementById('battle').style.display='none';battle=false;}
function doAtk(){let a=Math.floor(Math.random()*12)+2,b=Math.floor(Math.random()*12)+2;ans=a+b;pop(`<h3>🏹 攻擊 ${pets[emy].name}</h3><h1>${a}+${b}=?</h1><div id=ab style="font-size:36px;border:2px solid #000;border-radius:10px;padding:6px">?</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px"><button onclick="addN('1')">1</button><button onclick="addN('2')">2</button><button onclick="addN('3')">3</button><button onclick="addN('4')">4</button><button onclick="addN('5')">5</button><button onclick="addN('6')">6</button><button onclick="addN('7')">7</button><button onclick="addN('8')">8</button><button onclick="addN('9')">9</button><button onclick="clrN()">⌫</button><button onclick="addN('0')">0</button><button style="background:#ffb300" onclick="chk(false)">OK</button></div>`);input="";}
function trySeal(){if(balls<=0){pop('<h3>無卡</h3><button onclick="openShop()">去商店</button>');return;}if(emyHp>60){document.getElementById('bmsg').innerText='仲有'+emyHp+'%血！打到60%以下！';return;}let a=Math.floor(Math.random()*10)+1,b=Math.floor(Math.random()*10)+1;ans=a+b;pop(`<h3>🎀 封印 ${pets[emy].name}</h3><h1>${a}+${b}=?</h1><div id=ab style="font-size:36px;border:2px solid #000;border-radius:10px;padding:6px">?</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px"><button onclick="addN('1')">1</button><button onclick="addN('2')">2</button><button onclick="addN('3')">3</button><button onclick="addN('4')">4</button><button onclick="addN('5')">5</button><button onclick="addN('6')">6</button><button onclick="addN('7')">7</button><button onclick="addN('8')">8</button><button onclick="addN('9')">9</button><button onclick="clrN()">⌫</button><button onclick="addN('0')">0</button><button style="background:#e91e63;color:white" onclick="chk(true)">封印</button></div>`);input="";}
function addN(n){input+=n;document.getElementById('ab').innerText=input;}function clrN(){input=input.slice(0,-1);document.getElementById('ab').innerText=input||'?';}
function chk(isSeal){let v=parseInt(input);if(isNaN(v))return;closePop();if(v===ans){if(isSeal){balls--;if(Math.random()<0.85){dex[emy]=true;gold+=25;msg('🎉捉到 '+pets[emy].name);closeB();}else msg('走甩咗');}else{emyHp=Math.max(0,emyHp-35);document.getElementById('ehpT').innerText=emyHp+'%';document.getElementById('bmsg').innerText='打中-35% 正解'+ans;if(emyHp<=0)document.getElementById('bmsg').innerText='倒下！快封印！';}updateUI();}else msg('答錯 正解'+ans);}
function pop(h){document.getElementById('popBox').innerHTML=h;document.getElementById('pop').style.display='flex';}function closePop(){document.getElementById('pop').style.display='none';}
function openShop(){pop(`<h3>🏪奇利村道具屋</h3><p>🎀封印卡 20金</p><button onclick="if(gold>=20){gold-=20;balls++;updateUI();closePop();msg('買到');}else msg('唔夠金')" style="width:100%;padding:10px;background:#ffb300;border-radius:10px;font-weight:900">買1張</button><button onclick="closePop()" style="width:100%;padding:8px;margin-top:6px">關閉</button>`);}
function openDex(){let h='<h3>📖寵物圖鑑</h3><div style="max-height:260px;overflow:auto">';pets.forEach((p,i)=>{h+=`<div style="display:flex;gap:8px;align-items:center;border:2px solid ${dex[i]?'#ffb300':'#aaa'};border-radius:8px;padding:4px;margin:4px 0;background:${dex[i]?'#fff8e0':'#eee'}"><div style="width:36px;height:36px;background:#fff;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:20px">${p.emoji}</div><div style="text-align:left"><div style="font-weight:900;font-size:12px">${p.name} ${dex[i]?'✅':'❌'}</div><div style="font-size:10px;color:#666">${p.area}</div></div></div>`});h+='</div><button onclick="closePop()" style="margin-top:8px">關閉</button>';pop(h);}
let joy=document.getElementById('joy'),knob=document.getElementById('knob'),drag=false,last=0;
joy.addEventListener('touchstart',e=>{drag=true;e.preventDefault();});
window.addEventListener('touchend',()=>{drag=false;knob.style.transform='translate(-50%,-50%)';});
window.addEventListener('touchmove',e=>{if(!drag||battle)return;let r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,x=e.touches[0].clientX-cx,y=e.touches[0].clientY-cy,d=Math.min(Math.sqrt(x*x+y*y),32),a=Math.atan2(y,x),nx=Math.cos(a)*d,ny=Math.sin(a)*d;knob.style.transform=`translate(calc(-50% + ${nx}px), calc(-50% + ${ny}px))`;let now=Date.now();if(now-last<80)return;last=now;let dx=Math.abs(nx)>14?(nx>0?1:-1):0,dy=Math.abs(ny)>14?(ny>0?1:-1):0;if(dx||dy)move(dx,dy);},{passive:false});
window.addEventListener('resize',updateCam);build();updateUI();
</script></body></html>
