<!DOCTYPE html><html lang="zh-HK"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>V201 行路修正</title>
<style>
*{touch-action:none;user-select:none;box-sizing:border-box}body{margin:0;background:#0a2a4a;display:flex;justify-content:center;font-family:-apple-system,sans-serif}
#game{width:100%;max-width:430px;height:100vh;height:100dvh;background:#0b3a5f;position:relative;overflow:hidden;display:flex;flex-direction:column}
#top{height:52px;background:linear-gradient(#1a2a4a,#0e0e1a);border-bottom:2px solid #ffb300;display:flex;justify-content:space-between;align-items:center;padding:0 8px;color:#ffd54f;font-weight:900;font-size:11px;z-index:20}
.topBtn{background:#222;border:1.5px solid #ffb300;color:#ffd54f;border-radius:8px;padding:4px 8px;font-weight:900;font-size:10px}
#mapWrap{flex:1;position:relative;overflow:hidden;background:#2d5a1e}
#world{position:absolute;left:0;top:0;width:3000px;height:2250px;background-image:url('./IMG_9790.png');background-size:3000px 2250px;image-rendering:pixelated}
#playerWrap{position:absolute;left:50%;top:50%;width:70px;height:96px;transform:translate(-50%,-50%);z-index:15;pointer-events:none}
#shadow{position:absolute;left:50%;bottom:0;width:26px;height:6px;background:radial-gradient(rgba(0,0,0,.6),transparent);border-radius:50%;transform:translateX(-50%)}
#player{width:64px;height:84px;background-image:url('./char.png');background-size:400% 300%;image-rendering:pixelated;background-color:transparent !important;border:none !important;filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 6px gold) drop-shadow(0 0 12px rgba(255,215,0,.9)) var(--cf);background-repeat:no-repeat}
#player.walking{animation:walkBob .22s infinite alternate}
#player.left{transform:scaleX(-1)}#player.right{transform:scaleX(1)}
@keyframes walkBob{0%{transform:translateY(0) scaleX(var(--sx,1))}100%{transform:translateY(-5px) scaleX(var(--sx,1))}}
#player.walking.left{--sx:-1}#player.walking.right{--sx:1}
#posBox{position:absolute;right:8px;top:8px;background:rgba(0,0,0,.7);color:#ffd54f;border:1px solid #ffb300;border-radius:8px;padding:4px 8px;font-size:10px;font-weight:900;z-index:15}
#msg{position:absolute;left:8px;right:8px;bottom:12px;background:rgba(0,0,0,.6);color:#fff;border-radius:8px;padding:6px 10px;font-size:11px;z-index:15;pointer-events:none}
#fxMap{position:absolute;inset:0;pointer-events:none;z-index:9}
.particle{position:absolute;pointer-events:none;font-weight:900}
@keyframes dust{0%{transform:translate(-50%,0) scale(.2);opacity:.8}100%{transform:translate(-50%,-30px) scale(1.2);opacity:0}}
@keyframes splash{0%{transform:translate(-50%,0) scale(.3);opacity:.9}100%{transform:translate(-50%,-20px) scale(1.5);opacity:0}}
#joy{position:absolute;width:100px;height:100px;background:rgba(255,255,255,.22);border:2px solid rgba(255,179,0,.9);border-radius:50%;z-index:25;display:none;pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:42px;height:42px;background:rgba(255,255,255,.95);border-radius:50%;transform:translate(-50%,-50%);border:2px solid #000;box-shadow:0 3px 8px rgba(0,0,0,.5)}
#battle{position:absolute;inset:0;background:radial-gradient(#1e3a5f,#0a0a14);z-index:30;display:none;flex-direction:column;color:#fff;overflow:hidden}
#pop{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:100;padding:12px}.box{background:linear-gradient(#fff8e0,#ffe0b2);border:3px solid #ffb300;border-radius:18px;padding:14px;width:100%;max-width:560px;color:#3e2723;text-align:center}
.charGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}.charCard{border:3px solid #aaa;border-radius:12px;background:#fff;padding:6px;cursor:pointer}.charCard.sel{border-color:#ffb300;background:#fff8e0;transform:scale(1.05)}
.charIcon{width:68px;height:80px;margin:0 auto;background-size:400% 300%;image-rendering:pixelated;border:none;background-color:transparent !important;filter:drop-shadow(0 0 4px gold)}
.palette{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}.colorBtn{width:32px;height:32px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #000;cursor:pointer}.colorBtn.sel{box-shadow:0 0 0 3px #ffb300,0 0 10px gold;transform:scale(1.2)}
.sprite{width:150px;height:150px;background-size:1000% 500%;image-rendering:pixelated;background-repeat:no-repeat;background-color:#fff;border-radius:12px}.spriteSmall{width:48px;height:48px;background-size:1000% 500%;image-rendering:pixelated;background-repeat:no-repeat;background-color:#fff;border-radius:6px;display:inline-block}
.vertical{font-family:monospace;font-weight:900;display:inline-block;text-align:right;background:#fff;border:3px solid #000;border-radius:14px;padding:10px 20px;min-width:120px}.vertical .row{font-size:32px}.vertical .op{float:left}.vertical .line{border-top:3px solid #000;margin:6px 0}.vertical .ansBox{font-size:34px;min-height:38px;color:#e91e63;border:2px dashed #ffb300;border-radius:8px;padding:2px 8px}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.numpad button{height:52px;font-size:19px;font-weight:900;border-radius:12px;border:2px solid #000;background:#fff}.numpad button.ok{background:#ffb300}
.sbtn{width:50px;height:50px;border-radius:12px;border:2px solid #ffb300;background:#222;color:#ffd54f;font-weight:900;font-size:10px}.sbtn.seal{background:#e91e63;color:#fff}
</style></head><body>
<div id="game">
<div id="top"><div><span id="lv">Lv1</span> <span id="coordTop">453,175</span> <span id="jobTag">法師</span></div><div><button class="topBtn" onclick="openDex()">📖圖鑑 <span id="cnt">0/100</span></button> <button class="topBtn" onclick="openChar()">👤人物</button> <span>💰<span id="gold">300</span> 🎀<span id="balls">30</span></span></div></div>
<div id="mapWrap"><div id="world"></div><div id="fxMap"></div><div id="playerWrap"><div id="player"></div><div id="shadow"></div></div><div id="joy"><div id="knob"></div></div><div id="posBox">📍 <span id="posXY">453,175</span></div><div id="msg">V201 行路已修正！按住地圖任何位置拖動，WASD都得</div></div>
<div id="battle"><div style="height:48px;background:#111;border-bottom:2px solid #ffb300;display:flex;justify-content:space-between;align-items:center;padding:0 10px;color:#ffd54f;font-weight:900"><span>⚔️ <span id="ename">寵物</span> Lv<span id="elv">1</span> <span id="ehpT">100%</span> <span id="bJob">法師</span></span><button onclick="closeB()" style="background:#222;color:#ffd54f;border:2px solid #ffb300;border-radius:8px;padding:5px 10px">逃</button></div>
<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center"><div id="eBox" style="width:170px;height:170px;background:#fff;border:3px solid #ffb300;border-radius:20px;display:flex;align-items:center;justify-content:center"><div id="eSprite" class="sprite"></div></div><div id="bmsg" style="margin-top:10px;background:rgba(0,0,0,.7);padding:6px 12px;border-radius:8px;font-size:11px">No.001</div><div style="display:flex;gap:8px;width:92%;margin-top:10px"><button class="sbtn" id="atkBtn" style="flex:1;height:50px" onclick="doAtk()">⚔️攻擊</button><button class="sbtn seal" style="flex:1;height:50px" onclick="trySeal()">🎀封印</button></div></div></div>
<div id="pop"><div class="box" id="popBox"></div></div>
</div>
<script>
const CHAR_FILE='./char.png';
const pets=[];const namesA=["虎紋貓","黑魔貓","妖狐","白兔","棕熊","飛龍","史萊姆","幽靈","蝙蝠","蜘蛛","螳螂","石怪","哥布林","黃蜂","水蜥","灰狼","熊貓","企鵝","倉鼠","貓頭鷹","浣熊","松鼠","烏龜","青蛙","紫蛇","刺蝟","小羊","小牛","小豬","小猴","大象","鱷魚","蠍子","蝸牛","蝴蝶","甲蟲","梅花鹿","山羊","烏鴉","鳳凰","小馬","雪怪","蘑菇","水晶","羅剎","木乃伊","南瓜","鯊魚","海豹","六角龍"];const namesB=["九尾狐","白虎","黑貓魔","獅子王","熊貓魔","仙人掌","熔岩","水晶","雷龍","天使","紫惡魔","蘑菇人","樹精","沙魔","機械人","風妖","人魚","火鬼","毛熊","毒蛙","幽靈貓","骷髏","吸血蝠","狼人","牛頭","半人馬","獅鷲","獨角獸","天馬","雞蛇","青蛇","獅蛇","雙頭蛇","比蒙","海龍","章魚","雪怪王","骷髏王","喪屍","巫妖","女妖","魅魔","天使","墮天使","聖騎","邪眼","寶箱","骰子","卡牌"];for(let i=0;i<100;i++)pets.push({id:i+1,name:[...namesA,...namesB][i]});
const baseChars=[{id:'sword',name:'劍士',px:0,py:0,type:'sword',atkIcon:'🗡️',baseHue:0},{id:'archer',name:'弓手',px:0,py:1,type:'archer',atkIcon:'🏹',baseHue:120},{id:'mage',name:'法師',px:0,py:2,type:'mage',atkIcon:'⭐',baseHue:270},{id:'fighter',name:'格鬥',px:2,py:2,type:'fighter',atkIcon:'🔥',baseHue:25}];
function charStyle(c){let x=(c.px*100/3).toFixed(2), y=(c.py*100/2).toFixed(2);return `background-image:url('${CHAR_FILE}');background-position:${x}% ${y}%;background-size:400% 300%;`;}
const colors=[{name:'紅',hex:'#ff1744',hue:0},{name:'粉',hex:'#ff4081',hue:340},{name:'橙',hex:'#ff9100',hue:30},{name:'金',hex:'#ffea00',hue:50},{name:'綠',hex:'#00e676',hue:120},{name:'青',hex:'#00e5ff',hue:180},{name:'藍',hex:'#2979ff',hue:220},{name:'紫',hex:'#d500f9',hue:280},{name:'黑',hex:'#212121',hue:0,filter:'grayscale(1) brightness(0.5)'},{name:'白',hex:'#ffffff',hue:0,filter:'grayscale(1) brightness(1.6)'}];
let curCharId=localStorage.getItem('cg_char')||'mage';let curColorHex=localStorage.getItem('cg_color')||'#a040ff';let curFilter='';let facing='right',isWalking=false;
function getChar(){return baseChars.find(c=>c.id===curCharId)||baseChars[0];}
function getFilterFor(hex){let col=colors.find(c=>c.hex===hex);if(col&&col.filter) return col.filter;let targetHue=col?col.hue:0;let base=getChar().baseHue;let diff=targetHue-base;return `hue-rotate(${diff}deg) saturate(1.4)`;}
let px=1245,py=1070,gold=300,balls=30,dex=new Array(100).fill(false),emy=0,emyHp=100,battle=false,ans=0,input="",stepCount=0,lastBattle=-100,playerLv=1;
function applyChar(){
 let c=getChar();let filter=getFilterFor(curColorHex);curFilter=filter;
 let p=document.getElementById('player');
 let style=charStyle(c)+`width:64px;height:84px;background-color:transparent !important;background-repeat:no-repeat;image-rendering:pixelated;background-size:400% 300%;--cf:${filter};filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 6px gold) drop-shadow(0 0 12px rgba(255,215,0,.9)) ${filter};`;
 p.setAttribute('style',style);p.className=facing + (isWalking?' walking':'');
 document.getElementById('jobTag').innerText=c.name;
 document.getElementById('bJob').innerText=c.atkIcon+' '+c.name;
 document.getElementById('atkBtn').innerText=c.atkIcon+' 攻擊';
 localStorage.setItem('cg_char',curCharId);localStorage.setItem('cg_color',curColorHex);
}
function spawnFx(id,html,x,y,anim,dur=700){let fx=document.getElementById(id);let d=document.createElement('div');d.className='particle';d.innerHTML=html;d.style.left=x+'px';d.style.top=y+'px';d.style.animation=`${anim} ${dur}ms forwards`;fx.appendChild(d);setTimeout(()=>d.remove(),dur);}
function spawnDust(){let wrap=document.getElementById('playerWrap');let r=wrap.getBoundingClientRect();let mw=document.getElementById('mapWrap').getBoundingClientRect();let x=r.left-mw.left+32+(Math.random()*10-5);let y=r.top-mw.top+84;let isWater=window._gy>250&&window._gy<450;if(isWater) spawnFx('fxMap','💦',x,y,'splash',700);else spawnFx('fxMap','💨',x,y,'dust',600);}
function openChar(){
 let c=getChar();
 let html=`<h3>🎨 無方框 + 顏色</h3><div class="charGrid">`;
 baseChars.forEach(ch=>{
   let sel=ch.id===curCharId?'sel':'';let st=charStyle(ch);
   html+=`<div class="charCard ${sel}" onclick="pickChar('${ch.id}')"><div class="charIcon" style="${st}filter:${ch.id===curCharId?curFilter:''};"></div><div style="font-weight:900;font-size:11px">${ch.name}</div></div>`;
 });
 html+=`</div><div class="palette">`;
 colors.forEach(col=>{
   let sel=col.hex===curColorHex?'sel':'';html+=`<div class="colorBtn ${sel}" style="background:${col.hex}" onclick="pickColor('${col.hex}')"></div>`;
 });
 html+=`</div><div style="margin-top:8px">自訂：<input type="color" value="${curColorHex}" oninput="pickColor(this.value)"> ${curColorHex}</div><button onclick="closePop()" style="width:100%;height:44px;margin-top:10px">確定</button>`;
 pop(html);
}
function pickChar(id){curCharId=id;applyChar();openChar();}
function pickColor(hex){curColorHex=hex;applyChar();openChar();}
function getPlayerLv(){return Math.min(20,Math.floor(dex.filter(x=>x).length/5)+1);}function updateLvUI(){playerLv=getPlayerLv();document.getElementById('lv').innerText='Lv'+playerLv;}
function genQuestion(){let a=Math.floor(Math.random()*14)+1,b=Math.floor(Math.random()*14)+1,op='+';if(playerLv>3 && Math.random()<0.5){a=Math.floor(Math.random()*20)+5;b=Math.floor(Math.random()*a);op='-';}ans=op==='+')?a+b:a-b;return {a,b,op,tag:`Lv${playerLv}` };}
const world=document.getElementById('world');
function updateCam(){
 let w=document.getElementById('mapWrap'),W=w.clientWidth,H=w.clientHeight;
 world.style.left=(W/2-px)+'px';world.style.top=(H/2-py)+'px';
 let gx=Math.floor(400 + (px-800)*0.12);let gy=Math.floor(80 + (py-200)*0.11);
 document.getElementById('posXY').innerText=gx+','+gy;document.getElementById('coordTop').innerText=gx+','+gy;window._gx=gx;window._gy=gy;
}
function updateUI(){document.getElementById('gold').innerText=gold;document.getElementById('balls').innerText=balls;document.getElementById('cnt').innerText=dex.filter(x=>x).length+'/100';updateLvUI();}
function setWalking(w){if(w===isWalking) return;isWalking=w;let p=document.getElementById('player');let sh=document.getElementById('shadow');if(w){p.classList.add('walking');sh.style.transform='translateX(-50%) scale(0.7)';}else{p.classList.remove('walking');sh.style.transform='translateX(-50%) scale(1)';}}
let dustTick=0;
function move(dx,dy){
 if(battle) return;
 if(dx!==0){facing=dx>0?'right':'left';}
 let nx=px+dx*20,ny=py+dy*20;
 // 放寬邊界，唔會卡死
 if(nx<100||nx>2900||ny<100||ny>2150){return;}
 setWalking(true);
 px=nx;py=ny;stepCount++;updateCam();
 dustTick++;if(dustTick%2===0) spawnDust();
 document.getElementById('player').className=facing + ' walking';
 if(stepCount-lastBattle>6 && stepCount%7===0 && Math.random()<0.12) startB();
}
function getSpriteStyle(i){let f=i<50?'./6f624645-2a9f-f819-cf87-700a2f37e77b.jpeg':'./41309d37-8713-e0a3-4015-0e51f44b1f6d.jpeg';if(i>=50)i-=50;let c=i%10,r=Math.floor(i/10),x=c*100/9,y=r*100/4;return `background-image:url('${f}');background-position:${x}% ${y}%;`;}
function startB(){setWalking(false);emy=Math.floor(Math.random()*100);emyHp=100;battle=true;lastBattle=stepCount;updateLvUI();document.getElementById('battle').style.display='flex';document.getElementById('ename').innerText=pets[emy].name;document.getElementById('elv').innerText=playerLv;document.getElementById('ehpT').innerText='100%';document.getElementById('bmsg').innerHTML=`No.${String(pets[emy].id).padStart(3,'0')} ${pets[emy].name}`;document.getElementById('eSprite').setAttribute('style',getSpriteStyle(emy)+'width:150px;height:150px;background-size:1000% 500%;image-rendering:pixelated;background-repeat:no-repeat;background-color:#fff;border-radius:12px;');}
function closeB(){document.getElementById('battle').style.display='none';battle=false;lastBattle=stepCount;}
let curQ=null;function makeVerticalHTML(q,inputStr){return `<div class="vertical"><div class="row">&nbsp;${q.a}</div><div class="row"><span class="op">${q.op}</span>${q.b}</div><div class="line"></div><div class="ansBox">${inputStr||'?'}</div></div>`;}
function doAtk(){curQ=genQuestion();let c=getChar();pop(`<h3>${c.name} Lv${playerLv} ${c.atkIcon}</h3>${makeVerticalHTML(curQ,'')}<div class="numpad"><button onclick="addN('1')">1</button><button onclick="addN('2')">2</button><button onclick="addN('3')">3</button><button onclick="addN('4')">4</button><button onclick="addN('5')">5</button><button onclick="addN('6')">6</button><button onclick="addN('7')">7</button><button onclick="addN('8')">8</button><button onclick="addN('9')">9</button><button onclick="clrN()">⌫</button><button onclick="addN('0')">0</button><button class="ok" onclick="chk(false)">OK</button></div>`);input="";}
function trySeal(){if(balls<=0){pop('<h3>無卡</h3>');return;}if(emyHp>60){document.getElementById('bmsg').innerText='仲有'+emyHp+'%血！';return;}curQ=genQuestion();pop(`<h3>🎀 Lv${playerLv} ${getChar().name} 直式封印</h3>${makeVerticalHTML(curQ,'')}<div class="numpad"><button onclick="addN('1')">1</button><button onclick="addN('2')">2</button><button onclick="addN('3')">3</button><button onclick="addN('4')">4</button><button onclick="addN('5')">5</button><button onclick="addN('6')">6</button><button onclick="addN('7')">7</button><button onclick="addN('8')">8</button><button onclick="addN('9')">9</button><button onclick="clrN()">⌫</button><button onclick="addN('0')">0</button><button class="ok" style="background:#e91e63;color:white" onclick="chk(true)">封印</button></div>`);input="";}
function addN(n){input+=n;document.querySelectorAll('.ansBox').forEach(el=>el.innerText=input);}function clrN(){input=input.slice(0,-1);document.querySelectorAll('.ansBox').forEach(el=>el.innerText=input||'?');}
function chk(isSeal){let v=parseInt(input);if(isNaN(v))return;closePop();if(v===ans){if(isSeal){balls--;let ok=Math.random()<0.85;if(ok){dex[emy]=true;gold+=35;closeB();}updateUI();}else{emyHp=Math.max(0,emyHp-35);document.getElementById('ehpT').innerText=emyHp+'%';}}else{if(isSeal){balls--;updateUI();}}}
function pop(h){document.getElementById('popBox').innerHTML=h;document.getElementById('pop').style.display='flex';}function closePop(){document.getElementById('pop').style.display='none';}
function openDex(){let h=`<h3>📖100寵圖鑑 ${dex.filter(x=>x).length}/100</h3><div style="max-height:400px;overflow:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:6px">`;pets.forEach((p,i)=>{h+=`<div style="border:2px solid ${dex[i]?'#ffb300':'#aaa'};border-radius:8px;padding:3px;background:${dex[i]?'#fff8e0':'#eee'};text-align:center"><div class="spriteSmall" style="${getSpriteStyle(i)}"></div><div style="font-size:8px;font-weight:900">${String(p.id).padStart(3,'0')} ${p.name}</div></div>`});h+='</div><button onclick="closePop()" style="margin-top:10px;height:44px;width:100%">關</button>';pop(h);}

// 浮動拉桿修正版
let joy=document.getElementById('joy'),knob=document.getElementById('knob'),drag=false,joyCX=0,joyCY=0,last=0;
let mapWrap=document.getElementById('mapWrap');
function showJoy(x,y){joy.style.left=(x-50)+'px';joy.style.top=(y-50)+'px';joy.style.display='block';joyCX=x;joyCY=y;drag=true;}
function hideJoy(){joy.style.display='none';drag=false;setWalking(false);knob.style.transform='translate(-50%,-50%)';document.getElementById('player').className=facing;}

mapWrap.addEventListener('touchstart',e=>{
 if(battle) return;
 e.preventDefault();
 let t=e.touches[0];let rect=mapWrap.getBoundingClientRect();
 let x=t.clientX-rect.left, y=t.clientY-rect.top;
 if(e.target.closest('#top')) return;
 showJoy(x,y);
},{passive:false});

window.addEventListener('touchend',e=>{
 hideJoy();
},{passive:false});

window.addEventListener('touchmove',e=>{
 if(!drag||battle) return;
 e.preventDefault();
 let t=e.touches[0];let rect=mapWrap.getBoundingClientRect();
 let x=t.clientX-rect.left, y=t.clientY-rect.top;
 let dx=x-joyCX, dy=y-joyCY;
 let dist=Math.sqrt(dx*dx+dy*dy),limit=45;
 if(dist>limit){let ang=Math.atan2(dy,dx);dx=Math.cos(ang)*limit;dy=Math.sin(ang)*limit;}
 knob.style.transform=`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
 let now=Date.now();if(now-last<70) return;last=now;
 let mdx=0,mdy=0;
 if(Math.abs(dx)>12) mdx=dx>0?1:-1;
 if(Math.abs(dy)>12) mdy=dy>0?1:-1;
 if(mdx||mdy) move(mdx,mdy);
},{passive:false});

// 電腦鍵盤都行得
window.addEventListener('keydown',e=>{
 if(battle) return;
 if(e.key==='ArrowLeft'||e.key==='a') move(-1,0);
 if(e.key==='ArrowRight'||e.key==='d') move(1,0);
 if(e.key==='ArrowUp'||e.key==='w') move(0,-1);
 if(e.key==='ArrowDown'||e.key==='s') move(0,1);
});
window.addEventListener('keyup',()=>{setWalking(false);document.getElementById('player').className=facing;});

applyChar();updateCam();updateUI();
</script></body></html>
