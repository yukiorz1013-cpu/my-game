<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DINO 動態4課程 v2</title><style>
body{margin:0;background:#0f0f23;display:flex;justify-content:center;font-family:sans-serif}
#game{width:100%;max-width:420px;background:linear-gradient(#fff8e1,#ffcc80);min-height:100vh;padding:15px;box-sizing:border-box;text-align:center}
.pet-box{background:white;border-radius:24px;padding:15px;margin:10px 0}
.pet-img{width:200px;height:200px;object-fit:contain;display:block;margin:0 auto}
.prog-bg{background:#eee;border-radius:12px;height:22px;overflow:hidden;margin:12px 0}.prog-fill{height:100%;background:#66bb6a;transition:.5s;display:flex;align-items:center;justify-content:center;color:white;font-weight:bold;font-size:13px}
.btn{width:100%;padding:16px;border:none;border-radius:14px;font-size:19px;font-weight:bold;margin:8px 0;cursor:pointer}.btn-go{background:#66bb6a;color:white}.btn-evo{background:gold;display:none;font-size:20px;animation:glow 1s infinite}
@keyframes wobble{0%,100%{transform:rotate(-5deg) translateY(0)}50%{transform:rotate(5deg) translateY(-3px)}}@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}@keyframes happy{0%,100%{transform:scale(1)}50%{transform:scale(1.1) rotate(-2deg)}}@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.ani-egg{animation:wobble 0.6s infinite ease-in-out}.ani-bb{animation:bounce 0.5s infinite ease-in-out}.ani-teen{animation:happy 0.6s infinite ease-in-out}.ani-king{animation:floaty 1.5s infinite ease-in-out}
#mathBox{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:99;display:none}.math-card{background:white;width:90%;max-width:360px;border-radius:20px;padding:22px;text-align:center}.math-card input{font-size:36px;width:150px;padding:12px;border:3px solid orange;border-radius:12px;text-align:center}
@keyframes glow{0%,100%{box-shadow:0 0 5px gold}50%{box-shadow:0 0 18px gold}}
</style></head><body>
<div id="game"><h2>🦖 DINO 動態4課程</h2><p id="lvInfo" style="font-weight:bold"></p><div class="pet-box"><img id="petImg" class="pet-img ani-egg" src="./dino1.png.jpg?v=2"><h3 id="petName"></h3><p id="petSay"></p><div class="prog-bg"><div id="progBar" class="prog-fill" style="width:0%"></div></div><p>總答 <b id="solved">0</b> | 分 <b id="score">0</b></p></div>
<button class="btn btn-go" id="goBtn" onclick="doAction()">▶️ 開始做題</button>
<button class="btn btn-evo" id="evoBtn" onclick="evolve()">⚡️ 進化下一關！</button></div>
<div id="mathBox"><div class="math-card"><div id="mathType" style="color:#888;font-size:13px"></div><h2 id="mathQ"></h2><input id="mathAns" type="number" inputmode="numeric"><br><br><button class="btn" style="background:orange;color:white" onclick="checkMath()">確定</button><br><button class="btn" style="background:#eee" onclick="document.getElementById('mathBox').style.display='none'">取消</button></div></div>
<script>
const pets=[{img:"./dino1.png.jpg?v=2",name:"Lv.1 蛋 - 50內加法",ani:"ani-egg",total:50},{img:"./dino2.png.jpg?v=2",name:"Lv.2 奶樽BB - 50內減法",ani:"ani-bb",total:50},{img:"./dino3.png.WEBP?v=2",name:"Lv.3 橙色火焰龍 - 1-10乘法",ani:"ani-teen",total:100},{img:"./dino4.png.jpg?v=2",name:"Lv.4 龍王 - 99內除法",ani:"ani-king",total:100}];
let petIdx=0,solvedInLv=0,totalSolved=0,score=0,curAns=0;
function updateUI(){let p=pets[petIdx];let img=document.getElementById('petImg');img.src=p.img;img.className='pet-img '+p.ani;document.getElementById('petName').innerText=p.name;document.getElementById('lvInfo').innerText='第'+(petIdx+1)+'關：'+p.name+' (目標'+p.total+'題)';let pct=Math.floor(solvedInLv/p.total*100);let bar=document.getElementById('progBar');bar.style.width=pct+'%';bar.innerText=solvedInLv+'/'+p.total;document.getElementById('solved').innerText=totalSolved;document.getElementById('score').innerText=score;document.getElementById('evoBtn').style.display=solvedInLv>=p.total?'block':'none';document.getElementById('goBtn').style.display=solvedInLv>=p.total?'none':'block';document.getElementById('petSay').innerText=solvedInLv>=p.total?'🎉完成！按進化！':'仲有 '+(p.total-solvedInLv)+' 題進化！';}
function makeQ(){let a,b;if(petIdx===0){a=Math.floor(Math.random()*26);b=Math.floor(Math.random()*(51-a));curAns=a+b;return{type:'50以內加法',q:a+' + '+b+' = ?'};}if(petIdx===1){a=Math.floor(Math.random()*50)+1;b=Math.floor(Math.random()*(a+1));curAns=a-b;return{type:'50以內減法',q:a+' - '+b+' = ?'};}if(petIdx===2){a=Math.floor(Math.random()*10)+1;b=Math.floor(Math.random()*10)+1;curAns=a*b;return{type:'乘數表 1-10',q:a+' × '+b+' = ?'};}if(petIdx===3){b=Math.floor(Math.random()*11)+2;curAns=Math.floor(Math.random()*9)+1;a=b*curAns;return{type:'99內除法',q:a+' ÷ '+b+' = ?'};}}
function doAction(){let qq=makeQ();document.getElementById('mathQ').innerText=qq.q;document.getElementById('mathType').innerText=qq.type;document.getElementById('mathBox').style.display='flex';document.getElementById('mathAns').value='';setTimeout(()=>document.getElementById('mathAns').focus(),150);}
function checkMath(){let v=parseInt(document.getElementById('mathAns').value);if(v===curAns){solvedInLv++;totalSolved++;score+=10;document.getElementById('mathBox').style.display='none';updateUI();}else{alert('錯咗，再試下！正確係 '+curAns);}}
function evolve(){if(solvedInLv>=pets[petIdx].total&&petIdx<3){petIdx++;solvedInLv=0;updateUI();alert('💥 進化成功！變成 '+pets[petIdx].name);}else if(petIdx===3){alert('🏆 龍王畢業！總共完成 '+totalSolved+' 題！');}}
updateUI();
</script></body></html>
