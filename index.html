<!DOCTYPE html><html lang="zh-HK"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>V135 GB捕捉圖鑑</title>
<style>
body{margin:0;background:#1a1a2e;display:flex;justify-content:center;font-family:'Courier New',monospace;-webkit-tap-highlight-color:transparent}
#gb{width:100%;max-width:420px;background:#d0d0b8;padding:18px;box-sizing:border-box;min-height:100vh}
#gb-shell{background:#c2c2a8;border-radius:12px 12px 40px 12px;padding:18px;box-shadow:inset 0 0 0 4px #a8a88e,0 8px 0 #8a8a6e}
#screen{width:100%;aspect-ratio:10/9;background:#9bbc0f;border:10px solid #2a2a2a;border-radius:8px;position:relative;overflow:hidden}
#screen-inner{width:100%;height:100%;background:#9bbc0f;position:relative;display:flex;flex-direction:column}
.battle-top{height:55%;display:flex;position:relative;background:#9bbc0f}
.battle-bottom{height:45%;background:#9bbc0f;border-top:4px solid #0f380f;display:flex}
.enemy-box{position:absolute;top:8px;left:8px;background:#8bac0f;border:3px solid #0f380f;padding:4px 8px;min-width:70px;z-index:2}
.my-box{position:absolute;bottom:8px;right:8px;background:#8bac0f;border:3px solid #0f380f;padding:4px 8px;min-width:70px;z-index:2}
.hp-bar{height:6px;background:#0f380f;width:60px;margin-top:2px;position:relative}
.hp-fill{height:100%;background:#306230;transition:width .4s}
.pet-sprite{position:absolute;image-rendering:pixelated;object-fit:contain;filter:contrast(1.2) sepia(0.6) hue-rotate(50deg) saturate(0.8);transition:transform .3s}
#enemySprite{top:18px;right:18px;width:72px;height:72px}
#mySprite{bottom:8px;left:12px;width:88px;height:88px;transform:scaleX(-1)}
.menu{flex:1;background:#9bbc0f;padding:6px;font-size:12px;font-weight:bold;color:#0f380f}
.menu-opt{padding:4px 8px;margin:2px 0;border:2px solid transparent;cursor:pointer}
.menu-opt.sel{border:2px solid #0f380f;background:#8bac0f}
.menu-opt:active{background:#0f380f;color:#9bbc0f}
.msg-box{position:absolute;bottom:0;left:0;right:0;background:#9bbc0f;border:3px solid #0f380f;margin:4px;padding:6px;font-size:11px;font-weight:bold;color:#0f380f;min-height:32px;z-index:10}
#controls{margin-top:18px;display:flex;justify-content:space-between;align-items:center}
.dpad{width:90px;height:90px;position:relative}.dpad button{position:absolute;background:#2a2a2a;border:none;color:#c2c2a8;font-weight:bold;cursor:pointer}
.dpad .up{left:30px;top:0;width:30px;height:30px}.dpad .down{left:30px;bottom:0;width:30px;height:30px}.dpad .left{left:0;top:30px;width:30px;height:30px}.dpad .right{right:0;top:30px;width:30px;height:30px}.dpad .center{left:30px;top:30px;width:30px;height:30px;background:#1a1a1a}
.ab{width:100px;height:50px;position:relative}.ab button{position:absolute;width:36px;height:36px;border-radius:50%;background:#8a1a4a;border:none;color:white;font-weight:bold;box-shadow:0 3px 0 #5a1030;cursor:pointer}
.ab button:active{transform:translateY(3px);box-shadow:none}.ab .b{left:0;top:14px}.ab .a{right:0;top:0}
.btn{width:100%;padding:10px;border:3px solid #0f380f;background:#8bac0f;color:#0f380f;font-family:'Courier New';font-weight:bold;font-size:11px;margin:4px 0;cursor:pointer}
#mathBox,#dexBox,#ballBox{position:absolute;inset:0;background:#9bbc0f;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;padding:10px;border:4px solid #0f380f}
#mathBox h1{font-size:26px;color:#0f380f;margin:6px}
.ans-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%;max-width:160px}
.ans-grid button{padding:12px;background:#8bac0f;border:3px solid #0f380f;color:#0f380f;font-weight:bold;font-size:18px;cursor:pointer}
.ans-grid button:active{background:#0f380f;color:#9bbc0f}
.dex-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;width:100%}
.dex-card{background:#8bac0f;border:3px solid #0f380f;padding:6px;text-align:center;font-size:10px;font-weight:bold}
.dex-card.caught{background:#306230;color:#9bbc0f;border-color:#0f380f}
.dex-card img{width:48px;height:48px;object-fit:contain;filter:contrast(1.2) sepia(0.6) hue-rotate(50deg) saturate(0.8);display:block;margin:0 auto 4px}
.dex-card.not{opacity:0.35;filter:grayscale(1)}
#ball{font-size:48px;animation:shakeBall 0.6s infinite}
@keyframes shakeBall{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
@keyframes flash{0%,100%{opacity:1}50%{opacity:0.2}}
@keyframes catchShrink{0%{transform:scale(1)}50%{transform:scale(0.6)}100%{transform:scale(0.2);opacity:0}}
</style></head><body>
<div id="gb"><div id="gb-shell">
<div style="text-align:center;color:#5a5a4a;font-size:10px;font-weight:bold;margin-bottom:6px;letter-spacing:2px">● DOT MATRIX WITH STEREO SOUND ●</div>
<div id="screen"><div id="screen-inner">
<div class="battle-top">
<div class="enemy-box"><div style="font-size:9px">野生 <span id="enemyName">Lv.2</span></div><div class="hp-bar"><div id="enemyHp" class="hp-fill" style="width:100%"></div></div></div>
<img id="enemySprite" class="pet-sprite" src="./dino2.png.jpg">
<img id="mySprite" class="pet-sprite" src="./dino1.png.jpg">
<div class="my-box"><div style="font-size:9px"><span id="myName">蛋蛋龍</span> Lv.<span id="myLv">1</span></div><div class="hp-bar"><div id="myHp" class="hp-fill" style="width:100%"></div></div><div style="font-size:8px"><span id="myHpTxt">20/20</span></div></div>
</div>
<div class="battle-bottom">
<div class="menu" id="menu1"><div class="menu-opt sel" onclick="doAction('fight')">▶ たたかう</div><div class="menu-opt" onclick="doAction('ball')">ボール</div><div class="menu-opt" onclick="doAction('dex')">ズカン</div><div class="menu-opt" onclick="doAction('evo')">しんか</div></div>
<div class="menu" id="menu2" style="display:none"><div style="font-size:9px;margin-bottom:4px">わざを えらんで！</div><div class="menu-opt sel" onclick="chooseMove(0)">ひのこ +</div><div class="menu-opt" onclick="chooseMove(1)">たいあたり -</div><div class="menu-opt" onclick="chooseMove(2)">かえん ×</div><div class="menu-opt" onclick="chooseMove(3)">もどる</div></div>
</div>
<div class="msg-box" id="msgBox">やせいの ディノが あらわれた！ ずかん 2/4</div>
<div id="mathBox"><h1 id="mQ">5+3=?</h1><div style="font-size:28px;font-weight:bold;color:#0f380f;background:#8bac0f;border:3px solid #0f380f;padding:6px 16px;min-width:60px;text-align:center;margin:8px" id="ansD">?</div><div class="ans-grid"><button onclick="addNum('1')">1</button><button onclick="addNum('2')">2</button><button onclick="addNum('3')">3</button><button onclick="addNum('4')">4</button><button onclick="addNum('5')">5</button><button onclick="addNum('6')">6</button><button onclick="addNum('7')">7</button><button onclick="addNum('8')">8</button><button onclick="addNum('9')">9</button><button onclick="clearNum()">C</button><button onclick="addNum('0')">0</button><button style="background:#0f380f;color:#9bbc0f" onclick="checkAns()">A</button></div><button class="btn" onclick="hideMath()">B もどる</button></div>
<div id="ballBox"><div id="ball">🔴⚪</div><div style="font-size:11px;font-weight:bold;margin-top:8px" id="ballMsg">モンスターボールを なげた！</div><div style="font-size:26px;font-weight:bold;margin:8px" id="ballQ">6+2=?</div><div style="font-size:28px;font-weight:bold;background:#8bac0f;border:3px solid #0f380f;padding:4px 14px;min-width:50px;text-align:center" id="ballAns">?</div><div class="ans-grid" style="margin-top:8px"><button onclick="addBallNum('1')">1</button><button onclick="addBallNum('2')">2</button><button onclick="addBallNum('3')">3</button><button onclick="addBallNum('4')">4</button><button onclick="addBallNum('5')">5</button><button onclick="addBallNum('6')">6</button><button onclick="addBallNum('7')">7</button><button onclick="addBallNum('8')">8</button><button onclick="addBallNum('9')">9</button><button onclick="clearBallNum()">C</button><button onclick="addBallNum('0')">0</button><button style="background:#0f380f;color:#9bbc0f" onclick="checkBall()">A</button></div></div>
<div id="dexBox"><div style="font-size:12px;font-weight:bold;margin-bottom:6px">📖 ポケモンずかん <span id="dexCount">1/4</span></div><div class="dex-grid" id="dexGrid"></div><button class="btn" onclick="closeDex()">B とじる</button></div>
</div></div>
<div style="display:flex;justify-content:space-between;margin-top:8px;color:#5a5a4a;font-size:8px;font-weight:bold"><span>Nintendo GAME BOY™</span><span>🔋</span></div>
<div id="controls"><div class="dpad"><button class="up">▲</button><button class="down">▼</button><button class="left">◀</button><button class="right">▶</button><button class="center"></button></div><div style="text-align:center;font-size:8px;color:#5a5a4a">SELECT START</div><div class="ab"><button class="b" onclick="pressB()">B</button><button class="a" onclick="pressA()">A</button></div></div>
<button class="btn" onclick="toggleMusic()" style="margin-top:12px">🎵 <span id="musicLabel">GAMEBOY かわいい 有尾音</span></button>
</div>
<div style="text-align:center;margin-top:10px;color:#a8a88e;font-size:9px">V135 捕捉+圖鑑 | ?v=135 | 無篤無烏可愛有尾音</div>
</div>
<script>
const pets=[{img:"./dino1.png.jpg",name:"蛋蛋龍",maxHp:20,desc:"たまごから うまれた ちいさな ディノ"},{img:"./dino2.png.jpg",name:"BB龍",maxHp:24,desc:"まだ よわいが ゆうきが ある"},{img:"./dino3.png.WEBP",name:"火焰龍",maxHp:28,desc:"ほのおを はくように なった"},{img:"./dino4.png.jpg",name:"霸王龍",maxHp:32,desc:"りくの おうじゃ きょうりょく"}];
let petIdx=0,enemyIdx=1,myHp=20,myMax=20,enemyHp=20,enemyMax=20,ans=0,ballAns=0,curInput="",ballInput="",ac=null,bgmTimer=null,currentMusic='gb',masterVol=0.032;
let dex=JSON.parse(localStorage.getItem('yuki_dex135')||'[true,false,false,false]'); // 已捉
let saved=JSON.parse(localStorage.getItem('yuki_gb135')||'{}');if(saved.petIdx!=null)petIdx=saved.petIdx;
function ensureAudio(){try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return true;}catch(e){return false;}}
function msg(t){document.getElementById('msgBox').innerText=t;}
function updateSprites(){document.getElementById('mySprite').src=pets[petIdx].img;document.getElementById('enemySprite').src=pets[enemyIdx].img;document.getElementById('myName').innerText=pets[petIdx].name;document.getElementById('myLv').innerText=petIdx+1;document.getElementById('enemyName').innerText=pets[enemyIdx].name;myMax=pets[petIdx].maxHp;enemyMax=pets[enemyIdx].maxHp;document.getElementById('myHpTxt').innerText=myHp+'/'+myMax;updateDexCount();}
function updateHp(){document.getElementById('myHp').style.width=(myHp/myMax*100)+'%';document.getElementById('enemyHp').style.width=(enemyHp/enemyMax*100)+'%';document.getElementById('myHpTxt').innerText=myHp+'/'+myMax;}
function updateDexCount(){let c=dex.filter(Boolean).length;document.getElementById('dexCount').innerText=c+'/4';document.getElementById('msgBox').innerText='やせいの '+pets[enemyIdx].name+'が あらわれた！ ずかん '+c+'/4';}
function noteGB(t0,f,isLong,vel){
 try{let dur=isLong?0.62:0.32;let o=ac.createOscillator(),g=ac.createGain();o.type='square';let vol=masterVol*(isLong?0.42:0.34)*vel;g.gain.setValueAtTime(0.0001,t0);g.gain.linearRampToValueAtTime(vol,t0+0.02);g.gain.linearRampToValueAtTime(vol*0.32,t0+0.18);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);o.frequency.value=f;o.connect(g);g.connect(ac.destination);o.start(t0);o.stop(t0+dur);let o2=ac.createOscillator(),g2=ac.createGain();o2.type='sine';o2.frequency.value=f*2;g2.gain.setValueAtTime(0.0001,t0);g2.gain.linearRampToValueAtTime(masterVol*0.12*vel,t0+0.02);g2.gain.exponentialRampToValueAtTime(0.0001,t0+0.55);o2.connect(g2);g2.connect(ac.destination);o2.start(t0);o2.stop(t0+0.55);}catch(e){}
}
function playGB(){if(bgmTimer)clearInterval(bgmTimer);let mel=[659,784,880,784,659,784,659,523,587,659,784,659,523,659,587,523,659,784,880,1047,880,784,659,784,659,698,784,698,659,523,659,0];let i=0;function tick(){if(currentMusic==='mute')return;if(!ensureAudio())return;let t0=ac.currentTime+0.02;let f=mel[i%32];if(f!==0){let isLong=i%8===7;noteGB(t0,f,isLong,0.88);}i++;}tick();bgmTimer=setInterval(tick,280);}
function playCurrent(){if(currentMusic==='gb'){ensureAudio();playGB();}else{if(bgmTimer){clearInterval(bgmTimer);bgmTimer=null;}}}
function sfxGB(t0,f,dur,type){try{let o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0.0001,t0);g.gain.linearRampToValueAtTime(masterVol*0.85,t0+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);o.connect(g);g.connect(ac.destination);o.start(t0);o.stop(t0+dur);}catch(e){}}
function doAction(a){
 if(a==='fight'){document.getElementById('menu1').style.display='none';document.getElementById('menu2').style.display='block';msg('わざを えらんで！');}
 else if(a==='ball'){
  if(enemyHp/enemyMax>0.3){msg('まだ たいりょくが ある！ もっと よわらせて！');return;}
  let a1=Math.floor(Math.random()*20)+1,b1=Math.floor(Math.random()*10)+1;ballAns=a1+b1;document.getElementById('ballQ').innerText=a1+'+'+b1+'=?';ballInput="";document.getElementById('ballAns').innerText="?";document.getElementById('ballBox').style.display='flex';document.getElementById('ballMsg').innerText='モンスターボールを なげた！ 正解で ゲット！';
 }
 else if(a==='dex'){openDex();}
 else if(a==='evo'){if(petIdx<3){petIdx++;myHp=pets[petIdx].maxHp;dex[petIdx]=true;localStorage.setItem('yuki_dex135',JSON.stringify(dex));updateSprites();updateHp();msg('おめでとう！ '+pets[petIdx].name+'に しんかした！ ずかん とうろく！');sfxGB(ac.currentTime,880,0.6,'square');localStorage.setItem('yuki_gb135',JSON.stringify({petIdx}));}else{msg('これいじょう しんかしない！');}}
}
function chooseMove(m){
 if(m===3){document.getElementById('menu1').style.display='block';document.getElementById('menu2').style.display='none';msg('どうする？');return;}
 let a,b,q;if(m===0){a=Math.floor(Math.random()*26);b=Math.floor(Math.random()*(51-a));ans=a+b;q=a+' + '+b+' = ?';}
 else if(m===1){a=Math.floor(Math.random()*50)+1;b=Math.floor(Math.random()*(a+1));ans=a-b;q=a+' - '+b+' = ?';}
 else if(m===2){a=Math.floor(Math.random()*9)+1;b=Math.floor(Math.random()*9)+1;ans=a*b;q=a+' × '+b+' = ?';}
 document.getElementById('mQ').innerText=q;curInput="";document.getElementById('ansD').innerText="?";document.getElementById('mathBox').style.display='flex';
}
function addNum(n){curInput=(curInput||"")+n;if(curInput.length>3)curInput=curInput.slice(0,3);document.getElementById('ansD').innerText=curInput;}
function clearNum(){curInput=curInput.slice(0,-1);document.getElementById('ansD').innerText=curInput||"?";}
function hideMath(){document.getElementById('mathBox').style.display='none';}
function checkAns(){let v=parseInt(curInput);if(isNaN(v))return;if(v===ans){enemyHp=Math.max(0,enemyHp-8);updateHp();hideMath();msg('こうかは ばつぐんだ！');let spr=document.getElementById('enemySprite');spr.style.animation='flash .12s 3';setTimeout(()=>spr.style.animation='',400);sfxGB(ac.currentTime,659,0.18,'square');sfxGB(ac.currentTime+0.12,1047,0.28,'square');if(enemyHp<=0){msg('やせいの '+pets[enemyIdx].name+'は たおれた！ ボールで つかまえよう！');}setTimeout(()=>{document.getElementById('menu1').style.display='block';document.getElementById('menu2').style.display='none';},1200);}else{myHp=Math.max(0,myHp-4);updateHp();hideMath();msg('はずれた...');let spr=document.getElementById('mySprite');spr.style.animation='shake .2s';setTimeout(()=>spr.style.animation='',220);sfxGB(ac.currentTime,120,0.2,'sawtooth');if(myHp<=0){setTimeout(()=>{myHp=myMax;updateHp();msg('ポケモンセンターに もどった！');},1000);}setTimeout(()=>{document.getElementById('menu1').style.display='block';document.getElementById('menu2').style.display='none';},1200);curInput="";}}
// 捕捉
function addBallNum(n){ballInput=(ballInput||"")+n;if(ballInput.length>3)ballInput=ballInput.slice(0,3);document.getElementById('ballAns').innerText=ballInput;}
function clearBallNum(){ballInput=ballInput.slice(0,-1);document.getElementById('ballAns').innerText=ballInput||"?";}
function checkBall(){
 let v=parseInt(ballInput);if(isNaN(v))return;
 if(v===ballAns){
  document.getElementById('ballMsg').innerText='やったー！ つかまえた！';
  let spr=document.getElementById('enemySprite');spr.style.animation='catchShrink 0.8s forwards';
  sfxGB(ac.currentTime,523,0.15,'square');sfxGB(ac.currentTime+0.15,659,0.15,'square');sfxGB(ac.currentTime+0.30,784,0.15,'square');sfxGB(ac.currentTime+0.45,1047,0.5,'square');
  dex[enemyIdx]=true;localStorage.setItem('yuki_dex135',JSON.stringify(dex));
  setTimeout(()=>{document.getElementById('ballBox').style.display='none';spr.style.animation='';enemyIdx=(enemyIdx+1)%4;if(enemyIdx===petIdx)enemyIdx=(enemyIdx+1)%4;enemyHp=pets[enemyIdx].maxHp;updateSprites();updateHp();msg(pets[enemyIdx].name+'を ずかんに とうろく！ '+dex.filter(Boolean).length+'/4');},1500);
 }else{
  document.getElementById('ballMsg').innerText='あ！ ボールから でてきた！ もういちど！';
  sfxGB(ac.currentTime,100,0.3,'sawtooth');setTimeout(()=>{document.getElementById('ballBox').style.display='none';},1000);
 }
}
function openDex(){
 let grid=document.getElementById('dexGrid');grid.innerHTML='';
 pets.forEach((p,i)=>{
  let caught=dex[i];
  let div=document.createElement('div');div.className='dex-card '+(caught?'caught':'not');
  div.innerHTML=`<img src="${p.img}"><div>No.${String(i+1).padStart(3,'0')} ${p.name}</div><div style="font-size:8px">${caught?p.desc:'???'}</div><div style="font-size:8px;margin-top:2px">${caught?'✔ 捕獲':'未捕獲'}</div>`;
  if(caught)div.onclick=()=>{petIdx=i;myHp=pets[i].maxHp;updateSprites();updateHp();closeDex();msg(p.name+'を くりだした！');localStorage.setItem('yuki_gb135',JSON.stringify({petIdx}));};
  grid.appendChild(div);
 });
 document.getElementById('dexBox').style.display='flex';document.getElementById('dexCount').innerText=dex.filter(Boolean).length+'/4';
}
function closeDex(){document.getElementById('dexBox').style.display='none';}
function pressA(){if(document.getElementById('ballBox').style.display==='flex'){checkBall();}else if(document.getElementById('mathBox').style.display==='flex'){checkAns();}else{doAction('fight');}ensureAudio();if(!bgmTimer&&currentMusic!=='mute')playGB();}
function pressB(){hideMath();document.getElementById('ballBox').style.display='none';document.getElementById('dexBox').style.display='none';document.getElementById('menu1').style.display='block';document.getElementById('menu2').style.display='none';msg('どうする？');}
function toggleMusic(){currentMusic=currentMusic==='gb'?'mute':'gb';document.getElementById('musicLabel').innerText=currentMusic==='gb'?'GAMEBOY かわいい 有尾音':'ミュート';if(bgmTimer){clearInterval(bgmTimer);bgmTimer=null;}playCurrent();}
updateSprites();updateHp();document.body.addEventListener('touchstart',function once(){ensureAudio();playCurrent();document.body.removeEventListener('touchstart',once);},{passive:true});
</script></body></html>
