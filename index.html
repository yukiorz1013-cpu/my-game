<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dino 課程版</title><style>body{margin:0;background:#0f0f23;display:flex;justify-content:center;font-family:sans-serif}#game{width:100%;max-width:430px;background:linear-gradient(#fff8e1,#ffcc80);min-height:100vh;padding:15px;box-sizing:border-box;text-align:center}.pet-box{background:white;border-radius:24px;padding:15px;margin:10px 0;box-shadow:0 8px 20px #0002}.pet-img{width:220px;height:220px;object-fit:contain}.bars{display:flex;gap:8px;margin:10px 0}.bar{flex:1;background:#eee;border-radius:10px;height:18px;position:relative;overflow:hidden}.bar-fill{height:100%;transition:.5s;display:flex;align-items:center;justify-content:center;color:#000;font-size:11px;font-weight:bold}.btn{width:100%;padding:14px;border:none;border-radius:14px;font-size:17px;font-weight:bold;margin:6px 0;cursor:pointer}.btn-go{background:#66bb6a;color:white;font-size:20px}.btn-evo{background:gold;display:none;font-size:20px;animation:pop .6s infinite alternate}@keyframes pop{from{transform:scale(1)}to{transform:scale(1.05)}}#mathBox{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:99;display:none}.math-card{background:white;width:92%;max-width:360px;border-radius:22px;padding:22px}.math-card input{font-size:34px;width:140px;padding:10px;border:3px solid orange;border-radius:12px;text-align:center}</style></head><body>
<div id="game">
<h2>🦖 DINO 4階段課程</h2><p id="lvInfo" style="font-weight:bold;color:#5d4037"></p>
<div class="pet-box">
<img id="petImg" class="pet-img" src="IMG_9691.png">
<h3 id="petName">Lv.1 蛋 - 50內加法</h3><p id="petSay">加法特訓開始！</p>
<div class="bars"><div class="bar"><div id="progBar" class="bar-fill" style="width:0%;background:#66bb6a">0/50</div></div></div>
<p>已答 <b id="solved">0</b> | 分數 <b id="score">0</b></p>
</div>
<button class="btn btn-go" id="goBtn" onclick="doAction()">▶️ 開始做題</button>
<button class="btn btn-evo" id="evoBtn" onclick="evolve()">⚡️ 進化下一關！</button>
<p style="font-size:11px;color:#666">yukiorz1013-cpu.github.io/my-game/</p>
</div>
<div id="mathBox"><div class="math-card"><div id="mathType" style="font-size:14px;color:#888"></div><h2 id="mathQ" style="font-size:32px">5+7=?</h2><input id="mathAns" type="number" inputmode="numeric"><br><br><button class="btn" style="background:orange;color:white" onclick="checkMath()">確定</button><p id="hint" style="color:#888">加油！</p></div></div>
<script>
const pets=[
{img:"IMG_9691.png",name:"Lv.1 蛋 - 50內加法",total:50},
{img:"IMG_9688.png",name:"Lv.2 Baby - 50內減法",total:50},
{img:"IMG_9689.png",name:"Lv.3 Teen - 1-10乘法",total:100},
{img:"IMG_9690.png",name:"Lv.4 龍王 - 99內除法",total:100}
];
let petIdx=0,solvedInLv=0,totalSolved=0,score=0,curAns=0;

function updateUI(){
let p=pets[petIdx];
document.getElementById('petImg').src=p.img;
document.getElementById('petName').innerText=p.name;
document.getElementById('lvInfo').innerText=`第 ${petIdx+1} 關：${p.name} (目標 ${p.total}題)`;
let percent=Math.min(100, Math.floor(solvedInLv/p.total*100));
document.getElementById('progBar').style.width=percent+'%';
document.getElementById('progBar').innerText=solvedInLv+'/'+p.total;
document.getElementById('solved').innerText=totalSolved;
document.getElementById('score').innerText=score;
document.getElementById('evoBtn').style.display=solvedInLv>=p.total?'block':'none';
document.getElementById('goBtn').style.display=solvedInLv>=p.total?'none':'block';
if(solvedInLv>=p.total){
document.getElementById('petSay').innerText=`完成 ${p.total}題！可以進化喇！`;
document.getElementById('goBtn').innerText='已完成此關';
}else{
let remain=p.total-solvedInLv;
document.getElementById('petSay').innerText=`仲有 ${remain} 題就進化！加油！`;
document.getElementById('goBtn').innerText=`▶️ 繼續 ${p.name.split('-')[1]||'做題'}`;
}
}

function makeQ(){
let a,b;
if(petIdx===0){ // 50內加法
a=Math.floor(Math.random()*26); b=Math.floor(Math.random()*26);
if(a+b>50){a=Math.floor(Math.random()*21); b=Math.floor(Math.random()*(51-a));}
curAns=a+b; return {q:`${a} + ${b} = ?`,type:"50以內加法",hint:`${a}+${b}`};
}
if(petIdx===1){ // 50內減法
a=Math.floor(Math.random()*50)+1; b=Math.floor(Math.random()*(a+1));
curAns=a-b; return {q:`${a} - ${b} = ?`,type:"50以內減法"};
}
if(petIdx===2){ // 1-10乘法
a=Math.floor(Math.random()*10)+1; b=Math.floor(Math.random()*10)+1;
curAns=a*b; return {q:`${a} × ${b} = ?`,type:"乘數表 1-10"};
}
if(petIdx===3){ // 99內除法，整除，雙位被除數/單位或雙位除數
// 製造整除：先出 b(2-12) 和 ans(1-9)，a=b*ans <=99，盡量令 a 雙位
let tries=0;
do{
let divisor=Math.floor(Math.random()*89)+11; // 11-99 雙位除數 試下
// 如果雙位除數太難，50%機會用 2-12
if(Math.random()<0.6) divisor=Math.floor(Math.random()*11)+2;
let ans=Math.floor(Math.random()*9)+1;
a=divisor*ans;
tries++;
}while(a>99 && tries<20);
let divisor=Math.floor(a/curAns) || 2;
if(!a || a>99 || a%divisor!==0){ // fallback 簡單版
b=Math.floor(Math.random()*9)+2; curAns=Math.floor(Math.random()*11)+1; a=b*curAns;
if(a>99){b=5; curAns=8; a=40;}
return {q:`${a} ÷ ${b} = ?`,type:"99內除法 (整除)"};
}
b=a/curAns; // 修正
// 重算確保 a<=99
b=Math.floor(Math.random()*11)+2; curAns=Math.floor(Math.random()*9)+1; a=b*curAns; if(a>99){b=3; curAns=7; a=21;}
return {q:`${a} ÷ ${b} = ?`,type:"99內除法 (被除數雙位)"};
}
}

function doAction(){
let qq=makeQ();
document.getElementById('mathQ').innerText=qq.q;
document.getElementById('mathType').innerText=qq.type;
document.getElementById('mathBox').style.display='flex';
document.getElementById('mathAns').value='';
setTimeout(()=>document.getElementById('mathAns').focus(),100);
}

function checkMath(){
let v=parseInt(document.getElementById('mathAns').value);
if(v===curAns){
solvedInLv++; totalSolved++; score+=10;
document.getElementById('mathBox').style.display='none';
let img=document.getElementById('petImg');img.style.transform='scale(1.15)';setTimeout(()=>img.style.transform='scale(1)',250);
updateUI();
if(solvedInLv>=pets[petIdx].total && petIdx<3){
setTimeout(()=>alert(`🎉 完成 ${pets[petIdx].total} 題！可以進化喇！`),300);
}
if(petIdx===3 && solvedInLv>=100){
setTimeout(()=>alert(`🏆 終極龍王畢業！你完成晒 ${totalSolved} 題！你是數學龍王！`),300);
}
}else{
document.getElementById('hint').innerText='錯咗，再諗下！💪';
document.getElementById('hint').style.color='red';
setTimeout(()=>{document.getElementById('hint').innerText='加油！';document.getElementById('hint').style.color='#888';},1000);
}
}

function evolve(){
if(solvedInLv>=pets[petIdx].total && petIdx<3){
petIdx++; solvedInLv=0; updateUI(); alert('✨ 進化！進入
