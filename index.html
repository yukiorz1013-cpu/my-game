<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pikachu Pet - P1 Math</title>
<style>
body{margin:0;background:#1a1a2e;font-family:sans-serif;display:flex;justify-content:center}
#game{width:100%;max-width:420px;background:linear-gradient(#ffecb3,#ffcc80);min-height:100vh;position:relative;padding:15px;box-sizing:border-box;text-align:center}
.pet-box{background:white;border-radius:28px;padding:20px;margin:15px 0;box-shadow:0 8px 20px #0002}
.pet{font-size:90px;transition:0.3s;display:block}
.pet.jump{transform:translateY(-20px) scale(1.1)}
.bars{display:flex;gap:10px;margin:15px 0}
.bar{flex:1;background:#eee;border-radius:12px;height:18px;overflow:hidden;text-align:left;position:relative}
.bar-fill{height:100%;transition:0.5s}
.bar span{position:absolute;left:6px;top:-2px;font-size:11px;font-weight:bold}
.btn{width:100%;padding:16px;border:none;border-radius:16px;font-size:18px;font-weight:bold;margin:8px 0;cursor:pointer;box-shadow:0 4px 0 #0002}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn-feed{background:#66bb6a;color:white}
.btn-play{background:#42a5f5;color:white}
.btn-evo{background:linear-gradient(#ffeb3b,#ff9800);color:#333;font-size:22px;display:none}
#mathBox{position:fixed;top:0;left:0;right:0;bottom:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:99;display:none}
.math-card{background:white;width:90%;max-width:360px;border-radius:24px;padding:25px;box-shadow:0 20px 50px #0005}
.math-card h2{font-size:36px;margin:10px 0}
.math-card input{font-size:32px;width:140px;padding:12px;border:4px solid #ff9800;border-radius:16px;text-align:center}
</style>
</head>
<body>
<div id="game">
<h2>🐣 PIKACHU PET 育成</h2>
<p>P1 20以內加減 | 養大佢靠你！</p>

<div class="pet-box">
<span class="pet" id="pet">🐹</span>
<h3 id="petName">Pichu BB - Lv.1</h3>
<p id="petSay">好肚餓呀... 餵我啦！(>_<)</p>
<div class="bars">
<div class="bar"><div class="bar-fill" id="hungerBar" style="width:60%;background:#66bb6a"></div><span>🍙 肚餓</span></div>
<div class="bar"><div class="bar-fill" id="happyBar" style="width:50%;background:#42a5f5"></div><span>💙 開心</span></div>
</div>
<div class="bars">
<div class="bar"><div class="bar-fill" id="evoBar" style="width:0%;background:gold"></div><span>⚡️ 進化</span></div>
</div>
<p>已答啱 <b id="solved">0</b> 題 | 今日分數 <b id="score">0</b></p>
</div>

<button class="btn btn-feed" onclick="doAction('feed')">🍙 餵食 - 加法題 (補肚餓)</button>
<button class="btn btn-play" onclick="doAction('play')">⚽️ 陪玩 - 減法題 (加開心)</button>
<button class="btn btn-evo" id="evoBtn" onclick="evolve()">⚡️ 進化！EVOLVE！</button>

<p style="font-size:12px;color:#666;margin-top:15px">每答啱1題 +10分<br>儲滿3能量可進化<br>yukiorz1013-cpu.github.io/my-game/</p>
</div>

<div id="mathBox">
<div class="math-card">
<div style="font-size:50px" id="mathIcon">🍙</div>
<h2 id="mathQ">5 + 7 = ?</h2>
<input id="mathAns" type="number" inputmode="numeric" placeholder="?">
<br><br>
<button class="btn btn-feed" onclick="checkMath()" style="background:#ff9800">確定 OK</button>
<p id="hint" style="color:#888;font-size:14px">答啱先餵到呀！</p>
</div>
</div>

<script>
let hunger=60, happy=50, evo=0, solved=0, score=0, level=1, curAns=0, curAction='feed';
let pets=[
 {emoji:'🐣', name:'Pichu 蛋', say:['好凍...','幫我孵蛋啦！']},
 {emoji:'🐹', name:'Pichu BB - Lv.1', say:['好肚餓呀...','想食嘢！','(>_<)']},
 {emoji:'⚡️🐹', name:'Pikachu - Lv.2', say:['Pika Pika!','我識放電喇！','再餵多啲！']},
 {emoji:'⚡️🦁', name:'Raichu - Lv.3 MAX', say:['我係大佬喇！','多謝你養大我！','Pika~超開心！']}
];
let petIdx=1;
function updatePet(){
 document.getElementById('pet').innerText=pets[petIdx].emoji;
 document.getElementById('petName').innerText=pets[petIdx].name;
 document.getElementById('petSay').innerText=pets[petIdx].say[Math.floor(Math.random()*pets[petIdx].say.length)];
 document.getElementById('hungerBar').style.width=hunger+'%';
 document.getElementById('happyBar').style.width=happy+'%';
 document.getElementById('evoBar').style.width=evo+'%';
 document.getElementById('solved').innerText=solved;
 document.getElementById('score').innerText=score;
 document.getElementById('evoBtn').style.display=evo>=100?'block':'none';
 if(hunger<20) document.getElementById('petSay').innerText='餓到暈...快餵我！';
}
function doAction(type){
 curAction=type;
 let a,b;
 if(type=='feed'){ // addition <=20
  a=Math.floor(Math.random()*10)+2; b=Math.floor(Math.random()*(19-a))+1; curAns=a+b;
  document.getElementById('mathQ').innerText=`${a} + ${b} = ?`; document.getElementById('mathIcon').innerText='🍙';
 }else{ // play subtraction <=20
  a=Math.floor(Math.random()*10)+11; b=Math.floor(Math.random()*(a-1))+1; curAns=a-b;
  document.getElementById('mathQ').innerText=`${a} - ${b} = ?`; document.getElementById('mathIcon').innerText='⚽️';
 }
 document.getElementById('mathBox').style.display='flex';
 document.getElementById('mathAns').value=''; setTimeout(()=>document.getElementById('mathAns').focus(),100);
}
function checkMath(){
 let v=parseInt(document.getElementById('mathAns').value);
 if(v===curAns){
  solved++; score+=10; evo=Math.min(100,evo+20);
  if(curAction=='feed') hunger=Math.min(100,hunger+25); else happy=Math.min(100,happy+25);
  document.getElementById('mathBox').style.display='none';
  // anim
  let p=document.getElementById('pet'); p.classList.add('jump'); setTimeout(()=>p.classList.remove('jump'),300);
  updatePet();
  if(solved%3==0) document.getElementById('petSay').innerText='好味！再嚟！Yummy!';
  if(evo>=100) document.getElementById('petSay').innerText='我準備好進化喇！按進化！⚡️';
 }else{
  document.getElementById('hint').innerText='錯咗，再試下！💪'; document.getElementById('hint').style.color='red';
  setTimeout(()=>{document.getElementById('hint').innerText='答啱先餵到呀！'; document.getElementById('hint').style.color='#888';},1200);
 }
}
function evolve(){
 if(petIdx<3){petIdx++; level++; evo=0; hunger=70; happy=70; updatePet();
  alert(`🎉 進化成功！變成 ${pets[petIdx].name}！\nEvolved!`);
 }else{
  alert(`🏆 你已經養到最勁嘅 Raichu 喇！總共答啱 ${solved} 題！\nYou are a great trainer!`);
 }
}
// auto drop
setInterval(()=>{hunger=Math.max(0,hunger-2); happy=Math.max(0,happy-1); if(hunger<10||happy<10){document.getElementById('petSay').innerText='我唔舒服...';} updatePet();},3000);
updatePet();
document.getElementById('mathAns').addEventListener('keydown',e=>{if(e.key=='Enter') checkMath();});
</script>
</body>
</html>
