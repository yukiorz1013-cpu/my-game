<!DOCTYPE html><html lang="zh-HK"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yuki恐龍數學王 旗艦版</title><style>
body{margin:0;background:#0f0f23;display:flex;justify-content:center;font-family:sans-serif}
#game{width:100%;max-width:440px;background:linear-gradient(#fff8e1,#ffcc80);min-height:100vh;padding:14px;box-sizing:border-box;text-align:center}
.pet-box{background:white;border-radius:24px;padding:14px;margin:10px 0;position:relative}
.pet-img{width:200px;height:200px;object-fit:contain;display:block;margin:0 auto}
.star-bar{position:absolute;top:10px;right:14px;font-size:18px}
.prog-bg{background:#eee;border-radius:12px;height:22px;overflow:hidden;margin:10px 0}.prog-fill{height:100%;background:#66bb6a;display:flex;align-items:center;justify-content:center;color:white;font-weight:bold;font-size:13px;transition:.5s}
.btn{width:100%;padding:14px;border:none;border-radius:14px;font-size:18px;font-weight:bold;margin:6px 0;cursor:pointer}.btn-go{background:#66bb6a;color:white}.btn-evo{background:gold;display:none;animation:glow 1s infinite}.btn-small{background:#fff3e0;font-size:14px;padding:8px}
@keyframes wobble{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}@keyframes happy{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.ani-egg{animation:wobble .6s infinite}.ani-bb{animation:bounce .5s infinite}.ani-teen{animation:happy .6s infinite}.ani-king{animation:floaty 1.5s infinite}
#mathBox{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:99;display:none}.math-card{background:white;width:92%;max-width:380px;border-radius:20px;padding:20px;text-align:center}.math-card input{font-size:36px;width:150px;padding:10px;border:3px solid orange;border-radius:12px;text-align:center}
#report{margin-top:12px;background:#fffde7;border-radius:14px;padding:10px;font-size:13px;text-align:left}
@keyframes glow{0%,100%{box-shadow:0 0 5px gold}50%{box-shadow:0 0 18px gold}}
</style></head><body>
<div id="game">
<h2>🦖 Yuki恐龍數學王</h2>
<p id="lvInfo" style="font-weight:bold"></p>
<div class="pet-box">
<div class="star-bar">⭐ x <span id="starCount">0</span></div>
<img id="petImg" class="pet-img ani-egg" src="./dino1.png.jpg?v=3">
<h3 id="petName"></h3><p id="petSay"></p>
<div class="prog-bg"><div id="progBar" class="prog-fill" style="width:0%"></div></div>
<p>總答 <b id="solved">0</b> | 分 <b id="score">0</b></p>
</div>
<button class="btn btn-go" id="goBtn" onclick="doAction()">▶️ 開始做題 (會讀題)</button>
<button class="btn btn-evo" id="evoBtn" onclick="evolve()">⚡️ 進化下一關！</button>
<button class="btn btn-small" onclick="toggleReport()">👨‍👩‍👧 家長報表 (今日統計)</button>
<div id="report" style="display:none"></div>
</div>

<div id="mathBox"><div class="math-card">
<div id="mathType" style="color:#888;font-size:13px"></div>
<h2 id="mathQ"></h2>
<input id="mathAns" type="number" inputmode="numeric"><br><br>
<button class="btn" style="background:orange;color:white" onclick="checkMath()">確定</button>
<button class="btn" style="background:#eee" onclick="document.getElementById('mathBox').style.display='none'">取消</button>
<label style="display:block;margin-top:10px;font-size:13px"><input type="checkbox" id="voiceOn" checked> 🗣️ 廣東話讀題</label>
</div></div>

<script>
// 音效 (WebAudio 無需檔案)
let ac;function beep(f,d,t){try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();let o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type=t||'sine';o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(0.3,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.01,ac.currentTime+d);o.start();o.stop(ac.currentTime+d);}catch(e){}}
function sCorrect(){beep(800,0.2,'sine');setTimeout(()=>beep(1200,0.3,'sine'),120);}
function sWrong(){beep(200,0.4,'sawtooth');}
function sEvo(){beep(300,0.2,'triangle');setTimeout(()=>beep(600,0.2,'triangle'),150);setTimeout(()=>beep(1000,0.6,'triangle'),300);}

// 廣東話讀題
function speakHK(t){if(!document.getElementById('voiceOn').checked)return;try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='zh-HK';u.rate=0.9;speechSynthesis.speak(u);}catch(e){}}

// 數據
const pets=[{img:"./dino1.png.jpg?v=3",name:"Lv.1 蛋 - 50內加法",ani:"ani-egg",total:50},{img:"./dino2.png.jpg?v=3",name:"Lv.2 奶樽BB - 50內減法",ani:"ani-bb",total:50},{img:"./dino3.png.WEBP?v=3",name:"Lv.3 橙色火焰龍 - 1-10乘法",ani:"ani-teen",total:100
