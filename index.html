<!DOCTYPE html><html lang="zh-HK"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>V181 乾淨地圖</title>
<style>
*{touch-action:none;user-select:none;box-sizing:border-box}
body{margin:0;background:#0a2a4a;display:flex;justify-content:center;font-family:-apple-system,sans-serif}
#game{width:100%;max-width:430px;height:100vh;height:100dvh;background:#0b3a5f;position:relative;overflow:hidden;display:flex;flex-direction:column;transition:max-width .25s}
#game.ipad{max-width:1024px}
#top{height:50px;background:linear-gradient(#1a2a4a,#0e0e1a);border-bottom:2px solid #ffb300;display:flex;justify-content:space-between;align-items:center;padding:0 8px;color:#ffd54f;font-weight:900;font-size:11px;z-index:10}
#mapWrap{flex:1;position:relative;overflow:hidden;background:#1a5a8a}
#world{position:absolute;left:0;top:0;width:3000px;height:2250px;background-image:url('./IMG_9783.gif');background-size:3000px 2250px}
#player{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px;background:#fff;border:3px solid #ffb300;border-radius:50%;z-index:20;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 0 12px gold}
#posBox{position:absolute;right:8px;top:8px;background:rgba(0,0,0,.65);color:#ffd54f;border:1px solid #ffb300;border-radius:8px;padding:4px 8px;font-size:10px;font-weight:900;z-index:15}
#msg{position:absolute;left:8px;right:8px;bottom:100px;background:rgba(0,0,0,.75);border-left:4px solid #ffb300;color:#fff;border-radius:8px;padding:6px 10px;font-size:11px;font-weight:700;z-index:15}
#controls{position:absolute;left:0;right:0;bottom:0;height:96px;background:linear-gradient(rgba(0,0,0,.9),#000);border-top:2px solid #ffb300;display:flex;justify-content:space-between;align-items:center;padding:0 10px 8px;z-index:20}
#joy{width:72px;height:72px;background:rgba(255,255,255,.22);border:3px solid #ffb300;border-radius:50%;position:relative}#knob{position:absolute;left:50%;top:50%;width:36px;height:36px;background:#fff;border-radius:50%;transform:translate(-50%,-50%);border:2px solid #000}
#game.ipad #joy{width:110px;height:110px}#game.ipad #knob{width:56px;height:56px}
#skills{display:flex;gap:6px}.sbtn{width:52px;height:52px;border-radius:12px;border:2px solid #ffb300;background:#222;color:#ffd54f;font-weight:900;font-size:8px}.sbtn.seal{background:#e91e63;color:#fff}
#game.ipad .sbtn{width:78px;height:78px;font-size:10px}
#battle{position:absolute;inset:0;background:radial-gradient(#1e3a5f,#0a0a14);z-index:30;display:none;flex-direction:column;color:#fff;overflow:hidden}
#pop{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:100;padding:12px}.box{background:linear-gradient(#fff8e0,#ffe0b2);border:3px solid #ffb300;border-radius:18px;padding:14px;width:100%;max-width:420px;color:#3e2723;text-align:center}
.sprite{width:150px;height:150px;background-size:1000% 500%;image-rendering:pixelated;background-repeat:no-repeat;background-color:#fff;border-radius:12px}
.spriteSmall{width:48px;height:48px;background-size:1000% 500%;image-rendering:pixelated;background-repeat:no-repeat;background-color:#fff;border-radius:6px;display:inline-block}
@keyframes dmgPop{0%{transform:translate(-50%,0) scale(.3);opacity:0}20%{transform:translate(-50%,-25px) scale(1.4);opacity:1}100%{transform:translate(-50%,-70px) scale(1);opacity:0}}
.dmg{position:absolute;left:50%;top:40%;font-weight:900;font-size:32px;color:#ff3d00;text-shadow:2px 2px 0 #fff;animation:dmgPop .9s forwards;z-index:60}
.miss{position:absolute;left:50%;top:40%;font-weight:900;font-size:20px;color:#ff5252;text-shadow:2px 2px 0 #fff;animation:dmgPop 1s forwards;z-index:70}
.vertical{font-family:monospace;font-weight:900;line-height:1.15;display:inline-block;text-align:right;background:#fff;border:3px solid #000;border-radius:14px;padding:10px 20px;min-width:120px}
.vertical .row{font-size:32px}.vertical .op{float:left}.vertical .line{border-top:3px solid #000;margin:6px 0}.vertical .ansBox{font-size:34px;min-height:38px;color:#e91e63;border:2px dashed #ffb300;border-radius:8px;padding:2px 8px}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.numpad button{height:52px;font-size:19px;font-weight:900;border-radius:12px;border:2px solid #000;background:#fff}#game.ipad .numpad button{height:62px}.numpad button.ok{background:#ffb300}
.sizeBtn{background:#222;border:1px solid #ffb300;color:#ffd54f;border-radius:8px;padding:4px 8px;font-weight:900;font-size:10px}
</style></head><body>
<div id="game"><div id="top"><span>📏 <button class="sizeBtn" onclick="toggleSize()" id="sizeBtn">📱手機</button> Lv<span id="lv">1</span> <span id="coordTop">451,163</span></span><span>💰<span id="gold">300</span> 🎀<span id="balls">30</span> 📖<span id="cnt">0/100</span></span></div>
<div id="mapWrap"><div id="world"></div>
<div id="player">🧑‍🌾</div>
<div id="posBox">📍 <span id="posXY">451,163</span></div>
<div id="msg">乾淨地圖模式，無字干擾</div>
<div id="controls"><div id="joy"><div id="knob"></div></div><div id="skills"><button class="sbtn" onclick="doAtk()">🏹攻擊</button><button class="sbtn" onclick="doAtk(true)">💥乾坤</button><button class="sbtn" onclick="openShop()">🏪商店</button><button class="sbtn" onclick="openDex()">📖圖鑑</button><button class="sbtn seal" onclick="trySeal()">🎀封印</button></div></div></div>
<div id="battle"><div style="height:48px;background:#111;border-bottom:2px solid #ffb300;display:flex;justify-content:space-between;align-items:center;padding:0 10px;color:#ffd54f;font-weight:900"><span>⚔️ <span id="ename">寵物</span> Lv<span id="elv">1</span> <span id="ehpT">100%</span></span><button onclick="closeB()" style="background:#222;color:#ffd54f;border:2px solid #ffb300;border-radius:8px;padding:5px 10px">逃</button></div>
<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative">
<div id="eBox" style="width:160px;height:160px;background:#fff;border:3px solid #ffb300;border-radius:20px;display:flex;align-items:center;justify-content:center;overflow:hidden"><div id="eSprite" class="sprite"></div></div>
<div id="bmsg" style="margin-top:10px;background:rgba(0,0,0,.7);padding:6px 12px;border-radius:8px;font-size:11px;text-align:center">No.001</div>
<div id="sealLayer" style="position:absolute;inset:0;pointer-events:none;display:none;z-index:40"></div>
<div id="battleFlash" style="position:absolute;inset:0;display:none;pointer-events:none;z-index:45"></div>
<div style="display:flex;gap:8px;width:92%;margin-top:10px"><button class="sbtn" style="flex:1;height:50px" onclick="doAtk()">攻擊</button><button class="sbtn seal" style="flex:1;height:50px" onclick="trySeal()">封印</button></div>
</div></div><div id="pop"><div class="box" id="popBox"></div></div></div>
<script>
const namesA=["虎紋貓","黑魔貓","妖狐","白兔","棕熊","飛龍","史萊姆","幽靈","蝙蝠","蜘蛛","螳螂","石怪","哥布林","黃蜂","水蜥","灰狼","熊貓","企鵝","倉鼠","貓頭鷹","浣熊","松鼠","烏龜","青蛙","紫蛇","刺蝟","小羊","小牛","小豬","小猴","大象","鱷魚","蠍子","蝸牛","蝴蝶","甲蟲","梅花鹿","山羊","烏鴉","鳳凰","小馬","雪怪","蘑菇","水晶","羅剎","木乃伊","南瓜","鯊魚","海豹","六角龍"];
const namesB=["九尾狐","白虎","黑貓魔","獅子王","熊貓魔","仙人掌","熔岩","水晶","雷龍","天使","紫惡魔","蘑菇人","樹精","沙魔","機械人","風妖","人魚","火鬼","毛熊","毒蛙","幽靈貓","骷髏","吸血蝠","狼人","牛頭","半人馬","獅鷲","獨角獸","天馬","雞蛇","青蛇","獅蛇","雙頭蛇","比蒙","海龍","章魚","雪怪王","骷髏王","喪屍","巫妖","女妖","魅魔","天使","墮天使","聖騎","邪眼","寶箱","骰子","卡牌"];
let pets=[];for(let i=0;i<100;i++)pets.push({id:i+1,name:[...namesA,...namesB][i]});
let px=1245,py=1070,gold=300,balls=30,dex=new Array(100).fill(false),emy=0,emyHp=100,battle=false,ans=0,input="",stepCount=0,lastBattle=-100,playerLv=1,mode=localStorage.getItem('cg_size')||'phone';
function applySize(){let g=document.getElementById('game'),btn=document.getElementById('sizeBtn');if(mode==='ipad'){g.classList.add('ipad');btn.innerText='📱 iPad';}else{g.classList.remove('ipad');btn.innerText='📱 手機';}setTimeout(updateCam,50);}
function toggleSize(){mode=mode==='phone'?'ipad':'phone';localStorage.setItem('cg_size',mode);applySize();}
function getPlayerLv(){return Math.min(20,Math.floor(dex.filter(x=>x).length/5)+1);}
function updateLvUI(){playerLv=getPlayerLv();document.getElementById('lv').innerText=playerLv;}
function genQuestion(){let a,b,op,tag;if(playerLv<=10){if(playerLv<=3){a=Math.floor(Math.random()*14)+1;b=Math.floor(Math.random()*14)+1;op='+';tag=`Lv${playerLv} 加數 30內`;}else if(playerLv<=6){if(Math.random()<0.5){a=Math.floor(Math.random()*15)+1;b=Math.floor(Math.random()*15)+1;op='+';}else{a=Math.floor(Math.random()*20)+10;b=Math.floor(Math.random()*a);op='-';}tag=`Lv${playerLv} 加減 30內`;}else{if(Math.random()<0.5){a=Math.floor(Math.random()*16)+5;b=Math.floor(Math.random()*16)+5;if(a+b>30){a=15;b=10;}op='+';}else{a=Math.floor(Math.random()*16)+15;b=Math.floor(Math.random()*14)+1;op='-';}tag=`Lv${playerLv} 加減 30內`;}}else{if(Math.random()<0.5){a=Math.floor(Math.random()*26)+10;b=Math.floor(Math.random()*21)+5;if(a+b>50){a=25;b=18;}op='+';}else{a=Math.floor(Math.random()*31)+20;b=Math.floor(Math.random()*20)+5;if(b>a)[a,b]=[b,a];op='-';}tag=`Lv${playerLv} 混合 50內`;}ans=(op==='+')?a+b:a-b;return {a,b,op,tag};}
const world=document.getElementById('world');
function updateCam(){let w=document.getElementById('mapWrap'),W=w.clientWidth,H=w.clientHeight;world.style.left=(W/2-px)+'px';world.style.top=(H/2-py)+'px';let gx=Math.floor(400 + (px-800)*0.12);let gy=Math.floor(80 + (py-200)*0.11);document.getElementById('posXY').innerText=gx+','+gy;document.getElementById('coordTop').innerText=gx+','+gy;window._gx=gx;window._gy=gy;}
function updateUI(){document.getElementById('gold').innerText=gold;document.getElementById('balls').innerText=balls;document.getElementById('cnt').innerText=dex.filter(x=>x).length+'/100';updateLvUI();}
function move(dx,dy){if(battle)return;let nx=px+dx*20,ny=py+dy*20;if(nx<0||nx>3000||ny<0||ny>2250)return;px=nx;py=ny;stepCount++;updateCam();let s=stepCount-lastBattle;if(s<7)return;if(py<380||px<180)return;if(stepCount%7===0 && Math.random()<0.12) startB();}
function getSpriteStyle(i){let f=i<50?'./6f624645-2a9f-f819-cf87-700a2f37e77b.jpeg':'./41309d37-8713-e0a3-4015-0e51f44b1f6d.jpeg';if(i>=50)i-=50;let c=i%10,r=Math.floor(i/10),x=c*100/9,y=r*100/4;return `background-image:url('${f}');background-position:${x}% ${y}%;`;}
function startB(){emy=Math.floor(Math.random()*100);emyHp=100;battle=true;lastBattle=stepCount;updateLvUI();document.getElementById('battle').style.display='flex';document.getElementById('ename').innerText=pets[emy].name;document.getElementById('elv').innerText=playerLv;document.getElementById('ehpT').innerText='100%';let q=genQuestion();window._curQ=q;document.getElementById('bmsg').innerHTML=`No.${String(pets[emy].id).padStart(3,'0')} ${pets[emy].name}<br>${q.tag}`;document.getElementById('eSprite').setAttribute('style',getSpriteStyle(emy)+'width:150px;height:150px;background-size:1000% 500%;image-rendering:pixelated;background-repeat:no-repeat;background-color:#fff;border-radius:12px;');}
function closeB(){document.getElementById('battle').style.display='none';battle=false;lastBattle=stepCount;}
let curQ=null;
function makeVerticalHTML(q,inputStr){return `<div class="vertical"><div class="row">&nbsp;${q.a}</div><div class="row"><span class="op">${q.op}</span>${q.b}</div><div class="line"></div><div class="ansBox">${inputStr||'?'}</div></div>`;}
function doAtk(isBig=false){curQ=genQuestion();pop(`<h3>⚔️ Lv${playerLv} ${curQ.tag}</h3>${makeVerticalHTML(curQ,'')}<div class="numpad"><button onclick="addN('1')">1</button><button onclick="addN('2')">2</button><button onclick="addN('3')">3</button><button onclick="addN('4')">4</button><button onclick="addN('5')">5</button><button onclick="addN('6')">6</button><button onclick="addN('7')">7</button><button onclick="addN('8')">8</button><button onclick="addN('9')">9</button><button onclick="clrN()">⌫</button><button onclick="addN('0')">0</button><button class="ok" onclick="chk(false,${isBig})">OK</button></div>`);input="";}
function trySeal(){if(balls<=0){pop('<h3>無卡</h3>');return;}if(emyHp>60){document.getElementById('bmsg').innerText='仲有'+emyHp+'%血！';return;}curQ=genQuestion();pop(`<h3>🎀 Lv${playerLv} ${curQ.tag} 直式封印</h3>${makeVerticalHTML(curQ,'')}<div class="numpad"><button onclick="addN('1')">1</button><button onclick="addN('2')">2</button><button onclick="addN('3')">3</button><button onclick="addN('4')">4</button><button onclick="addN('5')">5</button><button onclick="addN('6')">6</button><button onclick="addN('7')">7</button><button onclick="addN('8')">8</button><button onclick="addN('9')">9</button><button onclick="clrN()">⌫</button><button onclick="addN('0')">0</button><button class="ok" style="background:#e91e63;color:white" onclick="chk(true)">封印</button></div>`);input="";}
function addN(n){input+=n;document.querySelectorAll('.ansBox').forEach(el=>el.innerText=input);}
function clrN(){input=input.slice(0,-1);document.querySelectorAll('.ansBox').forEach(el=>el.innerText=input||'?');}
function chk(isSeal,isBig){let v=parseInt(input);if(isNaN(v))return;closePop();let layer=document.getElementById('sealLayer'),flash=document.getElementById('battleFlash');if(v===ans){if(isSeal){balls--;let ok=Math.random()<0.85;layer.style.display='block';layer.innerHTML='<div style="position:absolute;left:50%;top:50%;width:100px;height:100px;margin:-50px;background:radial-gradient(#ff80ab,#e91e63);border:3px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:44px">🎀</div>';setTimeout(()=>{layer.innerHTML=ok?`<div style="position:absolute;left:50%;top:25%;transform:translateX(-50%);font-size:26px;color:gold;font-weight:900;animation:dmgPop 1s forwards">✨成功！</div>`:`<div style="position:absolute;left:50%;top:25%;transform:translateX(-50%);font-size:22px;color:#f55;font-weight:900;animation:dmgPop 1s forwards">💨失敗！</div>`;if(ok){dex[emy]=true;gold+=35;closeB();}updateUI();setTimeout(()=>layer.style.display='none',900);},600);}else{emyHp=Math.max(0,emyHp-(isBig?50:35));document.getElementById('ehpT').innerText=emyHp+'%';let d=document.createElement('div');d.className='dmg';d.innerText='-'+(isBig?50:35)+' ✅';document.getElementById('eBox').parentElement.appendChild(d);setTimeout(()=>d.remove(),900);}}else{flash.style.display='block';flash.innerHTML='<div style="position:absolute;inset:0;background:rgba(255,0,0,.55)"></div>';setTimeout(()=>flash.style.display='none',500);let m=document.createElement('div');m.className='miss';m.innerText=`❌ MISS! ${curQ.a}${curQ.op}${curQ.b}=${ans}`;document.getElementById('eBox').parentElement.appendChild(m);setTimeout(()=>m.remove(),1300);if(isSeal){balls--;updateUI();}}}
function pop(h){document.getElementById('popBox').innerHTML=h;document.getElementById('pop').style.display='flex';}function closePop(){document.getElementById('pop').style.display='none';}
function openShop(){pop(`<h3>🏪商店 Lv${playerLv}<br>📍${window._gx},${window._gy}</h3><button onclick="toggleSize();closePop();openShop();" style="width:100%;padding:10px;background:#222;color:#ffd54f;border:2px solid #ffb300;border-radius:10px;margin-bottom:8px">🔄 切換 📱手機 / 📱iPad</button><button onclick="if(gold>=20){gold-=20;balls++;updateUI();closePop();}" style="width:100%;padding:12px;background:#ffb300;border-radius:10px">買封印卡 20金 🎀</button><button onclick="closePop()" style="width:100%;margin-top:8px;height:44px">關</button>`);}
function openDex(){let h=`<h3>📖100寵圖鑑 ${dex.filter(x=>x).length}/100 Lv${playerLv}</h3><div style="max-height:400px;overflow:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:6px">`;pets.forEach((p,i)=>{h+=`<div style="border:2px solid ${dex[i]?'#ffb300':'#aaa'};border-radius:8px;padding:3px;background:${dex[i]?'#fff8e0':'#eee'};text-align:center"><div class="spriteSmall" style="${getSpriteStyle(i)}"></div><div style="font-size:8px;font-weight:900">${String(p.id).padStart(3,'0')} ${p.name}</div></div>`});h+='</div><button onclick="closePop()" style="margin-top:10px;height:44px;width:100%">關</button>';pop(h);}
let joy=document.getElementById('joy'),knob=document.getElementById('knob'),drag=false,last=0;
joy.addEventListener('touchstart',e=>{drag=true;e.preventDefault();},{passive:false});
window.addEventListener('touchend',()=>{drag=false;knob.style.transform='translate(-50%,-50%)';});
window.addEventListener('touchmove',e=>{if(!drag||battle)return;let r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,x=e.touches[0].clientX-cx,y=e.touches[0].clientY-cy,limit=mode==='ipad'?52:36,d=Math.min(Math.sqrt(x*x+y*y),limit),a=Math.atan2(y,x),nx=Math.cos(a)*d,ny=Math.sin(a)*d;knob.style.transform=`translate(calc(-50% + ${nx}px), calc(-50% + ${ny}px))`;let now=Date.now();if(now-last<90)return;last=now;let dx=Math.abs(nx)>14?(nx>0?1:-1):0,dy=Math.abs(ny)>14?(ny>0?1:-1):0;if(dx||dy)move(dx,dy);},{passive:false});
window.addEventListener('resize',updateCam);applySize();updateCam();updateUI();
</script></body></html>
