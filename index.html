<!DOCTYPE html><html lang="zh-HK"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>V121 有停頓</title>
<style>body{margin:0;background:#0f0f23;display:flex;justify-content:center;font-family:-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}#game{width:100%;max-width:440px;background:linear-gradient(#eef2ff,#f0fdfa);min-height:100vh;padding:14px;box-sizing:border-box;text-align:center;position:relative}.card{background:white;border-radius:22px;padding:14px;margin:10px 0;box-shadow:0 8px 24px rgba(0,0,0,.06)}.pet-wrap{height:280px;display:flex;align-items:flex-end;justify-content:center}.pet-img{object-fit:contain;display:block;transition:width 0.6s,height 0.6s}.stage-badge{display:inline-block;background:#e0e7ff;color:#3730a3;border:2px solid #a5b4fc;padding:6px 16px;border-radius:20px;font-size:13px;font-weight:bold;margin:8px 0}.btn{width:100%;padding:16px;border:none;border-radius:14px;font-size:18px;font-weight:bold;margin:6px 0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}.btn-go{background:#6366f1;color:white}.btn-leader{background:linear-gradient(135deg,#a5b4fc,#4f46e5);color:white}.btn-evo{background:gold;display:none}.timer{font-size:20px;font-weight:bold;color:#4338ca;background:#e0e7ff;padding:6px 14px;border-radius:20px;display:inline-block;margin-top:6px}.prog-bg{background:#e0e7ff;border-radius:12px;height:22px;overflow:hidden;margin:10px 0;position:relative}.prog-fill{height:100%;background:linear-gradient(90deg,#818cf8,#4f46e5);transition:width 0.5s}.prog-text{position:absolute;width:100%;top:3px;font-weight:bold;font-size:12px;text-align:center}#mathBox,#leadBox,#musicBox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:99999;padding:14px}.box{background:white;width:100%;max-width:380px;border-radius:24px;padding:20px;text-align:center;border:4px solid #818cf8;pointer-events:auto;z-index:100000;position:relative}.ans-display{font-size:88px;font-weight:900;color:#4338ca;min-height:100px;line-height:100px;background:#eef2ff;border:4px solid #6366f1;border-radius:20px;margin:10px 0;letter-spacing:6px}.num-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:16px 0}.num-key{padding:22px 0;font-size:28px;font-weight:900;background:white;border:3px solid #a5b4fc;border-radius:18px;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;box-shadow:0 3px 0 #a5b4fc}.num-key:active{background:#6366f1;color:white;transform:translateY(3px);box-shadow:none}#toast{position:fixed;top:38%;left:50%;transform:translate(-50%,-50%);padding:16px 24px;border-radius:20px;font-size:20px;font-weight:bold;z-index:100001;display:none;color:white;pointer-events:none}.lead-row{display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #eef2ff;font-size:13px}.music-btn{position:absolute;top:10px;right:10px;background:white;border-radius:50%;width:44px;height:44px;border:none;font-size:22px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2);z-index:10}.music-opt{padding:12px;margin:8px 0;border:2px solid #eef2ff;border-radius:12px;cursor:pointer;text-align:left;font-weight:bold}.music-opt.active{border-color:#6366f1;background:#e0e7ff}@keyframes pop{0%{transform:scale(1)}30%{transform:scale(1.35)}100%{transform:scale(1)}}@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}.beat{display:inline-block;width:12px;height:12px;border-radius:50%;margin:3px;background:#ddd;transition:all .1s}.beat.on{background:#6366f1;transform:scale(1.5)}.beat.rest{background:#f0f0f0;transform:scale(0.6)}</style></head><body>
<div id="game"><button class="music-btn" onclick="openMusic()">🎵</button><h2>🦖 V121 有停頓</h2><div class="card"><div class="pet-wrap"><img id="petImg" class="pet-img" src="./dino1.png.jpg" style="animation:bounce 0.8s infinite"></div><h3 id="petName"></h3><div class="stage-badge" id="stageBadge"></div><br><div class="timer">⏱️ <span id="timer">00:00</span></div><div id="beatRow" style="margin:8px 0"><span class="beat"></span><span class="beat"></span><span class="beat"></span><span class="beat"></span><span class="beat"></span><span class="beat"></span><span class="beat"></span><span class="beat"></span></div><div class="prog-bg"><div id="progBar" class="prog-fill"></div><div id="progText" class="prog-text"></div></div><p style="font-size:13px"><b id="solved">0</b>題 | <b id="score">0</b>分</p></div><button class="btn btn-go" onclick="startQ()">▶️ 出發 V121 有停</button><button class="btn btn-evo" id="evoBtn" onclick="doEvo()">⚡️ 進化</button><button class="btn btn-leader" onclick="openLeader()">👑 霸主榜</button></div>
<div id="mathBox"><div class="box"><h1 id="mQ" style="font-size:48px;margin:6px 0;font-weight:900"></h1><div id="ansDisplay" class="ans-display">?</div><div class="num-pad"><button class="num-key" ontouchend="addNum('1');event.preventDefault()" onclick="addNum('1')">1</button><button class="num-key" ontouchend="addNum('2');event.preventDefault()" onclick="addNum('2')">2</button><button class="num-key" ontouchend="addNum('3');event.preventDefault()" onclick="addNum('3')">3</button><button class="num-key" ontouchend="addNum('4');event.preventDefault()" onclick="addNum('4')">4</button><button class="num-key" ontouchend="addNum('5');event.preventDefault()" onclick="addNum('5')">5</button><button class="num-key" ontouchend="addNum('6');event.preventDefault()" onclick="addNum('6')">6</button><button class="num-key" ontouchend="addNum('7');event.preventDefault()" onclick="addNum('7')">7</button><button class="num-key" ontouchend="addNum('8');event.preventDefault()" onclick="addNum('8')">8</button><button class="num-key" ontouchend="addNum('9');event.preventDefault()" onclick="addNum('9')">9</button><button class="num-key" ontouchend="clearNum();event.preventDefault()" onclick="clearNum()">⌫</button><button class="num-key" ontouchend="addNum('0');event.preventDefault()" onclick="addNum('0')">0</button><button class="num-key" style="background:#6366f1;color:white;border-color:#4f46e5" ontouchend="checkAns();event.preventDefault()" onclick="checkAns()">OK</button></div><button class="btn" style="background:#6366f1;color:white;font-size:22px" onclick="checkAns()">確定</button><button class="btn" style="background:#eee" onclick="hideMath()">取消</button></div></div>
<div id="leadBox"><div class="box"><h2>👑 霸主榜</h2><div id="leadList"></div><div style="margin-top:10px;border-top:3px dashed #a5b4fc;padding-top:10px"><input id="playerName" placeholder="霸主名號" style="font-size:18px;padding:10px;width:80%;margin:4px"><input id="playerPwd" type="password" placeholder="4位密碼" style="font-size:18px;padding:10px;width:80%;margin:4px"><button class="btn" style="background:#6366f1;color:white" onclick="uploadScore()">🔒 登榜</button><button class="btn" style="background:#eee" onclick="closeLeader()">關閉</button></div></div></div>
<div id="musicBox"><div class="box"><h2>🎵 有停頓</h2><div class="music-opt active" onclick="setMusic('rest',this)">🎶 現代有停 咚次啪-空 現代感</div><div class="music-opt" onclick="setMusic('mute',this)">🔇 靜音</div><p style="font-size:11px;color:#666">每4拍停1拍，有呼吸，唔連續，似YOASOBI切分</p><button class="btn" style="background:#eee;margin-top:10px" onclick="closeMusic()">完成</button></div></div><div id="toast"></div>
<script>
const BUCKET_ID="9xrLimS38pHRafoTWwqfSP",KEY="yuki_leaderboard";
const pets=[{img:"./dino1.png.jpg",name:"Lv.1 蛋蛋龍",total:20},{img:"./dino2.png.jpg",name:"Lv.2 BB龍",total:20},{img:"./dino3.png.WEBP",name:"Lv.3 火焰龍",total:20},{img:"./dino4.png.jpg",name:"Lv.4 霸王龍",total:20}];
let petIdx=0,solvedLv=0,total=0,score=0,ans=0,ac,startTime=0,timerInterval=null,bgmTimer=null;let currentMusic='rest',masterVol=0.028;let curInput="";let step=0;
let saved=JSON.parse(localStorage.getItem('yuki_v121')||'{}');if(saved.petIdx!=null){petIdx=saved.petIdx;solvedLv=saved.solvedLv;total=saved.total;score=saved.score;}
function save(){localStorage.setItem('yuki_v121',JSON.stringify({petIdx,solvedLv,total,score,startTime,currentMusic}));}
function showToast(t,c){let e=document.getElementById('toast');e.innerText=t;e.style.background=c;e.style.display='block';setTimeout(()=>e.style.display='none',1800);}
function formatTime(ms){let s=Math.floor(ms/1000),m=Math.floor(s/60);s%=60;return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;}
function getElapsed(){return startTime==0?0:Date.now()-startTime;}
function update(){let p=pets[petIdx];document.getElementById('petImg').src=p.img;document.getElementById('petName').innerText=p.name;let base=40,max=260;let size=base+(solvedLv/p.total)*(max-base);let img=document.getElementById('petImg');img.style.width=size+'px';img.style.height=size+'px';document.getElementById('stageBadge').innerText='✨ 長大 '+(solvedLv+1<=p.total?solvedLv+1:p.total)+'/20 段';if(solvedLv>=p.total)document.getElementById('stageBadge').innerText='🎉 20/20 滿級！可進化';let pct=Math.round(solvedLv/p.total*100);document.getElementById('progBar').style.width=pct+'%';document.getElementById('progText').innerText=solvedLv+'/20 段';document.getElementById('solved').innerText=total;document.getElementById('score').innerText=score;document.getElementById('evoBtn').style.display=solvedLv>=p.total?'block':'none';document.getElementById('timer').innerText=formatTime(getElapsed());save();}
function ensureAudio(){try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return true;}catch(e){return false;}}
function drum(t0,type,vel){
 try{
  if(type==='kick'){let o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(130,t0);o.frequency.exponentialRampToValueAtTime(48,t0+0.11);g.gain.setValueAtTime(0.0001,t0);g.gain.linearRampToValueAtTime(masterVol*0.90*vel,t0+0.004);g.gain.exponentialRampToValueAtTime(0.0001,t0+0.20);o.connect(g);g.connect(ac.destination);o.start(t0);o.stop(t0+0.21);}
  else if(type==='snare'){let buf=ac.createBuffer(1, ac.sampleRate*0.13, ac.sampleRate);let ch=buf.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=(Math.random()*2-1)*Math.pow(1-i/ch.length,2);let src=ac.createBufferSource();src.buffer=buf;let fl=ac.createBiquadFilter();fl.type='highpass';fl.frequency.value=200;let g=ac.createGain();g.gain.setValueAtTime(0.0001,t0);g.gain.linearRampToValueAtTime(masterVol*0.38*vel,t0+0.004);g.gain.exponentialRampToValueAtTime(0.0001,t0+0.16);src.connect(fl);fl.connect(g);g.connect(ac.destination);src.start(t0);src.stop(t0+0.17);}
  else{let o=ac.createOscillator(),g=ac.createGain(),fl=ac.createBiquadFilter();o.type='square';o.frequency.value=7500;fl.type='highpass';fl.frequency.value=6200;g.gain.setValueAtTime(0.0001,t0);g.gain.linearRampToValueAtTime(masterVol*0.13*vel,t0+0.002);g.gain.exponentialRampToValueAtTime(0.0001,t0+0.07);o.connect(fl);fl.connect(g);g.connect(ac.destination);o.start(t0);o.stop(t0+0.08);}
 }catch(e){}
}
function note(t0,f,vel){
 try{let dur=0.38;let o=ac.createOscillator(),g=ac.createGain(),fl=ac.createBiquadFilter();o.type='triangle';fl.type='lowpass';fl.frequency.value=1050;let vol=masterVol*0.56*vel;g.gain.setValueAtTime(0.0001,t0);g.gain.linearRampToValueAtTime(vol,t0+0.04);g.gain.linearRampToValueAtTime(vol*0.5,t0+dur*0.5);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);o.frequency.value=f;o.connect(fl);fl.connect(g);g.connect(ac.destination);o.start(t0);o.stop(t0+dur);}catch(e){}
}
function playRestBeat(){
 if(bgmTimer)clearInterval(bgmTimer);
 let mel=[392,440,523,0, 493,440,392,0, 329,392,440,392, 329,0,392,0, 392,440,523,587, 659,587,523,0, 440,493,523,0, 392,0,523,0];
 // 0 = 休止
 let pattern=[
  ['kick','hat',null,'hat'], // 咚次空次
  ['hat','hat','snare','rest'], // 次次啪空
  ['kick','hat','hat','hat'], // 咚次次次
  ['hat','rest','snare','hat'], // 次空啪次
  ['kick','hat','snare','rest'], // 咚次啪空 - 切分
  ['hat','hat','kick','hat'], // 次次咚次
  ['snare','rest','hat','hat'], // 啪空次次
  ['kick','rest','rest','rest'] // 咚空空空 - 大休止
 ];
 let i=0; let beats=document.querySelectorAll('.beat');
 function tick(){
  if(currentMusic==='mute')return; if(!ensureAudio())return;
  let t0=ac.currentTime+0.03;
  let bar=Math.floor(i/4)%8; let pos=i%4;
  let drumType=pattern[bar][pos];
  let isRestNote = mel[i%32]===0 || drumType==='rest' || drumType===null;
  if(drumType && drumType!=='rest') drum(t0,drumType, pos===0?1.15:0.75);
  if(!isRestNote && mel[i%32]!==0){ let vel=0.92+Math.random()*0.14; note(t0,mel[i%32],vel); }
  // 視覺
  beats.forEach((b,idx)=>{ b.className='beat'; if(idx===i%8){ if(isRestNote) b.classList.add('rest'); else b.classList.add('on'); } });
  i++;
 }
 tick(); bgmTimer=setInterval(tick, 300); // 100BPM，每拍有停，唔連續
}
function sfxCorrect(){try{if(!ensureAudio())return;let t0=ac.currentTime;if(bgmTimer){clearInterval(bgmTimer);bgmTimer=null;setTimeout(()=>{if(currentMusic!=='mute'&&startTime!=0) playRestBeat();},600);} [523.25,659.25,783.99].forEach((f,idx)=>{let o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t0+idx*0.08);g.gain.linearRampToValueAtTime(0.08,t0+idx*0.08+0.03);g.gain.exponentialRampToValueAtTime(0.001,t0+idx*0.08+0.30);o.connect(g);g.connect(ac.destination);o.start(t0+idx*0.08);o.stop(t0+idx*0.08+0.30);});}catch(e){}}
function sfxWrong(){try{if(!ensureAudio())return;let t0=ac.currentTime;let o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.setValueAtTime(110,t0);o.frequency.linearRampToValueAtTime(65,t0+0.25);g.gain.setValueAtTime(0.04,t0);g.gain.exponentialRampToValueAtTime(0.001,t0+0.28);o.connect(g);g.connect(ac.destination);o.start(t0);o.stop(t0+0.28);}catch(e){}}
function playCurrent(){if(currentMusic==='rest'){ensureAudio(); playRestBeat();} else { if(bgmTimer){clearInterval(bgmTimer);clearTimeout(bgmTimer);bgmTimer=null;} }}
function resumeAudio(){ if(startTime==0||currentMusic==='mute') return; if(!ensureAudio()) return; if(bgmTimer){clearInterval(bgmTimer);clearTimeout(bgmTimer);} setTimeout(()=>{ ensureAudio(); playCurrent(); },150); }
function setMusic(url,el){currentMusic=url;document.querySelectorAll('.music-opt').forEach(o=>o.classList.remove('active'));if(el)el.classList.add('active');save();if(bgmTimer){clearInterval(bgmTimer);clearTimeout(bgmTimer);bgmTimer=null;}if(startTime!=0)playCurrent();closeMusic();}
function addNum(n){curInput=(curInput||"")+n; if(curInput.length>4) curInput=curInput.slice(0,4); document.getElementById('ansDisplay').innerText=curInput; document.getElementById('ansDisplay').style.transform='scale(1.12)'; setTimeout(()=>document.getElementById('ansDisplay').style.transform='scale(1)',90);}
function clearNum(){curInput=curInput.slice(0,-1); document.getElementById('ansDisplay').innerText=curInput||"?";}
function startQ(){ ensureAudio();if(startTime==0){startTime=Date.now();timerInterval=setInterval(()=>document.getElementById('timer').innerText=formatTime(getElapsed()),1000);}playCurrent();let a,b,q;if(petIdx==0){a=Math.floor(Math.random()*26);b=Math.floor(Math.random()*(51-a));ans=a+b;q=a+' + '+b+' = ?';}else if(petIdx==1){a=Math.floor(Math.random()*50)+1;b=Math.floor(Math.random()*(a+1));ans=a-b;q=a+' - '+b+' = ?';}else if(petIdx==2){a=Math.floor(Math.random()*9)+1;b=Math.floor(Math.random()*9)+1;ans=a*b;q=a+' × '+b+' = ?';}else{b=Math.floor(Math.random()*9)+2;ans=Math.floor(Math.random()*9)+1;a=b*ans;q=a+' ÷ '+b+' = ?';}document.getElementById('mQ').innerText=q;curInput="";document.getElementById('ansDisplay').innerText="?";document.getElementById('mathBox').style.display='flex';}
function hideMath(){document.getElementById('mathBox').style.display='none';}
function checkAns(){let v=parseInt(curInput); if(isNaN(v)){ showToast('👆 撳數字','​#ff9800'); return; } if(v===ans){solvedLv++;total++;score+=10;sfxCorrect();let img=document.getElementById('petImg');img.style.animation='pop 0.35s';setTimeout(()=>img.style.animation='',350);hideMath();update();showToast('✅ +10','#66bb6a');}else{sfxWrong();showToast('❌ 再諗下','#ff5252');curInput="";document.getElementById('ansDisplay').innerText="?";}}
function doEvo(){if(solvedLv>=pets[petIdx].total&&petIdx<3){petIdx++;solvedLv=0;update();showToast('⚡️ 進化！','#ff9800');}else openLeader();}
async function loadLeaderboard(){let el=document.getElementById('leadList');el.innerHTML='⏳...';let c=[];try{let r=await fetch(`https://kvdb.io/${BUCKET_ID}/${KEY}?t=${Date.now()}`,{cache:'no-store'});if(r.ok){let t=await r.text();if(t)c=c.concat(JSON.parse(t));}}catch(e){}if(!c.length){el.innerHTML='未有霸主';return;}let m={};c.forEach(x=>{let k=x.name.toLowerCase();if(!m[k]||x.score>m[k].score)m[k]=x;});let u=Object.values(m).sort((a,b)=>b.score-a.score).slice(0,20);el.innerHTML=u.map((r,i)=>`<div class="lead-row"><span>${i+1}. ${r.name}</span><span>${r.score}分 | ⏱️${r.timeStr}</span></div>`).join('');}
async function uploadScore(){let n=document.getElementById('playerName').value.trim(),p=document.getElementById('playerPwd').value.trim();if(!n||!p){showToast('名+密碼必填','#ff9800');return;}let e={name:n,score,timeMs:getElapsed(),timeStr:formatTime(getElapsed()),pwd:p};try{let r=await fetch(`https://kvdb.io/${BUCKET_ID}/${KEY}?t=${Date.now()}`);let d=[];if(r.ok){let t=await r.text();if(t)d=JSON.parse(t);}d=d.filter(x=>x.name.toLowerCase()!=n.toLowerCase());d.push(e);d.sort((a,b)=>b.score-a.score);await fetch(`https://kvdb.io/${BUCKET_ID}/${KEY}`,{method:'POST',body:JSON.stringify(d)});showToast('👑 上榜','#66bb6a');}catch(e){}loadLeaderboard();}
function openLeader(){document.getElementById('leadBox').style.display='flex';loadLeaderboard();}
function closeLeader(){document.getElementById('leadBox').style.display='none';}
function openMusic(){document.getElementById('musicBox').style.display='flex';}
function closeMusic(){document.getElementById('musicBox').style.display='none';}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) resumeAudio(); });
window.addEventListener('focus', resumeAudio);
window.addEventListener('pageshow', resumeAudio);
document.body.addEventListener('touchstart', function once(){ ensureAudio(); document.body.removeEventListener('touchstart', once); }, {passive:true});
update();
</script></body></html>
