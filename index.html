<!DOCTYPE html><html lang="zh-HK"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>魔力寶貝 手遊最終版</title>
<style>
*{touch-action:none;-webkit-tap-highlight-color:transparent;user-select:none;box-sizing:border-box}
body{margin:0;background:#000;display:flex;justify-content:center;font-family:-apple-system,system-ui,sans-serif;overflow:hidden}
#game{width:100%;max-width:430px;height:100vh;height:100dvh;background:#fff6e0;position:relative;overflow:hidden;display:flex;flex-direction:column}
#top{height:50px;background:linear-gradient(#2d1b0e,#5a3a22);color:#ffd27d;display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-weight:900;font-size:11px;z-index:30}
.exp-bar{height:6px;background:#222;border-radius:3px;width:90px;overflow:hidden;margin-top:2px}.exp-fill{height:100%;background:linear-gradient(#ffd54f,#ff9800);transition:width .4s}
#mapWrap{flex:1;position:relative;overflow:hidden;background:#c8e8a0}
#map{position:absolute;width:1000px;height:1000px}
.tile{position:absolute;width:40px;height:40px}.path{background:#f5e6c0}.grass{background:#8bc34a;border:1px solid #7cb342}.bush{background:#5a9a2a;border:2px dashed #3d7a1a}.water{background:#6ec6ff}.town{background:#ffd54f;border:2px solid #ff9800}.shop{background:#ff8a65;border:2px solid #d84315}
#player{position:absolute;width:36px;height:36px;background:white;border-radius:50%;border:3px solid #333;z-index:10;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 4px 10px rgba(0,0,0,.3);transition:.08s}
#msg{position:absolute;bottom:150px;left:10px;right:10px;background:rgba(0,0,0,.78);color:white;border-radius:12px;padding:10px;font-size:12px;font-weight:700;z-index:20;line-height:1.3}
.joy{position:absolute;left:16px;bottom:16px;width:118px;height:118px;background:rgba(255,255,255,.22);border:3px solid rgba(255,255,255,.6);border-radius:50%;z-index:30;pointer-events:auto}
.joy-knob{position:absolute;left:50%;top:50%;width:54px;height:54px;background:rgba(255,255,255,.92);border:3px solid #5a3a22;border-radius:50%;transform:translate(-50%,-50%)}
.skill{position:absolute;right:12px;bottom:14px;display:grid;grid-template-columns:repeat(2,62px);gap:8px;z-index:30;pointer-events:auto}
.sbtn{width:62px;height:62px;border-radius:50%;border:3px solid #5a3a22;box-shadow:0 4px 0 #5a3a22;font-weight:900;font-size:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:white;cursor:pointer}
.sbtn:active{transform:translateY(4px);box-shadow:none}
.sbtn.atk{background:#ffcc80}.sbtn.heal{background:#a5d6a7}.sbtn.ball{background:#f48fb1}.sbtn.run{background:#e0e0e0}
#battle{position:absolute;inset:0;background:linear-gradient(#a8e0ff,#fff6e0);z-index:40;display:none;flex-direction:column;padding:8px}
.pet{width:74px;height:74px;object-fit:contain;background:white;border:3px solid #5a3a22;border-radius:14px}
.hp{height:12px;background:#222;border-radius:6px;margin-top:4px;width:74px;overflow:hidden}.hp-fill{height:100%;background:linear-gradient(#66bb6a,#2e7d32);transition:width .3s}
#mathBox,#shopBox,#questBox{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;z-index:100;padding:12px}
.box{background:white;border-radius:20px;padding:16px;width:100%;max-width:350px;text-align:center;max-height:90vh;overflow:auto}
.num-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.num-key{padding:16px;background:white;border:3px solid #5a3a22;border-radius:14px;font-size:20px;font-weight:900;box-shadow:0 3px 0 #5a3a22}
.num-key:active{transform:translateY(3px);box-shadow:none;background:#ff9800;color:white}
.q-card{background:#fff8e0;border:2px solid #8d6e4a;border-radius:12px;padding:10px;margin:6px 0;text-align:left;font-size:12px;font-weight:700}
</style></head><body>
<div id="game">
<div id="top"><div><div>🧑‍🌾 Lv<span id="lv">1</span> <span id="pName">蛋蛋龍</span> 💰<span id="gold">50</span> 🎀<span id="balls">3</span></div><div class="exp-bar"><div id="expFill" class="exp-fill" style="width:10%"></div></div></div><div style="text-align:right"><div>圖鑑 <span id="dexCount">1/4</span></div><div>步數 <span id="steps">0</span></div></div></div>
<div id="mapWrap"><div id="map"></div><div id="player">🧑‍🌾</div></div>
<div id="msg">最終版V1：黃格=城鎮補血，橙格=商店，深綠草叢遇怪！左搖桿行路，右技能攻擊，Lv5進化！</div>
<div class="joy" id="joy"><div class="joy-knob" id="knob"></div></div>
<div class="skill"><button class="sbtn atk" onclick="if(battleOn)openM('火花 加法','atk',1)">🔥 火花</button><button class="sbtn atk" onclick="if(battleOn)openM('撞擊 減法','atk',2)">💥 撞擊</button><button class="sbtn heal" onclick="if(battleOn)openM('治療 乘法','heal',3)">💚 治療</button><button class="sbtn ball" onclick="if(battleOn)actBall()">🎀 捕捉</button></div>
<div id="battle"><div style="display:flex;justify-content:space-between;font-weight:900"><span>⚔️ 野生 <span id="ename">BB龍</span> Lv<span id="elV">1</span></span><span id="ehpText"></span><button onclick="closeBattle()" style="border:none;background:#eee;border-radius:8px;padding:4px 8px;font-weight:900">✕逃走</button></div><div style="display:flex;justify-content:space-around;margin-top:10px"><div style="text-align:center"><img id="eImg" class="pet"><div class="hp"><div id="eHp" class="hp-fill"></div></div></div><div style="text-align:center"><img id="mImg" class="pet"><div class="hp"><div id="mHp" class="hp-fill"></div></div><div id="mHpText" style="font-weight:900;font-size:11px"></div></div></div><div id="bmsg" style="margin-top:10px;background:rgba(0,0,0,.75);color:white;border-radius:10px;padding:8px;font-weight:700;font-size:12px">打到60%以下可捉！</div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px"><button class="sbtn atk" style="width:100%;border-radius:12px;height:48px" onclick="openM('火花 加法','atk',1)">🔥火花</button><button class="sbtn atk" style="width:100%;border-radius:12px;height:48px" onclick="openM('撞擊 減法','atk',2)">💥撞擊</button><button class="sbtn heal" style="width:100%;border-radius:12px;height:48px" onclick="openM('治療 乘法','heal',3)">💚治療</button><button class="sbtn ball" style="width:100%;border-radius:12px;height:48px" onclick="actBall()">🎀捕捉</button></div></div>
<div id="mathBox"><div class="box"><h3 id="mTitle">攻擊！</h3><h1 id="mQ" style="font-size:34px">5+3=?</h1><div id="ans" style="font-size:42px;font-weight:900;border:3px solid #5a3a22;border-radius:14px;padding:8px;background:#fffbe6;min-height:52px">?</div><div class="num-grid"><button class="num-key" onclick="add('1')">1</button><button class="num-key" onclick="add('2')">2</button><button class="num-key" onclick="add('3')">3</button><button class="num-key" onclick="add('4')">4</button><button class="num-key" onclick="add('5')">5</button><button class="num-key" onclick="add('6')">6</button><button class="num-key" onclick="add('7')">7</button><button class="num-key" onclick="add('8')">8</button><button class="num-key" onclick="add('9')">9</button><button class="num-key" onclick="clr()">⌫</button><button class="num-key" onclick="add('0')">0</button><button class="num-key" style="background:#ff9800;color:white" onclick="ok()">OK</button></div><button onclick="hideM()" style="margin-top:8px;width:100%;padding:10px;border:3px solid #5a3a22;border-radius:12px;font-weight:900;background:#eee">返回</button></div></div>
<div id="shopBox"><div class="box"><h3>🏪 道具屋</h3><div class="q-card">🎀 精靈球 x1 - 20金幣<br>捉寵必備！</div><button onclick="buyBall()" style="width:100%;padding:12px;background:#ff9800;border:3px solid #5a3a22;border-radius:12px;font-weight:900">買1個 (20金幣)</button><div style="margin-top:8px;font-size:12px;font-weight:700">💰金幣: <span id="gold2">50</span> 🎀球: <span id="balls2">3</span></div><button onclick="closeShop()" style="margin-top:10px;width:100%;padding:10px;background:#eee;border:3px solid #5a3a22;border-radius:12px;font-weight:900">離開</button></div></div>
<div id="questBox"><div class="box"><h3>📜 任務板</h3><div id="questList"></div><button onclick="closeQuest()" style="margin-top:10px;width:100%;padding:10px;background:#eee;border:3px solid #5a3a22;border-radius:12px;font-weight:900">關閉</button></div></div>
<div style="position:absolute;top:54px;left:8px;z-index:25;display:flex;gap:6px"><button onclick="openShop()" style="padding:6px 10px;background:#ff9800;border:2px solid #5a3a22;border-radius:10px;font-weight:900;font-size:11px">🏪商店</button><button onclick="openQuest()" style="padding:6px 10px;background:#ffeb3b;border:2px solid #5a3a22;border-radius:10px;font-weight:900;font-size:11px">📜任務</button><button onclick="openDex()" style="padding:6px 10px;background:#90caf9;border:2px solid #5a3a22;border-radius:10px;font-weight:900;font-size:11px">📖圖鑑</button></div>
<div id="dexBox" style="position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;z-index:101;padding:12px"><div class="box"><h3>📖 圖鑑 <span id="dex2">1/4</span></h3><div id="dexGrid" style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px"></div><button onclick="closeDex()" style="margin-top:10px;width:100%;padding:10px;background:#eee;border:3px solid #5a3a22;border-radius:12px;font-weight:900">關閉</button></div></div>
</div>
<script>
const pets=[{img:"./dino1.png.jpg",name:"蛋蛋龍",hp:20,atk:6},{img:"./dino2.png.jpg",name:"BB龍",hp:24,atk:7},{img:"./dino3.png.WEBP",name:"火焰龍",hp:28,atk:9},{img:"./dino4.png.jpg",name:"霸王龍",hp:32,atk:12}];
let save=JSON.parse(localStorage.getItem('yuki_final')||'{}');
let px=save.px??12,py=save.py??12,steps=save.steps??0,dex=save.dex||[true,false,false,false],team=save.team??0,lv=save.lv??1,exp=save.exp??0,gold=save.gold??50,balls=save.balls??3,emy=1,emyHp=24,myHp=pets[team].hp,ans=0,input="",mode="",battleOn=false,quests=save.quests||[{id:1,title:"捉3隻恐龍",need:3,have:0,done:false,reward:30},{id:2,title:"行100步",need:100,have:0,done:false,reward:20}];
let mapData=[];for(let y=0;y<25;y++){mapData[y]=[];for(let x=0;x<25;x++){if((x==12&&y==12)||(x==5&&y==5))mapData[y][x]=4;else if(x==18&&y==18)mapData[y][x]=5;else{let r=Math.random();if(r<0.06)mapData[y][x]=3;else if(r<0.22)mapData[y][x]=1;else if(r<0.27)mapData[y][x]=2;else mapData[y][x]=0;}}}
function saveGame(){localStorage.setItem('yuki_final',JSON.stringify({px,py,steps,dex,team,lv,exp,gold,balls,quests}));}
function buildMap(){let m=document.getElementById('map');m.innerHTML='';for(let y=0;y<25;y++)for(let x=0;x<25;x++){let d=document.createElement('div');d.className='tile';let t=mapData[y][x];if(t==0)d.classList.add('path');if(t==1)d.classList.add('grass');if(t==2)d.classList.add('bush');if(t==3)d.classList.add('water');if(t==4)d.classList.add('town');if(t==5)d.classList.add('shop');d.style.left=x*40+'px';d.style.top=y*40+'px';if(t==4)d.innerHTML='<div style="font-size:20px;text-align:center;line-height:40px">🏠</div>';if(t==5)d.innerHTML='<div style="font-size:20px;text-align:center;line-height:40px">🏪</div>';m.appendChild(d);}place();updateCam();}
function place(){document.getElementById('player').style.left=px*40+'px';document.getElementById('player').style.top=py*40+'px';}
function updateCam(){let wrap=document.getElementById('mapWrap');let cx=wrap.clientWidth/2-20,cy=wrap.clientHeight/2-20;let mapEl=document.getElementById('map');mapEl.style.left=(cx-px*40)+'px';mapEl.style.top=(cy-py*40)+'px';}
function updateUI(){document.getElementById('steps').innerText=steps;document.getElementById('dexCount').innerText=dex.filter(Boolean).length+'/4';document.getElementById('lv').innerText=lv;document.getElementById('pName').innerText=pets[team].name;document.getElementById('gold').innerText=gold;document.getElementById('balls').innerText=balls;document.getElementById('gold2').innerText=gold;document.getElementById('balls2').innerText=balls;document.getElementById('expFill').style.width=Math.min(100,exp/(lv*20)*100)+'%';saveGame();}
function move(dx,dy){if(battleOn)return;let nx=px+dx,ny=py+dy;if(nx<0||nx>=25||ny<0||ny>=25)return;if(mapData[ny][nx]==3)return;px=nx;py=ny;place();updateCam();steps++;quests[1].have=Math.min(quests[1].need,steps);let t=mapData[ny][nx];if(t==4){myHp=pets[team].hp;msg('🏠 法蘭城補血站！HP回滿！');}if(t==5){openShop();}if(t==1||t==2)if(Math.random()<0.16){startBattle();if(navigator.vibrate)navigator.vibrate(30);}updateUI();checkQuest();}
function startBattle(){emy=Math.floor(Math.random()*4);emyHp=pets[emy].hp;myHp=pets[team].hp;battleOn=true;document.getElementById('battle').style.display='flex';document.getElementById('ename').innerText=pets[emy].name;document.getElementById('elV').innerText=Math.max(1,lv-1+Math.floor(Math.random()*3));document.getElementById('eImg').src=pets[emy].img;document.getElementById('mImg').src=pets[team].img;renderBattle();msg2('野生'+pets[emy].name+'出現！打到60%以下用球捉！');}
function renderBattle(){document.getElementById('eHp').style.width=emyHp/pets[emy].hp*100+'%';document.getElementById('mHp').style.width=myHp/pets[team].hp*100+'%';document.getElementById('ehpText').innerText=emyHp+'/'+pets[emy].hp;document.getElementById('mHpText').innerText=myHp+'/'+pets[team].hp;document.getElementById('dexCount').innerText=dex.filter(Boolean).length+'/4';}
function msg(t){document.getElementById('msg').innerText=t;}
function msg2(t){document.getElementById('bmsg').innerText=t;}
function actBall(){if(balls<=0){msg2('無球啦！去商店買！');return;}if(emyHp/pets[emy].hp>0.6){msg2('仲有'+Math.round(emyHp/pets[emy].hp*100)+'%血！打到60%以下先捉到！');return;}openM('捕捉！','ball');}
function openM(title,m,skill){mode=m;document.getElementById('mTitle').innerText=title;let a,b,q;if(skill==1){a=Math.floor(Math.random()*20)+1;b=Math.floor(Math.random()*20)+1;ans=a+b;q=a+' + '+b+' = ?';}else if(skill==2){a=Math.floor(Math.random()*30)+1;b=Math.floor(Math.random()*20)+1;if(a<b)[a,b]=[b,a];ans=a-b;q=a+' - '+b+' = ?';}else if(skill==3){a=Math.floor(Math.random()*9)+1;b=Math.floor(Math.random()*9)+1;ans=a*b;q=a+' × '+b+' = ?';}else{a=Math.floor(Math.random()*20)+1;b=Math.floor(Math.random()*20)+1;ans=a+b;q=a+' + '+b+' = ?';}input='';document.getElementById('ans').innerText='?';document.getElementById('mQ').innerText=q;document.getElementById('mathBox').style.display='flex';document.getElementById('mathBox').dataset.skill=skill;}
function add(n){input=(input||'')+n;if(input.length>4)input=input.slice(0,4);document.getElementById('ans').innerText=input;}
function clr(){input=input.slice(0,-1);document.getElementById('ans').innerText=input||'?';}
function hideM(){document.getElementById('mathBox').style.display='none';}
function closeBattle(){document.getElementById('battle').style.display='none';battleOn=false;}
function ok(){let v=parseInt(input);if(isNaN(v))return;hideM();let skill=parseInt(document.getElementById('mathBox').dataset.skill);if(v===ans){if(mode=='ball'){balls--;if(Math.random()<0.75){dex[emy]=true;quests[0].have++;gold+=10;exp+=15;msg('捉到'+pets[emy].name+'！+10金幣 +15EXP！圖鑑'+dex.filter(Boolean).length+'/4');closeBattle();checkEvo();checkQuest();if(navigator.vibrate)navigator.vibrate([30,50,30]);}else{msg2('走甩咗！再試！-1球');renderBattle();}}else{if(skill==3){myHp=Math.min(pets[team].hp,myHp+10);msg2('治療！+10HP！正解'+ans);renderBattle();}else{let dmg=skill==1?12:10;emyHp=Math.max(0,emyHp-dmg);msg2('打中！-'+dmg+'！正解'+ans);renderBattle();if(emyHp<=0){gold+=5;exp+=10;msg2(pets[emy].name+'倒下！+5金幣+10EXP！可用球捉！');}}updateUI();if(emyHp<=0){}else setTimeout(enemyAtk,500);}else{msg2('答錯！正解'+ans+'，被反擊 -5');myHp=Math.max(0,myHp-5);renderBattle();if(myHp<=0){msg2('全滅返城！');setTimeout(closeBattle,800);myHp=pets[team].hp;}else setTimeout(enemyAtk,500);} updateUI();}
function enemyAtk(){if(!battleOn)return;let dmg=3+Math.floor(Math.random()*4);myHp=Math.max(0,myHp-dmg);renderBattle();msg2('敵人反擊 -'+dmg);if(myHp<=0){msg2('全滅返城！');setTimeout(closeBattle,800);myHp=pets[team].hp;}}
function checkEvo(){if(lv>=5&&team<3&&exp>=lv*20){exp=0;lv++;team++;myHp=pets[team].hp;msg('恭喜進化成'+pets[team].name+'！Lv'+lv);updateUI();}else if(exp>=lv*20){exp-=lv*20;lv++;msg('升級！Lv'+lv+'！');updateUI();}}
function checkQuest(){quests.forEach(q=>{if(!q.done&&q.have>=q.need){q.done=true;gold+=q.reward;msg('任務完成：'+q.title+' +'+q.reward+'金幣！');}});saveGame();}
function openShop(){document.getElementById('shopBox').style.display='flex';updateUI();}
function closeShop(){document.getElementById('shopBox').style.display='none';}
function buyBall(){if(gold>=20){gold-=20;balls++;msg('買到1個精靈球！');updateUI();}else{msg('金幣唔夠！去打怪/做任務！');}}
function openQuest(){let list=document.getElementById('questList');list.innerHTML='';quests.forEach(q=>{let div=document.createElement('div');div.className='q-card';div.innerHTML=`<div style="display:flex;justify-content:space-between"><span>${q.done?'✅':'🎯'} ${q.title}</span><span>${q.have}/${q.need}</span></div><div style="margin-top:4px">獎勵：${q.reward}金幣 ${q.done?'(已完成)':''}</div>`;list.appendChild(div);});document.getElementById('questBox').style.display='flex';}
function closeQuest(){document.getElementById('questBox').style.display='none';}
function openDex(){let g=document.getElementById('dexGrid');g.innerHTML='';pets.forEach((p,i)=>{let c=dex[i];g.innerHTML+=`<div style="background:white;border:3px solid ${c?'#ff9800':'#ccc'};border-radius:14px;padding:8px;text-align:center;font-weight:900;${c?'':'opacity:.4'}"><img src="${p.img}" style="width:56px;height:56px;object-fit:contain;display:block;margin:0 auto"><div>${p.name} Lv${i+1}</div><div style="font-size:10px">${c?(team==i?'隊伍中':'已捉到'):'未見過'}</div></div>`});document.getElementById('dexBox').style.display='flex';document.getElementById('dex2').innerText=dex.filter(Boolean).length+'/4';let cs=document.getElementById('dexGrid').children;[...cs].forEach((el,i)=>{if(dex[i])el.onclick=()=>{team=i;myHp=pets[i].hp;msg(pets[i].name+'入隊！');closeDex();updateUI();}});}
function closeDex(){document.getElementById('dexBox').style.display='none';}
let joy=document.getElementById('joy'),knob=document.getElementById('knob'),drag=false,last=0;
function joyPos(e){let r=joy.getBoundingClientRect();let cx=r.left+r.width/2,cy=r.top+r.height/2;let x=(e.touches?e.touches[0].clientX:e.clientX)-cx,y=(e.touches?e.touches[0].clientY:e.clientY)-cy;let dist=Math.min(Math.sqrt(x*x+y*y),44);let ang=Math.atan2(y,x);return {x:Math.cos(ang)*dist,y:Math.sin(ang)*dist};}
joy.addEventListener('touchstart',e=>{drag=true;e.preventDefault();});joy.addEventListener('mousedown',e=>{drag=true;});
window.addEventListener('touchend',()=>{drag=false;knob.style.transform='translate(-50%,-50%)';});window.addEventListener('mouseup',()=>{drag=false;knob.style.transform='translate(-50%,-50%)';});
window.addEventListener('touchmove',e=>{if(!drag||battleOn)return;let p=joyPos(e);knob.style.transform=`translate(calc(-50% + ${p.x}px), calc(-50% + ${p.y}px))`;let now=Date.now();if(now-last<90)return;last=now;let dx=Math.abs(p.x)>18?(p.x>0?1:-1):0,dy=Math.abs(p.y)>18?(p.y>0?1:-1):0;if(dx||dy)move(dx,dy);},{passive:false});
window.addEventListener('mousemove',e=>{if(!drag||battleOn)return;let p=joyPos(e);knob.style.transform=`translate(calc(-50% + ${p.x}px), calc(-50% + ${p.y}px))`;let now=Date.now();if(now-last<90)return;last=now;let dx=Math.abs(p.x)>18?(p.x>0?1:-1):0,dy=Math.abs(p.y)>18?(p.y>0?1:-1):0;if(dx||dy)move(dx,dy);});
buildMap();updateUI();
</script></body></html>
