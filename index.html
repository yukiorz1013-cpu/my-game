<!DOCTYPE html><html lang="zh-HK"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>V155 真等角奇利村x里謝里雅堡</title>
<style>
*{touch-action:none;user-select:none;box-sizing:border-box}
body{margin:0;background:#000;display:flex;justify-content:center;font-family:-apple-system,sans-serif}
#game{width:100%;max-width:430px;height:100vh;height:100dvh;background:#0e0e1a;position:relative;overflow:hidden;display:flex;flex-direction:column}
#top{height:46px;background:linear-gradient(#1a2a4a,#0e0e1a);border-bottom:2px solid #ffb300;display:flex;justify-content:space-between;align-items:center;padding:0 10px;color:#ffd54f;font-weight:900;font-size:10px}
#mapWrap{flex:1;position:relative;overflow:hidden;background:#e6c87a}
#map{position:absolute;left:0;top:0;width:4800px;height:4800px}
.tile{position:absolute;width:40px;height:40px;background-image:url('./tileset.png');background-size:400px 320px;image-rendering:pixelated;display:flex;align-items:center;justify-content:center}
.desert{background-position:0px 0px}.desert2{background-position:-60px 0px}.cactus{background-position:-120px 0px}
.grass{background-position:-180px 0px}.grass2{background-position:-240px 0px}
.water{background-position:-300px 0px}.water2{background-position:-360px 0px}
.pathH{background-position:0px -80px}.pathV{background-position:-80px -80px}.pathT{background-position:-140px -80px}.pathX{background-position:-200px -80px}
.wall{background-position:-260px -80px}.wall2{background-position:-320px -80px}
.tower{background-position:0px -140px}.house1{background-position:-60px -150px}.house2{background-position:-120px -150px}
.fence{background-position:-190px -155px}.fence2{background-position:-250px -155px}
.palm{background-position:0px -230px}.market{background-position:-60px -235px}.market2{background-position:-120px -235px}
.well{background-position:-190px -235px}.boxes{background-position:-250px -235px}
.shopTile{border:3px solid #ff6f00;box-shadow:0 0 8px #ffb300}
.townTile{border:3px solid #ffb300;box-shadow:0 0 8px #fff}
#player{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;background:white;border:3px solid #ffb300;border-radius:50%;z-index:20;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 0 0 3px #000,0 0 12px #ffb300}
#msg{position:absolute;left:6px;right:6px;bottom:88px;background:rgba(0,0,0,.88);border-left:4px solid #ffb300;color:white;border-radius:8px;padding:6px 10px;font-size:11px;font-weight:700;z-index:10}
#controls{position:absolute;left:0;right:0;bottom:0;height:82px;background:linear-gradient(rgba(0,0,0,.9),#000);border-top:2px solid #ffb300;display:flex;justify-content:space-between;align-items:center;padding:0 8px 6px 8px;z-index:20;padding-bottom:max(6px,env(safe-area-inset-bottom))}
#joy{width:70px;height:70px;background:rgba(255,255,255,.15);border:2px solid #ffb300;border-radius:50%;position:relative}#knob{position:absolute;left:50%;top:50%;width:34px;height:34px;background:white;border-radius:50%;transform:translate(-50%,-50%);border:2px solid #000}
#skills{display:flex;gap:4px}.sbtn{width:50px;height:50px;border-radius:10px;border:2px solid #ffb300;background:#222;color:#ffd54f;font-weight:900;font-size:7px}.sbtn.seal{background:#e91e63;color:white}
#battle{position:absolute;inset:0;background:radial-gradient(#1e3a5f,#0a0a14);z-index:30;display:none;flex-direction:column;color:white}
#pop{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:100;padding:12px}
.box{background:linear-gradient(#fff8e0,#ffe0b2);border:3px solid #ffb300;border-radius:18px;padding:12px;width:100%;max-width:330px;color:#3e2723;text-align:center}
</style></head><body>
<div id="game">
<div id="top"><span>🌍奇利村x里謝里雅堡 Lv<span id="lv">1</span></span><span>💰<span id="gold">120</span> 🎀<span id="balls">14</span> 步<span id="steps">0</span></span></div>
<div id="mapWrap"><div id="map"></div><div id="player">🧑‍🌾</div><div id="msg">V155真地磚版！已用你上傳嘅tileset.png！🏜️沙漠、🌵仙人掌、🌿草、💧水池、🧱城牆、🏠茅草屋、🌴棕櫚、⛲水井、🏪市集！行入去有村長家/PUB/醫院！</div>
<div id="controls"><div id="joy"><div id="knob"></div></div><div id="skills"><button class="sbtn" onclick="doAtk()">🏹亂射</button><button class="sbtn" onclick="doAtk()">💥乾坤</button><button class="sbtn" onclick="openShop()">🏪商店</button><button class="sbtn" onclick="openDex()">📖圖鑑</button><button class="sbtn seal" onclick="trySeal()">🎀封印</button></div></div></div>
<div id="battle"><div style="height:44px;background:#111;border-bottom:2px solid #ffb300;display:flex;justify-content:space-between;align-items:center;padding:0 10px;color:#ffd54f;font-weight:900"><span>⚔️ <span id="ename">水龍蜥</span> <span id="ehpT">70%</span></span><button onclick="closeB()" style="background:#222;color:#ffd54f;border:1px solid #ffb300;border-radius:6px;padding:4px 8px">逃走</button></div><div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center"><div style="width:120px;height:120px;background:white;border:3px solid #ffb300;border-radius:16px;overflow:hidden;display:flex;align-items:center;justify-content:center"><img id="eImg" style="width:100px;height:100px;object-fit:contain"></div><div id="bmsg" style="margin-top:10px;background:rgba(0,0,0,.7);padding:6px 12px;border-radius:8px;font-size:12px">野怪！</div><div style="display:flex;gap:8px;width:90%;margin-top:10px"><button class="sbtn" style="flex:1;height:44px" onclick="doAtk()">攻擊</button><button class="sbtn seal" style="flex:1;height:44px" onclick="trySeal()">封印</button></div></div></div>
<div id="pop"><div class="box" id="popBox"></div></div>
</div>
<script>
const imgs=["./dino1.png.jpg","./dino2.png.jpg","./dino3.png.WEBP","./dino4.png.jpg"];
const pets=[{name:"蛋蛋龍",img:imgs[0]},{name:"黃蜂",img:imgs[1]},{name:"水龍蜥",img:imgs[2]},{name:"哥布林",img:imgs[3]}];
let px=60,py=60,gold=120,balls=14,dex=[true,true,false,false],steps=0,lv=1,emy=2,emyHp=70,battle=false,ans=0,input="",mapSize=120;
let map=[];for(let y=0;y<mapSize;y++){map[y]=[];for(let x=0;x<mapSize;x++){if(x==60&&y==60)map[y][x]=10;else if(x==62&&y==60)map[y][x]=11;else if(x==58&&y==62)map[y][x]=12;else if(x==65&&y==60)map[y][x]=13;else if(x==60&&y==65)map[y][x]=14;else if(x%15==0&&y%15==0)map[y][x]=6;else if(x%12==1&&y%12==1)map[y][x]=7;else{let r=Math.random();if(r<0.04)map[y][x]=4;else if(r<0.10)map[y][x]=3;else if(r<0.14)map[y][x]=2;else if(r<0.18)map[y][x]=5;else if(r<0.22)map[y][x]=8;else if(r<0.25)map[y][x]=1;else map[y][x]=0;}}}
const mapEl=document.getElementById('map');
function build(){mapEl.innerHTML='';for(let y=0;y<mapSize;y++)for(let x=0;x<mapSize;x++){let d=document.createElement('div');d.className='tile';let t=map[y][x];if(t==0)d.classList.add('desert');if(t==1)d.classList.add('desert2');if(t==2)d.classList.add('cactus');if(t==3)d.classList.add('grass');if(t==4)d.classList.add('water');if(t==5)d.classList.add('pathH');if(t==6)d.classList.add('wall');if(t==7)d.classList.add('wall2');if(t==8)d.classList.add('tower');if(t==10){d.classList.add('house1');d.classList.add('townTile');}if(t==11){d.classList.add('house2');d.classList.add('shopTile');}if(t==12){d.classList.add('palm');}if(t==13){d.classList.add('market');d.classList.add('shopTile');}if(t==14){d.classList.add('well');d.classList.add('townTile');}d.style.left=x*40+'px';d.style.top=y*40+'px';mapEl.appendChild(d);}updateCam();}
function updateCam(){let w=document.getElementById('mapWrap');let W=w.clientWidth||430,H=w.clientHeight||600;mapEl.style.left=(W/2-px*40-20)+'px';mapEl.style.top=(H/2-py*40-20)+'px';}
function updateUI(){document.getElementById('gold').innerText=gold;document.getElementById('balls').innerText=balls;document.getElementById('steps').innerText=steps;}
function move(dx,dy){if(battle)return;let nx=px+dx,ny=py+dy;if(nx<0||nx>=mapSize||ny<0||ny>=mapSize)return;if(map[ny][nx]==4)return;px=nx;py=ny;steps++;updateCam();updateUI();let t=map[ny][nx];if(t==10)msg('🏠 村長家/民房！奇利村休息處！');if(t==11)msg('🏠 茅草民房！');if(t==13)msg('🏪 奇利村PUB/雜貨店/醫院！市集檔！');if(t==14)msg('⛲ 綠洲水井！奇利村水源！');if(t==8)msg('🏰 里謝里雅堡哨塔！');if(t==6||t==7)msg('🧱 里謝里雅堡城牆！E1 E2傳送石！');if(t==0||t==1||t==3)if(Math.random()<0.18)startB();}
function msg(t){document.getElementById('msg').innerText=t;}
function startB(){emy=Math.floor(Math.random()*4);emyHp=70;battle=true;document.getElementById('battle').style.display='flex';document.getElementById('ename').innerText=pets[emy].name;document.getElementById('eImg').src=pets[emy].img;document.getElementById('ehpT').innerText=emyHp+'%';document.getElementById('bmsg').innerText='野生'+pets[emy].name+'！';}
function closeB(){document.getElementById('battle').style.display='none';battle=false;}
function doAtk(){let a=Math.floor(Math.random()*12)+2,b=Math.floor(Math.random()*12)+2;ans=a+b;pop(`<h3>🏹 亂射</h3><h1>${a}+${b}=?</h1><div id=ab style="font-size:36px;border:2px solid #000;border-radius:10px;padding:6px">?</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px"><button onclick="addN('1')">1</button><button onclick="addN('2')">2</button><button onclick="addN('3')">3</button><button onclick="addN('4')">4</button><button onclick="addN('5')">5</button><button onclick="addN('6')">6</button><button onclick="addN('7')">7</button><button onclick="addN('8')">8</button><button onclick="addN('9')">9</button><button onclick="clrN()">⌫</button><button onclick="addN('0')">0</button><button style="background:#ffb300" onclick="chk(false)">OK</button></div>`);input="";}
function trySeal(){if(balls<=0){pop('<h3>無卡</h3><button onclick="openShop()">去商店</button>');return;}if(emyHp>60){document.getElementById('bmsg').innerText='仲有'+emyHp+'%血！打到60%以下！';return;}let a=Math.floor(Math.random()*10)+1,b=Math.floor(Math.random()*10)+1;ans=a+b;pop(`<h3>🎀 封印</h3><h1>${a}+${b}=?</h1><div id=ab style="font-size:36px;border:2px solid #000;border-radius:10px;padding:6px">?</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px"><button onclick="addN('1')">1</button><button onclick="addN('2')">2</button><button onclick="addN('3')">3</button><button onclick="addN('4')">4</button><button onclick="addN('5')">5</button><button onclick="addN('6')">6</button><button onclick="addN('7')">7</button><button onclick="addN('8')">8</button><button onclick="addN('9')">9</button><button onclick="clrN()">⌫</button><button onclick="addN('0')">0</button><button style="background:#e91e63;color:white" onclick="chk(true)">封印</button></div>`);input="";}
function addN(n){input+=n;let e=document.getElementById('ab');if(e)e.innerText=input;}function clrN(){input=input.slice(0,-1);document.getElementById('ab').innerText=input||'?';}
function chk(isSeal){let v=parseInt(input);if(isNaN(v))return;closePop();if(v===ans){if(isSeal){balls--;if(Math.random()<0.85){dex[emy]=true;gold+=20;msg('🎉捉到'+pets[emy].name);closeB();}else msg('走甩咗');}else{emyHp=Math.max(0,emyHp-35);document.getElementById('ehpT').innerText=emyHp+'%';document.getElementById('bmsg').innerText='打中-35% 正解'+ans;if(emyHp<=0)document.getElementById('bmsg').innerText='倒下快封印';}updateUI();}else msg('答錯 正解'+ans);}
function pop(h){document.getElementById('popBox').innerHTML=h;document.getElementById('pop').style.display='flex';}function closePop(){document.getElementById('pop').style.display='none';}
function openShop(){pop(`<h3>🏪道具屋</h3><p>🎀封印卡 20金 💰${gold} 🎀${balls}</p><button onclick="if(gold>=20){gold-=20;balls++;updateUI();closePop();msg('買到');}else msg('唔夠金')" style="width:100%;padding:10px;background:#ffb300;border-radius:10px;font-weight:900">買1張</button><button onclick="closePop()" style="width:100%;padding:8px;margin-top:6px">關閉</button>`);}
function openDex(){let h='<h3>📖圖鑑</h3>';pets.forEach((p,i)=>{h+=`<div style="display:flex;gap:8px;align-items:center;border:2px solid ${dex[i]?'#ffb300':'#aaa'};border-radius:8px;padding:4px;margin:4px 0"><img src="${p.img}" style="width:40px;height:40px;object-fit:contain"><span>${p.name} ${dex[i]?'已捉':'未見'}</span></div>`});h+=`<button onclick="closePop()">關閉</button>`;pop(h);}
let joy=document.getElementById('joy'),knob=document.getElementById('knob'),drag=false,last=0;
joy.addEventListener('touchstart',e=>{drag=true;e.preventDefault();});
window.addEventListener('touchend',()=>{drag=false;knob.style.transform='translate(-50%,-50%)';});
window.addEventListener('touchmove',e=>{if(!drag||battle)return;let r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,x=e.touches[0].clientX-cx,y=e.touches[0].clientY-cy,d=Math.min(Math.sqrt(x*x+y*y),32),a=Math.atan2(y,x),nx=Math.cos(a)*d,ny=Math.sin(a)*d;knob.style.transform=`translate(calc(-50% + ${nx}px), calc(-50% + ${ny}px))`;let now=Date.now();if(now-last<80)return;last=now;let dx=Math.abs(nx)>14?(nx>0?1:-1):0,dy=Math.abs(ny)>14?(ny>0?1:-1):0;if(dx||dy)move(dx,dy);},{passive:false});
window.addEventListener('resize',updateCam);
build();
</script></body></html>
