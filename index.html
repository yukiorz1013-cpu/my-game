<!DOCTYPE html><html lang="zh-HK"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>魔力寶貝 新世界 V149 美化版</title>
<style>
*{touch-action:none;-webkit-tap-highlight-color:transparent;user-select:none;box-sizing:border-box}
body{margin:0;background:#0a0a14;display:flex;justify-content:center;font-family:-apple-system,system-ui,sans-serif;overflow:hidden}
#game{width:100%;max-width:430px;height:100vh;height:100dvh;background:linear-gradient(180deg,#1a1a2e 0%,#16213e 100%);position:relative;overflow:hidden;display:flex;flex-direction:column}
#top{height:48px;background:linear-gradient(180deg,#2d1b0e,#1a0f08);border-bottom:2px solid #ffb300;display:flex;justify-content:space-between;align-items:center;padding:0 10px;z-index:20}
#top b{color:#ffd54f;font-size:13px;text-shadow:0 1px 0 #000}
#top small{color:#fff;font-size:11px;font-weight:700}
#mapWrap{flex:1;position:relative;overflow:hidden;background:#a3d977}
#mapCanvas{position:absolute;left:0;top:0;width:100%;height:100%}
#player{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;background:radial-gradient(white,#ffecb3);border:3px solid #ffb300;border-radius:50%;z-index:10;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 0 0 3px #000,0 4px 12px rgba(0,0,0,.5),0 0 20px #ffb300}
#msg{position:absolute;bottom:118px;left:8px;right:8px;background:linear-gradient(180deg,rgba(20,20,20,.92),rgba(0,0,0,.92));border:1px solid #ffb300;border-left:4px solid #ffb300;color:#fff;border-radius:10px;padding:7px 10px;font-size:11px;font-weight:700;line-height:1.3;z-index:8;box-shadow:0 2px 8px rgba(0,0,0,.5)}
#joy{position:absolute;left:14px;bottom:14px;width:110px;height:110px;background:radial-gradient(rgba(255,255,255,.18),rgba(0,0,0,.15));border:2px solid rgba(255,179,0,.6);border-radius:50%;z-index:15;backdrop-filter:blur(2px)}#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;background:radial-gradient(#fff,#e0e0e0);border:2px solid #ffb300;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 3px 0 #000,0 0 10px rgba(255,179,0,.5)}
#skills{position:absolute;right:8px;bottom:10px;display:grid;grid-template-columns:repeat(3,60px);gap:6px;z-index:15}
.sbtn{width:60px;height:60px;border-radius:14px;border:2px solid #ffb300;background:linear-gradient(180deg,#2a2a4a,#1a1a2e);color:#ffd54f;font-weight:900;font-size:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 3px 0 #000,0 2px 6px rgba(0,0,0,.3);line-height:1.1}
.sbtn:active{transform:translateY(3px);box-shadow:0 0 0 #000}
.sbtn.seal{background:linear-gradient(180deg,#ff5a8a,#ad1457);color:white;border-color:#ff8ab4;box-shadow:0 3px 0 #5d0a2e}
#battle{position:absolute;inset:0;background:radial-gradient(ellipse at center,#1e3a5f 0%,#0a0a14 70%);z-index:30;display:none;flex-direction:column}
#battleTop{height:48px;background:linear-gradient(#2d1b0e,#1a0f08);border-bottom:2px solid #ffb300;display:flex;justify-content:space-between;align-items:center;padding:0 10px;color:#ffd54f;font-weight:900;font-size:12px}
#battleMain{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px}
.petCard{width:140px;height:140px;background:radial-gradient(white,#ffecb3);border:3px solid #ffb300;border-radius:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px rgba(255,179,0,.4),0 6px 0 #5d4037;overflow:hidden}
.petCard img{width:120px;height:120px;object-fit:contain}
.hpBar{width:160px;height:14px;background:#111;border:2px solid #000;border-radius:7px;margin-top:12px;overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.5)}
.hpFill{height:100%;background:linear-gradient(90deg,#4caf50,#2e7d32);transition:width .4s}
#pop{position:fixed;inset:0;background:rgba(0,0,0,.88);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:100;padding:14px}
.box{background:linear-gradient(180deg,#fff8e0,#ffe0b2);border:3px solid #ffb300;border-radius:20px;padding:14px;width:100%;max-width:340px;color:#3e2723;box-shadow:0 8px 0 #5d4037,0 12px 24px rgba(0,0,0,.5);max-height:90vh;overflow:auto}
.qBox{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.qBox button{padding:14px;background:white;border:2px solid #5d4037;border-radius:12px;font-weight:900;font-size:18px;box-shadow:0 2px 0 #5d4037}
.qBox button:active{transform:translateY(2px);box-shadow:none;background:#ffb300}
</style></head><body>
<div id="game">
<div id="top"><b>🧑‍🌾 Lv<span id="lv">1</span> <span id="pname">蛋蛋龍</span></b><small>💰<span id="gold">120</span> 🎀<span id="balls">14</span> 圖鑑<span id="dexC">2/4</span> 步<span id="steps">0</span></small></div>
<div id="mapWrap"><canvas id="mapCanvas"></canvas><div id="player">🧑‍🌾</div><div id="msg">V149美化：無限草原，唔再半屏綠空白！真恐龍圖！參考官方新世界PBR卡渲，黃🏠法蘭城補血，橙🏪道具屋，深綠叢林直接封印！</div><div id="joy"><div id="knob"></div></div><div id="skills"><button class="sbtn">🏹<span>亂射</span><span style="font-size:8px;opacity:.8">加法</span></button><button class="sbtn">💥<span>乾坤</span><span style="font-size:8px;opacity:.8">減法</span></button><button class="sbtn" onclick="openShop()">🏪<span>商店</span></button><button class="sbtn" onclick="openDex()">📖<span>圖鑑</span></button><button class="sbtn seal" onclick="trySeal()">🎀<span>封印</span></button><button class="sbtn" onclick="msg('家族獸暫未開放，敬請期待！')">👨‍👩‍👧<span>家族</span></button></div></div>
<div id="battle"><div id="battleTop"><span>⚔️ <span id="ename">水龍蜥</span> <span id="elV">Lv3</span> <span id="ehpT" style="background:#000;padding:2px 6px;border-radius:6px">65%</span></span><button onclick="closeB()" style="background:#222;color:#ffd54f;border:1px solid #ffb300;border-radius:8px;padding:4px 10px;font-weight:900">✕ 逃走</button></div><div id="battleMain"><div class="petCard"><img id="eImg" src=""></div><div class="hpBar"><div id="eHp" class="hpFill" style="width:65%"></div></div><div id="bmsg" style="margin-top:10px;background:rgba(0,0,0,.75);border:1px solid #ffb300;color:white;padding:8px 12px;border-radius:10px;font-weight:700;font-size:12px;text-align:center;min-width:200px">打中 -35% 正封印15</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;margin-top:14px"><button class="sbtn" style="width:100%;height:50px;border-radius:12px" onclick="doAtk()">🏹 亂射</button><button class="sbtn seal" style="width:100%;height:50px;border-radius:12px" onclick="trySeal()">🎀 封印</button></div></div></div>
<div id="pop"><div class="box" id="popBox"></div></div>
</div>
<script>
const petImgs=["./dino1.png.jpg","./dino2.png.jpg","./dino3.png.WEBP","./dino4.png.jpg"];
const pets=[{name:"綠蛋蛋",img:petImgs[0],max:100},{name:"黃蜂",img:petImgs[1],max:100},{name:"水龍蜥",img:petImgs[2],max:100},{name:"哥布林",img:petImgs[3],max:100}];
let save=JSON.parse(localStorage.getItem('yuki149')||'{}');
let px=save.px??50,py=save.py??50,gold=save.gold??120,balls=save.balls??14,dex=save.dex||[true,true,false,false],lv=save.lv??1,exp=save.exp??20,steps=save.steps??0,team=save.team||[0,1],emy=2,emyHp=65,battle=false,ans=0,input="";
let mapSize=120;
let map=[];for(let y=0;y<mapSize;y++){map[y]=[];for(let x=0;x<mapSize;x++){if((x==50&&y==50)||(x==48&&y==48))map[y][x]=4;else if((x==55&&y==55)||(x==60&&y==52))map[y][x]=5;else{let r=Math.random();if(r<0.04)map[y][x]=3;else if(r<0.16)map[y][x]=1;else if(r<0.20)map[y][x]=2;else map[y][x]=0;}}}
const canvas=document.getElementById('mapCanvas'),ctx=canvas.getContext('2d');
function resize(){let dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=canvas.clientWidth*dpr;canvas.height=canvas.clientHeight*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);draw();}
function draw(){let W=canvas.clientWidth,H=canvas.clientHeight;ctx.clearRect(0,0,W,H);let tile=40;let cx=W/2,cy=H/2;let offX=cx-px*tile-tile/2,offY=cy-py*tile-tile/2;
for(let y=py-12;y<=py+12;y++)for(let x=px-12;x<=px+12;x++){if(y<0||y>=mapSize||x<0||x>=mapSize)continue;let sx=x*tile+offX,sy=y*tile+offY;if(sx<-tile||sx>W+tile||sy<-tile||sy>H+tile)continue;let t=map[y][x];
if(t==0){ctx.fillStyle='#f1e2b8';ctx.fillRect(sx,sy,tile,tile);ctx.fillStyle='rgba(0,0,0,.04)';ctx.fillRect(sx,sy,tile,1);ctx.fillRect(sx,sy,1,tile);}else if(t==1){ctx.fillStyle='#9ccc65';ctx.fillRect(sx,sy,tile,tile);ctx.fillStyle='#8bc34a';ctx.fillRect(sx+6,sy+6,tile-12,6);ctx.fillRect(sx+10,sy+16,8,8);}else if(t==2){ctx.fillStyle='#4a7c2e';ctx.fillRect(sx,sy,tile,tile);ctx.fillStyle='#2e5a1a';ctx.beginPath();ctx.arc(sx+tile/2,sy+tile/2-2,tile/2.6,0,Math.PI*2);ctx.fill();ctx.fillStyle='#6aa84f';ctx.beginPath();ctx.arc(sx+tile/2-4,sy+tile/2-6,6,0,Math.PI*2);ctx.fill();}else if(t==3){ctx.fillStyle='#7ec8e3';ctx.fillRect(sx,sy,tile,tile);ctx.fillStyle='#a0d8ef';ctx.fillRect(sx+4,sy+8,tile-8,3);}else if(t==4){ctx.fillStyle='#ffcf4d';ctx.fillRect(sx,sy,tile,tile);ctx.strokeStyle='#e65100';ctx.lineWidth=2;ctx.strokeRect(sx+1,sy+1,tile-2,tile-2);ctx.font='20px serif';ctx.fillStyle='#000';ctx.fillText('🏠',sx+8,sy+26);}else if(t==5){ctx.fillStyle='#ff8a65';ctx.fillRect(sx,sy,tile,tile);ctx.strokeStyle='#bf360c';ctx.lineWidth=2;ctx.strokeRect(sx+1,sy+1,tile-2,tile-2);ctx.font='20px serif';ctx.fillText('🏪',sx+8,sy+26);}}}
// UI
function updateUI(){document.getElementById('lv').innerText=lv;document.getElementById('pname').innerText=pets[team[0]].name;document.getElementById('gold').innerText=gold;document.getElementById('balls').innerText=balls;document.getElementById('dexC').innerText=dex.filter(Boolean).length+'/4';document.getElementById('steps').innerText=steps;localStorage.setItem('yuki149',JSON.stringify({px,py,gold,balls,dex,lv,exp,steps,team}));}
function move(dx,dy){if(battle)return;let nx=px+dx,ny=py+dy;if(nx<0||nx>=mapSize||ny<0||ny>=mapSize)return;if(map[ny][nx]==3)return;px=nx;py=ny;steps++;draw();updateUI();let t=map[ny][nx];if(t==4){msg('🏠 法蘭城東門廣場！HP回滿，家族獸休息中！');}if(t==5){openShop();}if(t==1||t==2)if(Math.random()<0.18){startB();}else msg(`探索中… ${t==1?'綠草叢':'深綠叢林'} 步數${steps}`);}
function msg(t){document.getElementById('msg').innerText=t;}
function startB(){emy=Math.floor(Math.random()*4);emyHp=100-Math.floor(Math.random()*20);battle=true;document.getElementById('battle').style.display='flex';document.getElementById('ename').innerText=pets[emy].name;document.getElementById('eImg').src=pets[emy].img;document.getElementById('eImg').onerror=function(){this.src=pets[0].img};document.getElementById('eHp').style.width=emyHp+'%';document.getElementById('ehpT').innerText=emyHp+'%';document.getElementById('bmsg').innerText=`野生${pets[emy].name}！打中 -35% 正解15`;}
function closeB(){document.getElementById('battle').style.display='none';battle=false;}
function doAtk(){popMath(false);}function trySeal(){if(balls<=0){pop(`<h3>🎀 封印卡唔夠</h3><p>去法蘭城道具屋買，20金幣1張</p><button class="sbtn" style="width:100%;height:44px;margin-top:8px" onclick="openShop()">🏪 去商店</button><button class="sbtn" style="width:100%;height:36px;margin-top:6px;background:#222;color:white" onclick="closePop()">關閉</button>`);return;}if(emyHp>60){document.getElementById('bmsg').innerText=`仲有${emyHp}%血！打到60%以下先捉到！用亂射/乾坤！`;return;}popMath(true);}
function popMath(isSeal){let a=Math.floor(Math.random()*12)+2,b=Math.floor(Math.random()*12)+2;ans=a+b;let title=isSeal?'🎀 封印！加法':'🏹 亂射！加法';let okText=isSeal?'封印':'OK';let okColor=isSeal?'#e91e63':'#ff9800';pop(`<div style="text-align:center"><h3 style="margin:0;color:#e65100">${title}</h3><h1 style="font-size:36px;margin:10px 0">${a} + ${b} = ?</h1><div id=ans style="font-size:38px;font-weight:900;border:3px solid #5d4037;border-radius:14px;padding:8px;background:white;min-height:56px">?</div><div class=qBox><button onclick="addN('1')">1</button><button onclick="addN('2')">2</button><button onclick="addN('3')">3</button><button onclick="addN('4')">4</button><button onclick="addN('5')">5</button><button onclick="addN('6')">6</button><button onclick="addN('7')">7</button><button onclick="addN('8')">8</button><button onclick="addN('9')">9</button><button onclick="clrN()">⌫</button><button onclick="addN('0')">0</button><button style="background:${okColor};color:white" onclick="chk(${isSeal})">${okText}</button></div></div>`);input="";}
function addN(n){input+=n;if(input.length>4)input=input.slice(0,4);let el=document.getElementById('ans');if(el)el.innerText=input;}
function clrN(){input=input.slice(0,-1);let el=document.getElementById('ans');if(el)el.innerText=input||'?';}
function chk(isSeal){let v=parseInt(input);if(isNaN(v))return;closePop();if(v===ans){if(isSeal){balls--;if(Math.random()<0.85){dex[emy]=true;if(!team.includes(emy)&&team.length<5)team.push(emy);gold+=20;exp+=15;msg(`🎉 封印成功！${pets[emy].name}加入！+20金幣！圖鑑${dex.filter(Boolean).length}/4`);closeB();checkLv();}else{msg('封印失敗！走甩咗！再試！');document.getElementById('bmsg').innerText='走甩咗！再試！-1封印卡';}updateUI();}else{emyHp=Math.max(0,emyHp-35);document.getElementById('eHp').style.width=emyHp+'%';document.getElementById('ehpT').innerText=emyHp+'%';document.getElementById('bmsg').innerText=`打中！-35%！正解${ans} 仲有${emyHp}%`;if(emyHp<=0)document.getElementById('bmsg').innerText='倒下！快用🎀封印！';gold+=2;exp+=2;updateUI();}}else{document.getElementById('bmsg').innerText=`答錯！正解${ans}，被反擊！`;msg(`答錯！正解${ans}，-10%血！`);}}
function checkLv(){if(exp>=lv*20){exp=0;lv++;msg(`🎉 升級！Lv${lv}！新世界冒險更強！`);updateUI();}}
function pop(html){document.getElementById('popBox').innerHTML=html;document.getElementById('pop').style.display='flex';}
function closePop(){document.getElementById('pop').style.display='none';}
function openShop(){pop(`<h3 style="margin:0">🏪 法蘭城道具屋 - 新世界特典</h3><div style="background:white;border:2px solid #ffb300;border-radius:12px;padding:10px;margin:10px 0;text-align:left;font-size:12px;line-height:1.4">🎀 封印卡 x1 - 20金幣<br>官方玩法：野外自由抓必備！滿檔神寵直接封印！<br>💰 你有 ${gold} 金幣 🎀 ${balls} 張</div><button onclick="buy()" style="width:100%;padding:12px;background:linear-gradient(#ffb300,#ff8f00);border:3px solid #5d4037;border-radius:12px;font-weight:900;font-size:14px;box-shadow:0 3px 0 #5d4037">買1張 (20金幣)</button><button onclick="closePop()" style="width:100%;padding:10px;margin-top:8px;background:#eee;border:2px solid #5d4037;border-radius:12px;font-weight:900">離開</button>`);}
function buy(){if(gold>=20){gold-=20;balls++;updateUI();pop(`<h3>🎉 買到！</h3><p>🎀 封印卡 +1<br>而家有 ${balls} 張 💰剩 ${gold}</p><button onclick="closePop()" style="width:100%;padding:10px;background:#ffb300;border-radius:10px;font-weight:900">繼續冒險</button>`);}else pop(`<h3>💰 金幣唔夠！</h3><p>去打怪賺金幣！</p><button onclick="closePop()" style="width:100%;padding:10px;background:#eee;border-radius:10px;font-weight:900">關閉</button>`);}
function openDex(){let h='<h3 style="margin:0 0 8px 0">📖 滿檔神寵圖鑑 - 新世界</h3>';pets.forEach((p,i)=>{let c=dex[i];h+=`<div style="display:flex;align-items:center;gap:8px;background:${c?'white':'#eee'};border:2px solid ${c?'#ffb300':'#aaa'};border-radius:12px;padding:6px;margin:6px 0;opacity:${c?1:0.5}"><img src="${p.img}" style="width:44px;height:44px;object-fit:contain;border-radius:8px;background:white" onerror="this.src='./dino1.png.jpg'"><div style="text-align:left"><div style="font-weight:900">${p.name} ${c?'':'(未見)'}</div><div style="font-size:10px">${c?(team.includes(i)?'隊伍中 ⭐':'倉庫中':'未見過'):'去草叢捉！'}</div></div><div style="margin-left:auto;font-size:10px">${c?'✅':''}</div></div>`});h+=`<button onclick="closePop()" style="width:100%;padding:10px;margin-top:8px;background:#222;color:#ffd54f;border:2px solid #ffb300;border-radius:12px;font-weight:900">關閉</button>`;pop(h);}
// joystick
let joy=document.getElementById('joy'),knob=document.getElementById('knob'),drag=false,last=0;
joy.addEventListener('touchstart',e=>{drag=true;e.preventDefault();});
window.addEventListener('touchend',()=>{drag=false;knob.style.transform='translate(-50%,-50%)';});
window.addEventListener('touchmove',e=>{if(!drag||battle)return;let r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,x=e.touches[0].clientX-cx,y=e.touches[0].clientY-cy,d=Math.min(Math.sqrt(x*x+y*y),42),a=Math.atan2(y,x),nx=Math.cos(a)*d,ny=Math.sin(a)*d;knob.style.transform=`translate(calc(-50% + ${nx}px), calc(-50% + ${ny}px))`;let now=Date.now();if(now-last<85)return;last=now;let dx=Math.abs(nx)>16?(nx>0?1:-1):0,dy=Math.abs(ny)>16?(ny>0?1:-1):0;if(dx||dy)move(dx,dy);},{passive:false});
window.addEventListener('resize',resize);
resize();draw();updateUI();
// 讓技能按鈕都觸發攻擊
document.querySelectorAll('#skills .sbtn')[0].onclick=()=>{if(battle)doAtk();else msg('去草叢遇怪先用到亂射！');};
document.querySelectorAll('#skills .sbtn')[1].onclick=()=>{if(battle)doAtk();else msg('去草叢遇怪先用到乾坤！');};
</script></body></html>
