<!DOCTYPE html><html lang="zh-HK"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>魔力寶貝 新世界風 V147</title>
<style>
*{touch-action:none;-webkit-tap-highlight-color:transparent;user-select:none;box-sizing:border-box}
body{margin:0;background:#0e0e1a;display:flex;justify-content:center;font-family:-apple-system,system-ui,sans-serif;overflow:hidden}
#game{width:100%;max-width:430px;height:100vh;height:100dvh;background:linear-gradient(#2a2a5a,#1a1a2e);position:relative;overflow:hidden;display:flex;flex-direction:column;color:white}
#top{background:linear-gradient(#3d2a1a,#1f130a);border-bottom:2px solid #ffcc4d;display:flex;justify-content:space-between;align-items:center;padding:6px 8px;z-index:30}
.pet-bar{display:flex;gap:4px}.pet-slot{width:36px;height:36px;background:#111;border:2px solid #555;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;overflow:hidden}.pet-slot.active{border-color:#ffcc4d;box-shadow:0 0 6px #ffcc4d}.pet-slot img{width:32px;height:32px;object-fit:contain}
#goldBar{font-size:11px;font-weight:900;color:#ffd54f;text-align:right}
.exp{height:5px;background:#222;border-radius:3px;width:90px;overflow:hidden;margin-top:2px}.exp-fill{height:100%;background:linear-gradient(#ffd54f,#ff9800);width:30%}
#mapWrap{flex:1;position:relative;overflow:hidden;background:#7bb86f;border-top:2px solid #5a9a2a;border-bottom:2px solid #5a9a2a}
#map{position:absolute;width:1200px;height:1200px;left:0;top:0}
.tile{position:absolute;width:40px;height:40px;border:0.5px solid rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700}
.path{background:#e8d5a8 url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40"><rect width="40" height="40" fill="%23e8d5a8"/><circle cx="10" cy="10" r="1" fill="%23c9b88a"/></svg>')}.grass{background:#8bc34a}.bush{background:radial-gradient(#5a9a2a,#3d7a1a);border:2px dashed #2a5a1a}.water{background:linear-gradient(#6ec6ff,#3a9ad9)}.town{background:radial-gradient(#ffd54f,#ffb300);border:2px solid #ff9800}.shop{background:radial-gradient(#ff8a65,#e64a19);border:2px solid #bf360c}
#player{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;background:white;border:3px solid #ffcc4d;border-radius:50%;z-index:20;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 0 0 3px black,0 0 12px #ffcc4d}
#msg{position:absolute;bottom:130px;left:8px;right:8px;background:rgba(0,0,0,.82);border:1px solid #ffcc4d;color:#fff;border-radius:10px;padding:8px;font-size:11px;font-weight:700;z-index:25;pointer-events:none}
#joy{position:absolute;left:14px;bottom:14px;width:114px;height:114px;background:rgba(255,255,255,.15);border:2px solid rgba(255,204,77,.6);border-radius:50%;z-index:30}.joy-knob{position:absolute;left:50%;top:50%;width:52px;height:52px;background:radial-gradient(white,#ddd);border:2px solid #ffcc4d;border-radius:50%;transform:translate(-50%,-50%)}
#skills{position:absolute;right:10px;bottom:12px;display:grid;grid-template-columns:repeat(3,58px);gap:6px;z-index:30}
.sbtn{width:58px;height:58px;border-radius:12px;border:2px solid #ffcc4d;background:linear-gradient(#3a3a5a,#1a1a2e);color:white;font-weight:900;font-size:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 3px 0 #000}
.sbtn:active{transform:translateY(3px);box-shadow:none}
.sbtn.seal{background:linear-gradient(#f48fb1,#ad1457)}
#battle{position:absolute;inset:0;background:linear-gradient(#1a2a5a,#0e0e1a);z-index:50;display:none;flex-direction:column;padding:8px}
.seal-card{background:linear-gradient(white,#ffe0b2);border:3px solid #ff9800;border-radius:16px;padding:12px;color:#3e2723;font-weight:900;text-align:center;box-shadow:0 6px 0 #5d4037}
#pop{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:100;padding:12px}
.box{background:linear-gradient(#fff8e0,#ffecb3);border:3px solid #ff9800;border-radius:20px;padding:14px;width:100%;max-width:340px;color:#3e2723;max-height:90vh;overflow:auto}
.btn{width:100%;padding:10px;border:3px solid #3e2723;border-radius:12px;font-weight:900;margin-top:6px}
.num{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.num button{padding:14px;background:white;border:2px solid #3e2723;border-radius:10px;font-weight:900;font-size:18px}
</style></head><body>
<div id="game">
<div id="top"><div><div style="display:flex;align-items:center;gap:6px"><span>🧑‍🌾 Lv<span id="lv">1</span></span><div class="exp"><div id="expFill" class="exp-fill"></div></div></div><div class="pet-bar" id="petBar"></div></div><div id="goldBar">💰<span id="gold">100</span><br>🎀<span id="balls">5</span><br>圖鑑 <span id="dexC">1/4</span></div></div>
<div id="mapWrap"><div id="map"></div><div id="player">🧑‍🌾</div><div id="msg">V147 新世界風：參考官方《魔力寶貝：新世界》- 10萬人超大服風格。一人五寵！黃🏠法蘭城 東門傳送，橙🏪道具屋，深綠叢林直接封印！搖桿行路！</div><div id="joy"><div class="joy-knob" id="knob"></div></div><div id="skills"><button class="sbtn" onclick="openM('亂射 加法')">🏹<br>亂射</button><button class="sbtn" onclick="openM('乾坤 減法')">💥<br>乾坤</button><button class="sbtn" onclick="openM('隕石 乘法')">🔥<br>隕石</button><button class="sbtn" onclick="openShop()">🏪<br>商店</button><button class="sbtn" onclick="openDex()">📖<br>圖鑑</button><button class="sbtn seal" onclick="trySeal()">🎀<br>封印</button></div></div>
<div id="battle"><div style="display:flex;justify-content:space-between;font-weight:900;color:#ffcc4d"><span>⚔️ 遭遇 <span id="ename">黃蜂</span> Lv<span id="elV">3</span></span><span id="ehpT"></span><button onclick="closeBattle()" style="background:#222;color:white;border:1px solid #ffcc4d;border-radius:6px;padding:4px 8px">逃走</button></div><div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center"><img id="eImg" style="width:120px;height:120px;object-fit:contain;background:white;border-radius:20px;border:3px solid #ffcc4d"><div style="width:160px;height:12px;background:#222;border-radius:6px;margin-top:10px;overflow:hidden"><div id="eHp" style="height:100%;background:linear-gradient(#ff5252,#b71c1c);width:100%"></div></div><div id="bmsg" style="margin-top:12px;background:rgba(0,0,0,.7);color:white;padding:8px 12px;border-radius:8px;font-weight:700;font-size:12px">官方風：血量60%以下用封印卡直接捉！</div></div><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px"><button class="sbtn" style="width:100%;height:48px;border-radius:12px" onclick="openM('亂射 加法')">🏹 亂射(加)</button><button class="sbtn seal" style="width:100%;height:48px;border-radius:12px" onclick="trySeal()">🎀 封印</button></div></div>
<div id="pop"><div class="box" id="popBox"></div></div>
</div>
<script>
const petData=[{img:"./dino1.png.jpg",name:"螳螂"},{img:"./dino2.png.jpg",name:"黃蜂"},{img:"./dino3.png.WEBP",name:"水龍蜥"},{img:"./dino4.png.jpg",name:"哥布林"}];
let save=JSON.parse(localStorage.getItem('yuki147')||'{}');
let px=save.px??15,py=save.py??15,lv=save.lv??1,exp=save.exp??0,gold=save.gold??100,balls=save.balls??5,dex=save.dex||[true,false,false,false],team=save.team||[0],emy=1,emyHp=100,battle=false,ans=0,input="";
let map=[];for(let y=0;y<30;y++){map[y]=[];for(let x=0;x<30;x++){if((x==15&&y==15)||(x==6&&y==6))map[y][x]=4;else if(x==22&&y==22)map[y][x]=5;else{let r=Math.random();if(r<0.05)map[y][x]=3;else if(r<0.20)map[y][x]=1;else if(r<0.26)map[y][x]=2;else map[y][x]=0;}}}
function saveG(){localStorage.setItem('yuki147',JSON.stringify({px,py,lv,exp,gold,balls,dex,team}));}
function build(){let m=document.getElementById('map');m.innerHTML='';for(let y=0;y<30;y++)for(let x=0;x<30;x++){let d=document.createElement('div');d.className='tile';let t=map[y][x];if(t==0)d.classList.add('path');if(t==1)d.classList.add('grass');if(t==2)d.classList.add('bush');if(t==3)d.classList.add('water');if(t==4){d.classList.add('town');d.innerText='🏠';}if(t==5){d.classList.add('shop');d.innerText='🏪';}d.style.left=x*40+'px';d.style.top=y*40+'px';m.appendChild(d);}updateCam();updateUI();}
function updateCam(){let wrap=document.getElementById('mapWrap');let w=wrap.clientWidth||430,h=wrap.clientHeight||600;let el=document.getElementById('map');el.style.left=(w/2-px*40-20)+'px';el.style.top=(h/2-py*40-20)+'px';}
function updateUI(){document.getElementById('lv').innerText=lv;document.getElementById('gold').innerText=gold;document.getElementById('balls').innerText=balls;document.getElementById('dexC').innerText=dex.filter(Boolean).length+'/4';document.getElementById('expFill').style.width=Math.min(100,exp/(lv*30)*100)+'%';let bar=document.getElementById('petBar');bar.innerHTML='';for(let i=0;i<5;i++){let idx=team[i];let div=document.createElement('div');div.className='pet-slot'+(i==0?' active':'');if(idx!==undefined){div.innerHTML=`<img src="${petData[idx].img}">`;}else{div.innerText='+';}bar.appendChild(div);}saveG();}
function move(dx,dy){if(battle)return;let nx=px+dx,ny=py+dy;if(nx<0||nx>=30||ny<0||ny>=30)return;if(map[ny][nx]==3)return;px=nx;py=ny;updateCam();let t=map[ny][nx];if(t==4){msg('🏠 回到法蘭城東門廣場！補血！');}if(t==5){openShop();}if(t==1||t==2)if(Math.random()<0.20){startBattle();if(navigator.vibrate)navigator.vibrate(40);}}
function msg(t){document.getElementById('msg').innerText=t;}
function startBattle(){emy=Math.floor(Math.random()*4);emyHp=100;battle=true;document.getElementById('battle').style.display='flex';document.getElementById('ename').innerText=petData[emy].name;document.getElementById('elV').innerText=Math.max(1,lv+Math.floor(Math.random()*3)-1);document.getElementById('eImg').src=petData[emy].img;document.getElementById('eHp').style.width='100%';document.getElementById('ehpT').innerText='100%';document.getElementById('bmsg').innerText='官方玩法：打到60%以下用封印卡！'+petData[emy].name+'等緊你！';}
function closeBattle(){document.getElementById('battle').style.display='none';battle=false;}
function trySeal(){if(balls<=0){pop('🎀 封印卡唔夠！去法蘭城道具屋買！<br><button class=btn onclick=openShop()>去商店</button><button class=btn onclick=closePop()>關閉</button>');return;}if(emyHp>60){document.getElementById('bmsg').innerText='仲有'+emyHp+'%血！打到60%以下先封到！用亂射/乾坤打佢！';return;}openM('封印 加法',true);}
function openM(title,isSeal){let a=Math.floor(Math.random()*20)+1,b=Math.floor(Math.random()*20)+1,op=Math.random()<0.5?'+':'-';if(op=='-'&&a<b)[a,b]=[b,a];ans=op=='+'?a+b:a-b;let q=`${a} ${op} ${b} = ?`;pop(`<div class=seal-card><h3>${isSeal?'🎀 封印！':'⚔️ '+title}</h3><h1 style="font-size:36px;margin:10px 0">${q}</h1><div id=ans style="font-size:40px;border:3px solid #5d4037;border-radius:12px;padding:8px;background:white;min-height:56px">?</div><div class=num><button onclick=addN('1')>1</button><button onclick=addN('2')>2</button><button onclick=addN('3')>3</button><button onclick=addN('4')>4</button><button onclick=addN('5')>5</button><button onclick=addN('6')>6</button><button onclick=addN('7')>7</button><button onclick=addN('8')>8</button><button onclick=addN('9')>9</button><button onclick=clrN()>⌫</button><button onclick=addN('0')>0</button><button style=background:#ff9800;color:white onclick=checkA(${isSeal?'true':'false'})>OK</button></div></div>`);input="";}
function addN(n){input+=n;if(input.length>4)input=input.slice(0,4);let el=document.getElementById('ans');if(el)el.innerText=input;}
function clrN(){input=input.slice(0,-1);let el=document.getElementById('ans');if(el)el.innerText=input||'?';}
function checkA(isSeal){let v=parseInt(input);if(isNaN(v))return;closePop();if(v===ans){if(isSeal){balls--;if(Math.random()<0.8){dex[emy]=true;if(team.length<5&&!team.includes(emy))team.push(emy);gold+=20;exp+=20;msg(`🎉 封印成功！捉到${petData[emy].name}！+20金 官方滿檔神寵已入隊！`);closeBattle();checkLv();}else{msg('封印失敗！再試！');document.getElementById('bmsg').innerText='走甩咗！再打低啲再封！';}}else{let dmg=title=>title.includes('隕石')?30:15;emyHp=Math.max(0,emyHp-30);document.getElementById('eHp').style.width=emyHp+'%';document.getElementById('ehpT').innerText=emyHp+'%';if(emyHp<=0){document.getElementById('bmsg').innerText=petData[emy].name+'倒下！快用封印！';gold+=10;exp+=10;}else document.getElementById('bmsg').innerText='打中！-30%！正解'+ans;}updateUI();}else{msg(`答錯！正解${ans}，被反擊！`);}}
function checkLv(){if(exp>=lv*30){exp-=lv*30;lv++;msg(`🎉 升級！Lv${lv}！新世界冒險更強！`);updateUI();}}
function pop(html){document.getElementById('popBox').innerHTML=html;document.getElementById('pop').style.display='flex';}
function closePop(){document.getElementById('pop').style.display='none';}
function openShop(){pop(`<h3>🏪 法蘭城道具屋 - 新世界特典</h3><div style="background:white;border:2px solid #ff9800;border-radius:12px;padding:10px;margin:8px 0;text-align:left;font-size:12px">🎀 封印卡 x1 - 20金幣<br>官方玩法：野外自由抓必備！<br>💰你有 ${gold} 金幣</div><button class=btn style=background:#ff9800 onclick=buy()>買1張 (20金幣)</button><button class=btn onclick=closePop()>離開</button>`);}
function buy(){if(gold>=20){gold-=20;balls++;updateUI();pop(`<h3>買到！</h3><p>🎀 封印卡 +1<br>而家有 ${balls} 張</p><button class=btn onclick=closePop()>繼續冒險</button>`);}else pop(`<h3>金幣唔夠！</h3><p>去打怪賺金幣！</p><button class=btn onclick=closePop()>關閉</button>`);}
function openDex(){let html='<h3>📖 滿檔神寵圖鑑 - 新世界</h3>';petData.forEach((p,i)=>{let c=dex[i];html+=`<div style="display:flex;align-items:center;gap:8px;background:white;border:2px solid ${c?'#ff9800':'#ccc'};border-radius:12px;padding:6px;margin:6px 0;opacity:${c?1:0.4}"><img src="${p.img}" style="width:40px;height:40px;object-fit:contain"><div style="text-align:left"><div style="font-weight:900">${p.name}</div><div style="font-size:10px">${c?'已封印 '+ (team.includes(i)?'隊伍中':'倉庫':'未見過')}</div></div></div>`});html+=`<button class=btn onclick=closePop()>關閉</button>`;pop(html);}
// joystick
let joy=document.getElementById('joy'),knob=document.getElementById('knob'),drag=false,last=0;
function pos(e){let r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,x=(e.touches?e.touches[0].clientX:e.clientX)-cx,y=(e.touches?e.touches[0].clientY:e.clientY)-cy,d=Math.min(Math.sqrt(x*x+y*y),42),a=Math.atan2(y,x);return {x:Math.cos(a)*d,y:Math.sin(a)*d};}
joy.addEventListener('touchstart',e=>{drag=true;e.preventDefault();});
window.addEventListener('touchend',()=>{drag=false;knob.style.transform='translate(-50%,-50%)';});
window.addEventListener('touchmove',e=>{if(!drag||battle)return;let p=pos(e);knob.style.transform=`translate(calc(-50% + ${p.x}px), calc(-50% + ${p.y}px))`;let now=Date.now();if(now-last<90)return;last=now;let dx=Math.abs(p.x)>16?(p.x>0?1:-1):0,dy=Math.abs(p.y)>16?(p.y>0?1:-1):0;if(dx||dy)move(dx,dy);},{passive:false});
window.addEventListener('load',()=>{build();setTimeout(build,200);});
build();
</script></body></html>
