<!DOCTYPE html><html lang="zh-HK"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V59 原版節奏跳皮</title>
<style>body{margin:0;background:#0f0f23;display:flex;justify-content:center;font-family:-apple-system,sans-serif}#game{width:100%;max-width:440px;background:linear-gradient(#fff3e0,#e8f5e9);min-height:100vh;padding:14px;box-sizing:border-box;text-align:center;position:relative}.card{background:white;border-radius:22px;padding:14px;margin:10px 0}.pet-wrap{height:280px;display:flex;align-items:flex-end;justify-content:center}.pet-img{object-fit:contain;display:block;transition:width 0.6s,height 0.6s}.stage-badge{display:inline-block;background:#e8f5e9;color:#2e7d32;border:2px solid #a5d6a7;padding:6px 16px;border-radius:20px;font-size:13px;font-weight:bold;margin:8px 0}.btn{width:100%;padding:14px;border:none;border-radius:14px;font-size:18px;font-weight:bold;margin:5px 0;cursor:pointer}.btn-go{background:#66bb6a;color:white}.btn-leader{background:linear-gradient(135deg,#a5d6a7,#2e7d32);color:white}.btn-evo{background:gold;display:none}.timer{font-size:20px;font-weight:bold;color:#2e7d32;background:#e8f5e9;padding:6px 14px;border-radius:20px;display:inline-block;margin-top:6px}.prog-bg{background:#eee;border-radius:12px;height:22px;overflow:hidden;margin:10px 0;position:relative}.prog-fill{height:100%;background:linear-gradient(90deg,#a5d6a7,#2e7d32);transition:width 0.5s}.prog-text{position:absolute;width:100%;top:3px;font-weight:bold;font-size:12px;text-align:center}#mathBox,#leadBox,#musicBox{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:9999;padding:14px}.box{background:white;width:100%;max-width:380px;border-radius:24px;padding:20px;text-align:center;border:4px solid #a5d6a7}.box input{font-size:18px;padding:10px;border:3px solid #a5d6a7;border-radius:12px;width:85%;margin:5px 0;text-align:center;font-weight:bold}#toast{position:fixed;top:38%;left:50%;transform:translate(-50%,-50%);padding:14px 22px;border-radius:20px;font-size:18px;font-weight:bold;z-index:10001;display:none;color:white}.lead-row{display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #e8f5e9;font-size:13px}.music-btn{position:absolute;top:10px;right:10px;background:white;border-radius:50%;width:40px;height:40px;border:none;font-size:20px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2)}.music-opt{padding:10px;margin:6px 0;border:2px solid #e8f5e9;border-radius:12px;cursor:pointer;text-align:left}.music-opt.active{border-color:#66bb6a;background:#e8f5e9}@keyframes pop{0%{transform:scale(1)}30%{transform:scale(1.35)}100%{transform:scale(1)}}@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}</style></head><body>
<div id="game"><button class="music-btn" onclick="openMusic()">🎵</button><h2>🦖 數學霸恐龍王</h2><div class="card"><div class="pet-wrap"><img id="petImg" class="pet-img" src="./dino1.png.jpg" style="animation:bounce 0.85s infinite"></div><h3 id="petName"></h3><div class="stage-badge" id="stageBadge"></div><br><div class="timer">⏱️ <span id="timer">00:00</span></div><div class="prog-bg"><div id="progBar" class="prog-fill"></div><div id="progText" class="prog-text"></div></div><p style="font-size:13px"><b id="solved">0</b>題 | <b id="score">0</b>分</p></div><button class="btn btn-go" onclick="startQ()">▶️ 開始做題</button><button class="btn btn-evo" id="evoBtn" onclick="doEvo()">⚡️ 進化</button><button class="btn btn-leader" onclick="openLeader()">👑 霸主榜</button></div>
<div id="mathBox"><div class="box"><h1 id="mQ" style="font-size:36px"></h1><input id="mAns" type="tel"><br><br><button class="btn" style="background:#66bb6a;color:white" onclick="checkAns()">確定</button><button class="btn" style="background:#eee" onclick="hideMath()">取消</button></div></div>
<div id="leadBox"><div class="box"><h2>👑 霸主榜</h2><div id="leadList"></div><div style="margin-top:10px;border-top:3px dashed #a5d6a7;padding-top:10px"><input id="playerName" placeholder="霸主名號"><input id="playerPwd" type="password" placeholder="4位密碼"><button class="btn" style="background:#66bb6a;color:white" onclick="uploadScore()">🔒 登榜</button><button class="btn" style="background:#eee" onclick="closeLeader()">關閉</button></div></div></div>
<div id="musicBox"><div class="box"><h2>🎵 背景音樂</h2><div class="music-opt active" onclick="setMusic('original_rhythm',this)">🎺 原片10:20節奏 跳皮版 (新)</div><div class="music-opt" onclick="setMusic('mute',this)">🔇 靜音</div><button class="btn" style="background:#eee;margin-top:10px" onclick="closeMusic()">完成</button></div></div><div id="toast"></div>
<script>
const BUCKET_ID="9xrLimS38pHRafoTWwqfSP",KEY="yuki_leaderboard";
const pets=[{img:"./dino1.png.jpg",name:"Lv.1 蛋蛋龍",total:20},{img:"./dino2.png.jpg",name:"Lv.2 BB龍",total:20},{img:"./dino3.png.WEBP",name:"Lv.3 火焰龍",total:20},{img:"./dino4.png.jpg",name:"Lv.4 霸王龍",total:20}];
let petIdx=0,solvedLv=0,total=0,score=0,ans=0,ac,startTime=0,timerInterval=null,bgmTimer=null;let currentMusic='original_rhythm',masterVol=0.16;
let saved=JSON.parse(localStorage.getItem('yuki_v59')||'{}');if(saved.petIdx!=null){petIdx=saved.petIdx;solvedLv=saved.solvedLv;total=saved.total;score=saved.score;}
function save(){localStorage.setItem('yuki_v59',JSON.stringify({petIdx,solvedLv,total,score,startTime,currentMusic}));}
function showToast(t,c){let e=document.getElementById('toast');e.innerText=t;e.style.background=c;e.style.display='block';setTimeout(()=>e.style.display='none',1500);}
function formatTime(ms){let s=Math.floor(ms/1000),m=Math.floor(s/60);s%=60;return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;}
function getElapsed(){return startTime==0?0:Date.now()-startTime;}
function update(){let p=pets[petIdx];document.getElementById('petImg').src=p.img;document.getElementById('petName').innerText=p.name;let base=40,max=260;let size=base+(solvedLv/p.total)*(max-base);let img=document.getElementById('petImg');img.style.width=size+'px';img.style.height=size+'px';document.getElementById('stageBadge').innerText='✨ 長大 '+(solvedLv+1<=p.total?solvedLv+1:p.total)+'/20 段';if(solvedLv>=p.total)document.getElementById('stageBadge').innerText='🎉 20/20 滿級！可進化';let pct=Math.round(solvedLv/p.total*100);document.getElementById('progBar').style.width=pct+'%';document.getElementById('progText').innerText=solvedLv+'/20 段';document.getElementById('solved').innerText=total;document.getElementById('score').innerText=score;document.getElementById('evoBtn').style.display=solvedLv>=p.total?'block':'none';document.getElementById('timer').innerText=formatTime(getElapsed());save();}
function ensureAudio(){try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();}catch(e){}}
// 原片節奏版 - 管樂行進：強-弱-弱 強-弱-弱
function playNote(freq,dur,volScale=1,isHarm=false,isAccent=false){
  try{
    ensureAudio();let t0=ac.currentTime;let vol=masterVol*volScale*(isHarm?0.5:1)*(isAccent?1.35:1);
    let filter=ac.createBiquadFilter();filter.type='lowpass';filter.frequency.value=isAccent?1250:1100;
    let o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=freq;
    g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+0.02);g.gain.linearRampToValueAtTime(vol*0.75,t0+0.1);g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
    o.connect(g);g.connect(filter);filter.connect(ac.destination);o.start(t0);o.stop(t0+dur);
  }catch(e){}
}
function playOriginalRhythm(){
  if(bgmTimer)clearTimeout(bgmTimer);
  // 寶可夢綠原曲旋律 + 10:20管樂團行進節奏
  // 節奏型： 0.45, 0.22, 0.22, 0.45, 0.22, 0.22, 0.85 循環，有強弱
  let seq=[
    {r:261.63,h:329.63,d:0.45,a:1}, // 強
    {r:329.63,h:415.30,d:0.22,a:0}, // 弱
    {r:392.00,h:523.25,d:0.22,a:0},
    {r:392.00,h:523.25,d:0.45,a:1}, // 強
    {r:329.63,h:415.30,d:0.22,a:0},
    {r:261.63,h:329.63,d:0.22,a:0},
    {r:392.00,h:523.25,d:0.85,a:1}, // 長 - 行進感
    
    {r:440.00,h:554.37,d:0.45,a:1},
    {r:493.88,h:659.25,d:0.22,a:0},
    {r:523.25,h:783.99,d:0.22,a:0},
    {r:523.25,h:659.25,d:0.45,a:1},
    {r:392.00,h:523.25,d:0.22,a:0},
    {r:329.63,h:415.30,d:0.22,a:0},
    {r:392.00,h:493.88,d:0.85,a:1},
    
    {r:261.63,h:329.63,d:0.35,a:0},
    {r:329.63,h:415.30,d:0.35,a:0},
    {r:392.00,h:523.25,d:0.35,a:1}, // 3連跳皮
    {r:523.25,h:659.25,d:0.35,a:1},
    {r:392.00,h:523.25,d:0.45,a:0},
    {r:329.63,h:415.30,d:0.22,a:0},
    {r:293.66,h:369.99,d:0.22,a:0},
    {r:329.63,h:415.30,d:0.85,a:1},
  ];
  let i=0;
  function tick(){
    let n=seq[i%seq.length];
    playNote(n.r,n.d+0.2,1.0,false,n.a==1);
    setTimeout(()=>playNote(n.h,n.d*0.7,0.6,true,false),50);
    i++;
    bgmTimer=setTimeout(tick,n.d*1000+120);
  }
  tick();
}
function sfxCorrect(){
  try{
    ensureAudio();let t0=ac.currentTime;if(bgmTimer){clearTimeout(bgmTimer);bgmTimer=null;setTimeout(()=>{if(currentMusic!=='mute') playOriginalRhythm();},650);}
    [523.25,659.25,783.99,1046.5].forEach((f,idx)=>{
      let o=ac.createOscillator(),g=ac.createGain(),filter=ac.createBiquadFilter();
      filter.type='highpass';filter.frequency.value=900;
      o.type='triangle';o.frequency.value=f;
      g.gain.setValueAtTime(0,t0+idx*0.09);g.gain.linearRampToValueAtTime(0.34,t0+idx*0.09+0.02);g.gain.exponentialRampToValueAtTime(0.001,t0+idx*0.09+0.7);
      o.connect(g);g.connect(filter);filter.connect(ac.destination);o.start(t0+idx*0.09);o.stop(t0+idx*0.09+0.7);
    });
  }catch(e){}
}
function sfxWrong(){try{ensureAudio();let t0=ac.currentTime;let o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(180,t0);o.frequency.exponentialRampToValueAtTime(70,t0+0.3);g.gain.setValueAtTime(0.4,t0);g.gain.exponentialRampToValueAtTime(0.001,t0+0.4);o.connect(g);g.connect(ac.destination);o.start(t0);o.stop(t0+0.4);}catch(e){}}
function playCurrent(){if(currentMusic==='original_rhythm')playOriginalRhythm();else if(bgmTimer){clearTimeout(bgmTimer);bgmTimer=null;}}
function setMusic(url,el){currentMusic=url;document.querySelectorAll('.music-opt').forEach(o=>o.classList.remove('active'));if(el)el.classList.add('active');save();if(bgmTimer){clearTimeout(bgmTimer);bgmTimer=null;}if(startTime!=0)playCurrent();closeMusic();}
function startQ(){ensureAudio();if(startTime==0){startTime=Date.now();timerInterval=setInterval(()=>document.getElementById('timer').innerText=formatTime(getElapsed()),1000);}playCurrent();let a,b,q;if(petIdx==0){a=Math.floor(Math.random()*26);b=Math.floor(Math.random()*(51-a));ans=a+b;q=a+' + '+b+' = ?';}else if(petIdx==1){a=Math.floor(Math.random()*50)+1;b=Math.floor(Math.random()*(a+1));ans=a-b;q=a+' - '+b+' = ?';}else if(petIdx==2){a=Math.floor(Math.random()*9)+1;b=Math.floor(Math.random()*9)+1;ans=a*b;q=a+' × '+b+' = ?';}else{b=Math.floor(Math.random()*9)+2;ans=Math.floor(Math.random()*9)+1;a=b*ans;q=a+' ÷ '+b+' = ?';}document.getElementById('mQ').innerText=q;document.getElementById('mathBox').style.display='flex';document.getElementById('mAns').value='';}
function hideMath(){document.getElementById('mathBox').style.display='none';}
function checkAns(){let v=parseInt(document.getElementById('mAns').value);if(v===ans){solvedLv++;total++;score+=10;sfxCorrect();let img=document.getElementById('petImg');img.style.animation='pop 0.45s';setTimeout(()=>img.style.animation='',450);hideMath();update();}else{sfxWrong();showToast('❌ 再諗下','#ff5252');document.getElementById('mAns').value='';}}
function doEvo(){if(solvedLv>=pets[petIdx].total&&petIdx<3){petIdx++;solvedLv=0;update();showToast('⚡️ 進化！','#ff9800');}else openLeader();}
async function loadLeaderboard(){let el=document.getElementById('leadList');el.innerHTML='⏳...';let c=[];try{let r=await fetch(`https://kvdb.io/${BUCKET_ID}/${KEY}?t=${Date.now()}`,{cache:'no-store'});if(r.ok){let t=await r.text();if(t)c=c.concat(JSON.parse(t));}}catch(e){}if(!c.length){el.innerHTML='未有霸主';return;}let m={};c.forEach(x=>{let k=x.name.toLowerCase();if(!m[k]||x.score>m[k].score)m[k]=x;});let u=Object.values(m).sort((a,b)=>b.score-a.score).slice(0,20);el.innerHTML=u.map((r,i)=>`<div class="lead-row"><span>${i+1}. ${r.name}</span><span>${r.score}分 | ⏱️${r.timeStr}</span></div>`).join('');}
async function uploadScore(){let n=document.getElementById('playerName').value.trim(),p=document.getElementById('playerPwd').value.trim();if(!n||!p){showToast('名+密碼必填','#ff9800');return;}let e={name:n,score,timeMs:getElapsed(),timeStr:formatTime(getElapsed()),pwd:p};try{let r=await fetch(`https://kvdb.io/${BUCKET_ID}/${KEY}?t=${Date.now()}`);let d=[];if(r.ok){let t=await r.text();if(t)d=JSON.parse(t);}d=d.filter(x=>x.name.toLowerCase()!=n.toLowerCase());d.push(e);d.sort((a,b)=>b.score-a.score);await fetch(`https://kvdb.io/${BUCKET_ID}/${KEY}`,{method:'POST',body:JSON.stringify(d)});showToast('👑 上榜','#66bb6a');}catch(e){}loadLeaderboard();}
function openLeader(){document.getElementById('leadBox').style.display='flex';loadLeaderboard();}
function closeLeader(){document.getElementById('leadBox').style.display='none';}
function openMusic(){document.getElementById('musicBox').style.display='flex';}
function closeMusic(){document.getElementById('musicBox').style.display='none';}
update();
</script></body></html>
