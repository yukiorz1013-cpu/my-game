<!DOCTYPE html><html lang="zh-HK"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Bloom GO V3 真地圖</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{box-sizing:border-box;font-family:-apple-system,sans-serif}body{margin:0;background:#000;display:flex;justify-content:center}
#game{width:100%;max-width:430px;height:100vh;height:100dvh;position:relative;overflow:hidden;display:flex;flex-direction:column;background:#111}
#map{flex:1;position:relative;z-index:1}
#top{position:absolute;top:0;left:0;right:0;height:56px;background:rgba(17,17,17,.92);backdrop-filter:blur(8px);display:flex;justify-content:space-between;align-items:center;padding:0 10px;color:#fff;font-weight:900;font-size:12px;z-index:500;border-bottom:2px solid #ffeb3b}
#monCard{position:absolute;left:50%;top:64px;transform:translateX(-50%);width:136px;background:rgba(255,255,255,.96);border:3px solid #222;border-radius:18px;padding:6px;text-align:center;z-index:500;box-shadow:0 0 0 4px #ffeb3b,0 8px 24px rgba(0,0,0,.5)}
#mon{font-size:56px;line-height:1}
#stats{margin-top:4px;display:flex;justify-content:space-between;font-size:10px;font-weight:800;color:#222}
#log{position:absolute;left:8px;right:8px;bottom:146px;background:rgba(0,0,0,.78);color:#fff;border-radius:12px;padding:6px 10px;font-size:11px;z-index:500;pointer-events:none;border:1px solid rgba(255,235,59,.5)}
#bottom{height:138px;background:#111;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px;z-index:500;border-top:2px solid #333}
.btn{background:#222;border:2px solid #444;color:#fff;border-radius:14px;font-weight:900;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.btn.mini{border-color:#ffeb3b;background:#332800}
.btn:active{transform:scale(.94)}
#evoBar{height:6px;background:#333;border-radius:3px;overflow:hidden;margin-top:4px}#evoFill{height:100%;width:10%;background:linear-gradient(90deg,#ffeb3b,#ff9800);transition:width .3s}
.leaflet-control-attribution{font-size:9px !important}
#miniPop{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:9999;padding:12px}
.box{background:linear-gradient(#fff8e0,#ffe0b2);border:3px solid #ffb300;border-radius:18px;padding:14px;width:100%;max-width:380px;text-align:center;color:#3e2723}
</style></head><body>
<div id="game">
<div id="map"></div>
<div id="top"><div>🥚 <span id="name">滾球獸</span> Lv<span id="lv">1</span></div><div>👣<span id="steps">0</span> 🌸<span id="fm">0</span>m 🏆<span id="wins">0</span></div></div>
<div id="monCard"><div id="mon">🥚</div><div id="stats"><span>🍖<span id="hungry">80</span></span><span>💖<span id="happy">80</span></span><span>💩<span id="poop">0</span></span><span>💪<span id="power">10</span></span></div><div id="evoBar"><div id="evoFill"></div></div><div style="font-size:10px;margin-top:2px">進化 <span id="evoP">8</span>%</div></div>
<div id="log">📍 定位緊... 允許GPS先有真地圖！（Pokémon GO + Pikmin Bloom）</div>
<div id="bottom">
<button class="btn" onclick="act('feed')">🍙<span>餵食</span></button>
<button class="btn" onclick="act('clean')">🧹<span>清理</span></button>
<button class="btn" onclick="act('train')">🏋️<span>訓練</span></button>
<button class="btn" onclick="centerMe()">📍<span>回中</span></button>
<button class="btn mini" onclick="openMini('guess')">🎲<span>猜左右</span></button>
<button class="btn mini" onclick="openMini('catch')">💩<span>接便便</span></button>
<button class="btn mini" onclick="spawnWild()">📡<span>雷達</span><small>GO</small></button>
<button class="btn mini" style="border-color:#ff4081" onclick="act('evo')">✨<span>進化</span></button>
</div>
</div>
<div id="miniPop"><div class="box" id="miniBox"></div></div>
<script>
let steps=parseInt(localStorage.getItem('mb3_steps')||'0'),flowers=0,wins=parseInt(localStorage.getItem('mb3_wins')||'0');
let mon={name:'滾球獸',stage:0,form:0,hungry:80,happy:80,poop:0,power:10,lv:1,evo:parseInt(localStorage.getItem('mb3_evo')||'8')};
let stageNames=[['🥚 蛋','滾球獸','亞古獸','暴龍獸','戰鬥暴龍獸'],['泡泡','年糕獸','甲蟲獸','比多獸','超比多獸'],['咪咪','小狗獸','迪路獸','天女獸','神聖天女獸']];
let flowerPath=[],wildMarkers=[],map,playerMarker,flowerLine;

// 真地圖
map=L.map('map',{zoomControl:false,attributionControl:true}).setView([22.3193,114.1694],16);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
flowerLine=L.polyline([],{color:'#e91e63',weight:8,opacity:0.7,lineCap:'round',lineJoin:'round'}).addTo(map);
let flowerDots=L.layerGroup().addTo(map);

function updateUI(){
 document.getElementById('steps').innerText=steps;
 document.getElementById('fm').innerText=Math.floor(flowerPath.length*5);
 document.getElementById('wins').innerText=wins;
 document.getElementById('hungry').innerText=mon.hungry;
 document.getElementById('happy').innerText=mon.happy;
 document.getElementById('poop').innerText=mon.poop;
 document.getElementById('power').innerText=mon.power;
 document.getElementById('lv').innerText=mon.lv;
 document.getElementById('name').innerText=mon.name;
 document.getElementById('evoP').innerText=mon.evo;
 document.getElementById('evoFill').style.width=mon.evo+'%';
 let emoji=mon.stage===0?'🥚':mon.stage===1?'🐣':mon.stage===2?'🦖':mon.stage===3?'🦕':'🤖';
 if(mon.form===1)emoji='🐞';if(mon.form===2)emoji='🐱';
 document.getElementById('mon').innerText=emoji;
 localStorage.setItem('mb3_steps',steps);localStorage.setItem('mb3_wins',wins);localStorage.setItem('mb3_evo',mon.evo);
}
function log(t){document.getElementById('log').innerText=t;}

function act(type){
 if(type==='feed'){if(mon.hungry>=100){log('飽喇');return;}mon.hungry=Math.min(100,mon.hungry+20);mon.poop=Math.min(5,mon.poop+1);mon.happy+=5;log('餵食🍙 他媽哥池');}
 else if(type==='clean'){if(mon.poop===0){log('好乾淨');return;}mon.poop=0;mon.happy+=10;log('清理🧹');}
 else if(type==='train'){if(mon.hungry<20){log('太肚餓');return;}mon.hungry-=15;mon.power+=3;mon.evo+=5;log('數碼暴龍機訓練💪');}
 else if(type==='evo'){if(mon.evo<100){log(`進化值${mon.evo}%唔夠100`);return;}mon.stage=Math.min(4,mon.stage+1);let line=Math.floor(Math.random()*3);mon.form=line;mon.name=stageNames[line][mon.stage]||'究極體';mon.lv++;mon.evo=0;mon.power+=10;log(`✨ 進化！${mon.name}`);}
 updateUI();
}

function centerMe(){if(playerMarker) map.setView(playerMarker.getLatLng(),17);}

function spawnWild(){
 // Pokémon GO式補給站/野生
 if(!playerMarker)return log('等GPS定位先');
 let center=playerMarker.getLatLng();
 for(let i=0;i<3;i++){
   let lat=center.lat+(Math.random()-0.5)*0.002;
   let lng=center.lng+(Math.random()-0.5)*0.002;
   let type=Math.random()<0.5?'egg':'flower';
   let icon=L.divIcon({html:type==='egg'?'🥚':'🌸',className:'',iconSize:[32,32]});
   let m=L.marker([lat,lng],{icon}).addTo(map);
   m.on('click',()=>{
     if(type==='egg'){mon.evo+=8;log('📡 捉到野生蛋！進化+8 (Pokémon GO)');}
     else{flowers+=10;mon.evo+=3;log('採到大花叢！🌸+10 (Pikmin Bloom)');}
     map.removeLayer(m);updateUI();
   });
   wildMarkers.push(m);
   setTimeout(()=>{if(map.hasLayer(m))map.removeLayer(m);},30000);
 }
 log('📡 雷達掃到附近3個野生點！行去點佢 (Pokémon GO)');
}

// 真GPS + Pikmin Bloom花路
let lastPos=null;
if(navigator.geolocation){
 navigator.geolocation.watchPosition(pos=>{
   let lat=pos.coords.lat||pos.coords.latitude,lng=pos.coords.lng||pos.coords.longitude;
   if(!lat) return;
   let cur=L.latLng(pos.coords.latitude,pos.coords.longitude);
   if(!playerMarker){
     playerMarker=L.marker(cur,{icon:L.divIcon({html:'<div style="width:20px;height:20px;background:#2196f3;border:3px solid #fff;border-radius:50%;box-shadow:0 0 10px #2196f3"></div>',iconSize:[20,20]})}).addTo(map);
     map.setView(cur,17);log('📍 定位成功！行路會開花，點地圖上蛋！');
   }else{
     playerMarker.setLatLng(cur);
   }
   if(!lastPos){lastPos=cur;return;}
   let dist=lastPos.distanceTo(cur);
   if(dist>5){ // 行咗5米
     steps+=Math.floor(dist);flowers+=Math.floor(dist/2);flowerPath.push(cur);flowerLine.addLatLng(cur);
     // Pikmin Bloom小花
     L.circleMarker(cur,{radius:5,color:'#e91e63',fillColor:'#ff80ab',fillOpacity:0.8,weight:2}).addTo(flowerDots);
     mon.evo+=0.5;mon.happy=Math.min(100,mon.happy+0.3);
     if(Math.random()<0.08) spawnWild();
     updateUI();lastPos=cur;
   }
 },err=>{log('GPS失敗: '+err.message+' 用假定位行住先');initFakeWalk();},{enableHighAccuracy:true,maximumAge:2000});
}else{
 initFakeWalk();
}
function initFakeWalk(){log('無GPS，用點擊地圖模擬行路 (Pikmin Bloom)');map.on('click',e=>{flowerPath.push(e.latlng);flowerLine.addLatLng(e.latlng);steps+=5;flowers+=2;mon.evo+=1;updateUI();log('模擬行路👣 花路+5m');});}

// 小遊戲
function openMini(id){
 let box=document.getElementById('miniBox');
 if(id==='guess'){
   let ans=Math.random()<0.5?'left':'right';
   box.innerHTML=`<h3>🎲 左右猜</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button class="btn" style="height:60px" onclick="guessRes('left','${ans}')">⬅️ 左</button><button class="btn" style="height:60px" onclick="guessRes('right','${ans}')">右 ➡️</button></div><button class="btn" style="margin-top:8px;height:44px;width:100%;background:#111;color:#fff" onclick="closeMini()">關</button>`;
 }else if(id==='catch'){
   box.innerHTML=`<h3>💩 接便便</h3><p>點擊接！接3個贏</p><div id="poopArea" style="height:180px;background:#a3d977;border:3px solid #000;border-radius:12px;position:relative;overflow:hidden"><div id="bask" style="position:absolute;bottom:4px;left:50%;font-size:28px">🧺</div></div><div>分 <span id="ps">0</span>/3</div>`;
   setTimeout(startCatch,200);
 }
 document.getElementById('miniPop').style.display='flex';
}
function closeMini(){document.getElementById('miniPop').style.display='none';}
function guessRes(pick,ans){if(pick===ans){wins++;mon.happy=Math.min(100,mon.happy+12);mon.evo+=8;log('估中！💖+12');}else{mon.happy=Math.max(0,mon.happy-5);log('估錯');}updateUI();closeMini();}
function startCatch(){
 let area=document.getElementById('poopArea'),bask=document.getElementById('bask'),score=0,bx=50;
 area.addEventListener('touchmove',e=>{let r=area.getBoundingClientRect();bx=((e.touches[0].clientX-r.left)/r.width)*100;bask.style.left=bx+'%';});
 area.addEventListener('mousemove',e=>{let r=area.getBoundingClientRect();bx=((e.clientX-r.left)/r.width)*100;bask.style.left=bx+'%';});
 let loop=setInterval(()=>{
   if(!document.getElementById('poopArea')){clearInterval(loop);return;}
   let d=document.createElement('div');d.innerText='💩';d.style.position='absolute';d.style.left=Math.random()*90+'%';d.style.top='0px';d.style.fontSize='22px';d.style.transition='top 1.2s linear';area.appendChild(d);
   setTimeout(()=>d.style.top='150px',20);
   setTimeout(()=>{let dx=Math.abs(parseFloat(d.style.left)-bx);if(dx<12){score++;document.getElementById('ps').innerText=score;d.remove();if(score>=3){clearInterval(loop);wins++;mon.happy=Math.min(100,mon.happy+15);mon.evo+=10;mon.poop=Math.max(0,mon.poop-1);updateUI();log('接便便完美！');closeMini();}}else d.remove();},1200);
 },600);
}

updateUI();
setTimeout(spawnWild,2000);
</script></body></html>
