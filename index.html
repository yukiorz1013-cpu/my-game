<!DOCTYPE html><html lang="zh-HK"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>數學霸恐龍王</title>
<style>body{margin:0;background:#0f0f23;display:flex;justify-content:center;font-family:-apple-system,sans-serif}#game{width:100%;max-width:440px;background:linear-gradient(#fff8e1,#ffcc80);min-height:100vh;padding:14px;box-sizing:border-box;text-align:center;position:relative}.card{background:white;border-radius:22px;padding:14px;margin:10px 0;overflow:visible}.pet-wrap{height:240px;display:flex;align-items:flex-end;justify-content:center;position:relative}.pet-img{object-fit:contain;display:block;transition:width 0.6s cubic-bezier(0.34,1.56,0.64,1),height 0.6s cubic-bezier(0.34,1.56,0.64,1);}.stage-badge{position:absolute;top:0;right:10px;background:#ff9800;color:white;padding:4px 10px;border-radius:12px;font-size:12px;font-weight:bold}.btn{width:100%;padding:14px;border:none;border-radius:14px;font-size:18px;font-weight:bold;margin:5px 0;cursor:pointer}.btn-go{background:#66bb6a;color:white}.btn-leader{background:linear-gradient(135deg,#ff9800,#f44336);color:white}.btn-evo{background:gold;display:none;animation:shake 0.5s infinite}.timer{font-size:20px;font-weight:bold;color:#e65100;background:#fff3e0;padding:6px 14px;border-radius:20px;display:inline-block}.prog-bg{background:#eee;border-radius:12px;height:20px;overflow:hidden;margin:8px 0;position:relative}.prog-fill{height:100%;background:#66bb6a;transition:.4s}.prog-text{position:absolute;width:100%;top:2px;font-weight:bold;font-size:12px;text-align:center}#mathBox,#leadBox,#musicBox{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:9999;padding:14px}.box{background:white;width:100%;max-width:380px;border-radius:24px;padding:20px;text-align:center;border:4px solid #ff9800}.box input{font-size:18px;padding:10px;border:3px solid #ff9800;border-radius:12px;width:85%;margin:5px 0;text-align:center;font-weight:bold}#toast{position:fixed;top:38%;left:50%;transform:translate(-50%,-50%);padding:16px 24px;border-radius:20px;font-size:16px;font-weight:bold;z-index:10001;display:none;color:white}.lead-row{display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #ffe0b2;font-size:13px}.music-btn{position:absolute;top:10px;right:10px;background:white;border-radius:50%;width:40px;height:40px;border:none;font-size:20px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2)}.music-opt{padding:10px;margin:6px 0;border:2px solid #ffe0b2;border-radius:12px;cursor:pointer;text-align:left}.music-opt.active{border-color:#ff9800;background:#fff3e0}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}@keyframes growPop{0%{transform:scale(1)}50%{transform:scale(1.4)}100%{transform:scale(1)}}</style></head><body>
<div id="game">
<button class="music-btn" onclick="openMusic()">🎵</button>
<h2>🦖 數學霸恐龍王</h2><div class="card">
<div class="pet-wrap"><div class="stage-badge" id="stageBadge">1/20</div><img id="petImg" class="pet-img" src="./dino1.png.jpg"></div>
<h3 id="petName"></h3><div class="timer">⏱️ <span id="timer">00:00</span></div><div class="prog-bg"><div id="progBar" class="prog-fill"></div><div id="progText" class="prog-text"></div></div><p style="font-size:13px"><b id="solved">0</b>題 | <b id="score">0</b>分</p></div><button class="btn btn-go" onclick="startQ()">▶️ 開始做題</button><button class="btn btn-evo" id="evoBtn" onclick="doEvo()">⚡️ 20級滿！進化</button><button class="btn btn-leader" onclick="openLeader()">👑 霸主榜</button></div>
<div id="mathBox"><div class="box"><h1 id="mQ" style="font-size:34px"></h1><input id="mAns" type="tel"><br><br><button class="btn" style="background:#ff9800;color:white" onclick="checkAns()">確定</button><button class="btn" style="background:#eee" onclick="hideMath()">取消</button></div></div>
<div id="leadBox"><div class="box"><h2>👑 霸主榜</h2><div id="leadList"></div><div style="margin-top:10px;border-top:3px dashed #ff9800;padding-top:10px"><input id="playerName" placeholder="霸主名號"><input id="playerPwd" type="password" placeholder="4位密碼"><button class="btn" style="background:#66bb6a;color:white" onclick="uploadScore()">🔒 登榜</button><button class="btn" style="background:#eee" onclick="closeLeader()">關閉</button></div></div></div>
<div id="musicBox"><div class="box"><h2>🎵 背景音樂</h2>
<div class="music-opt active" onclick="setMusic('electronic',this)">🎹 童趣九因電子版</div>
<div class="music-opt" onclick="setMusic('https://cdn.pixabay.com/download/audio/2022/03/24/audio_09bd4170e4.mp3',this)">😊 開心小朋友</div>
<div class="music-opt" onclick="setMusic('https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3',this)">☁️ 輕鬆LoFi</div>
<div class="music-opt">📁 上傳自己MP3<input type="file" id="uploadMp3" accept="audio/*" style="width:100%;margin-top:8px" onchange="uploadMusic(this)"></div>
<button class="btn" style="background:#eee;margin-top:10px" onclick="closeMusic()">完成</button>
</div></div>
<div id="toast"></div>
<audio id="bgm" loop playsinline webkit-playsinline preload="auto"></audio>
<script>
const BUCKET_ID="9xrLimS38pHRafoTWwqfSP",KEY="yuki_leaderboard";
const pets=[{img:"./dino1.png.jpg",name:"Lv.1 蛋蛋龍",total:20},{img:"./dino2.png.jpg",name:"Lv.2 BB龍",total:20},{img:"./dino3.png.WEBP",name:"Lv.3 火焰龍",total:20},{img:"./dino4.png.jpg",name:"Lv.4 霸王龍",total:20}];
let petIdx=0,solvedLv=0,total=0,score=0,ans=0,ac,startTime=0,timerInterval=null,bgmTimer=null;
let currentMusic='electronic';
let saved=JSON.parse(localStorage.getItem('yuki_v45')||'{}'); if(saved.petIdx!=null){petIdx=saved.petIdx;solvedLv=saved.solvedLv;total=saved.total;score=saved.score;currentMusic=saved.currentMusic||'electronic';}
function save(){localStorage.setItem('yuki_v45',JSON.stringify({petIdx,solvedLv,total,score,startTime,currentMusic}));}
function showToast(t,c){let e=document.getElementById('toast');e.innerText=t;e.style.background=c;e.style.display='block';setTimeout(()=>e.style.display='none',2200);}
function formatTime(ms){let s=Math.floor(ms/1000),m=Math.floor(s/60);s%=60;return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;}
function getElapsed(){return startTime==0?0:Date.now()-startTime;}
function update(){
  let p=pets[petIdx];
  document.getElementById('petImg').src=p.img;
  document.getElementById('petName').innerText=p.name;
  // 20次變大：60px -> 220px，每級+8px
  let base=60, max=220;
  let size = base + (solvedLv / p.total) * (max - base);
  let img=document.getElementById('petImg');
  img.style.width=size+'px';
  img.style.height=size+'px';
  document.getElementById('stageBadge').innerText=(solvedLv+1<=p.total ? solvedLv+1 : p.total)+'/20';
  if(solvedLv>=p.total) document.getElementById('stageBadge').innerText='20/20 滿級';
  let pct=Math.round(solvedLv/p.total*100);
  document.getElementById('progBar').style.width=pct+'%';
  document.getElementById('progText').innerText=solvedLv+'/'+p.total+' 段';
  document.getElementById('solved').innerText=total;
  document.getElementById('score').innerText=score;
  let b=document.getElementById('evoBtn');
  b.style.display=solvedLv>=p.total?'block':'none';
  document.getElementById('timer').innerText=formatTime(getElapsed());
  save();
}
function ensureAudio(){try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended')ac.resume();}catch(e){}}
function beep(f,d,v=0.5){try{ensureAudio(); let o=ac.createOscillator(),g=ac.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(ac.destination); g.gain.setValueAtTime(v,ac.currentTime); g.gain.exponentialRampToValueAtTime(0.01,ac.currentTime+d); o.start(); o.stop(ac.currentTime+d);}catch(e){}}
function playElectronic(){if(bgmTimer) clearInterval(bgmTimer); let scale=[523.25,587.33,659.25,783.99,880,1046.5]; let i=0; bgmTimer=setInterval(()=>{beep(scale[i%scale.length],0.4,0.32); i++;},380);}
function playMp3(url){if(bgmTimer) clearInterval(bgmTimer); let a=document.getElementById('bgm'); a.pause(); a.src=url; a.volume=0.7; a.play().catch(()=>{playElectronic();});}
function setMusic(url,el){currentMusic=url; document.querySelectorAll('.music-opt').forEach(o=>o.classList.remove('active')); if(el) el.classList.add('active'); save(); if(startTime!=0){ if(url==='electronic') playElectronic(); else playMp3(url);} closeMusic();}
function uploadMusic(inp){let f=inp.files[0]; if(!f) return; let url=URL.createObjectURL(f); currentMusic=url; save(); if(startTime!=0) playMp3(url); closeMusic(); showToast('已換成你上傳嘅歌','#66bb6a');}
function playCurrent(){if(currentMusic==='electronic') playElectronic(); else playMp3(currentMusic);}
function startQ(){ensureAudio(); if(startTime==0){startTime=Date.now(); timerInterval=setInterval(()=>document.getElementById('timer').innerText=formatTime(getElapsed()),1000);} playCurrent(); let a,b,q;if(petIdx==0){a=Math.floor(Math.random()*26);b=Math.floor(Math.random()*(51-a));ans=a+b;q=a+' + '+b+' = ?';}else if(petIdx==1){a=Math.floor(Math.random()*50)+1;b=Math.floor(Math.random()*(a+1));ans=a-b;q=a+' - '+b+' = ?';}else if(petIdx==2){a=Math.floor(Math.random()*9)+1;b=Math.floor(Math.random()*9)+1;ans=a*b;q=a+' × '+b+' = ?';}else{b=Math.floor(Math.random()*9)+2;ans=Math.floor(Math.random()*9)+1;a=b*ans;q=a+' ÷ '+b+' = ?';}document.getElementById('mQ').innerText=q;document.getElementById('mathBox').style.display='flex';document.getElementById('mAns').value='';}
function hideMath(){document.getElementById('mathBox').style.display='none';}
function checkAns(){
  let v=parseInt(document.getElementById('mAns').value);
  if(v===ans){
    solvedLv++;total++;score+=10;
    beep(900,0.12,0.6); setTimeout(()=>beep(1200,0.2,0.6),120);
    let img=document.getElementById('petImg');
    img.style.animation='growPop 0.4s';
    setTimeout(()=>img.style.animation='',400);
    if(solvedLv>=pets[petIdx].total){
      hideMath();update();
      showToast('🎉 20段滿！可以進化喇！','#ff9800');
    }else{
      hideMath();update();
      showToast('✨ 長大！'+solvedLv+'/20 段','#66bb6a');
    }
  }else{beep(150,0.4,0.7); showToast('❌ 再諗下','#ff5252');document.getElementById('mAns').value='';}
}
function doEvo(){if(solvedLv>=pets[petIdx].total&&petIdx<3){petIdx++;solvedLv=0;update(); showToast('⚡️ 進化！由細BB重新長大','#ff9800');}else openLeader();}
async function loadLeaderboard(){let el=document.getElementById('leadList');el.innerHTML='⏳...';let c=[];try{let r=await fetch(`https://kvdb.io/${BUCKET_ID}/${KEY}?t=${Date.now()}`,{cache:'no-store'});if(r.ok){let t=await r.text();if(t)c=c.concat(JSON.parse(t));}}catch(e){}if(!c.length){el.innerHTML='未有霸主';return;}let m={};c.forEach(x=>{let k=x.name.toLowerCase();if(!m[k]||x.score>m[k].score)m[k]=x;});let u=Object.values(m).sort((a,b)=>b.score-a.score).slice(0,20);el.innerHTML=u.map((r,i)=>`<div class="lead-row"><span>${i+1}. ${r.name}</span><span>${r.score}分 | ⏱️${r.timeStr}</span></div>`).join('');}
async function uploadScore(){let n=document.getElementById('playerName').value.trim(),p=document.getElementById('playerPwd').value.trim();if(!n||!p){showToast('名+密碼必填','#ff9800');return;}let e={name:n,score,timeMs:getElapsed(),timeStr:formatTime(getElapsed()),pwd:p};try{let r=await fetch(`https://kvdb.io/${BUCKET_ID}/${KEY}?t=${Date.now()}`);let d=[];if(r.ok){let t=await r.text();if(t)d=JSON.parse(t);}d=d.filter(x=>x.name.toLowerCase()!=n.toLowerCase());d.push(e);d.sort((a,b)=>b.score-a.score);await fetch(`https://kvdb.io/${BUCKET_ID}/${KEY}`,{method:'POST',body:JSON.stringify(d)});showToast('👑 上榜','#66bb6a');}catch(e){}loadLeaderboard();}
function openLeader(){document.getElementById('leadBox').style.display='flex';loadLeaderboard();}
function closeLeader(){document.getElementById('leadBox').style.display='none';}
function openMusic(){document.getElementById('musicBox').style.display='flex';}
function closeMusic(){document.getElementById('musicBox').style.display='none';}
update();
</script></body></html>
