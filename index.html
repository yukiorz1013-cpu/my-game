<!DOCTYPE html><html lang="zh-HK"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yuki恐龍數學王 記憶版</title><style>
body{margin:0;background:#0f0f23;display:flex;justify-content:center;font-family:sans-serif}
#game{width:100%;max-width:440px;background:linear-gradient(#fff8e1,#ffcc80);min-height:100vh;padding:14px;box-sizing:border-box;text-align:center}
.pet-box{background:white;border-radius:24px;padding:14px;margin:10px 0;position:relative}
.pet-img{width:210px;height:210px;object-fit:contain;display:block;margin:0 auto}
.star{position:absolute;top:10px;right:14px;font-weight:bold}
.prog-bg{background:#eee;border-radius:12px;height:24px;overflow:hidden;margin:12px 0}.prog-fill{height:100%;background:#66bb6a;display:flex;align-items:center;justify-content:center;color:white;font-weight:bold;transition:.5s}
.btn{width:100%;padding:16px;border:none;border-radius:14px;font-size:20px;font-weight:bold;margin:8px 0}.btn-go{background:#66bb6a;color:white}.btn-evo{background:gold;display:none}
@keyframes wobble{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}.ani-egg{animation:wobble .7s infinite}
#mathBox{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:9999}.math-card{background:white;width:90%;max-width:380px;border-radius:20px;padding:22px;text-align:center}
.math-card input{font-size:40px;width:160px;padding:12px;border:4px solid orange;border-radius:14px;text-align:center}
</style></head><body>
<div id="game">
<h2>🦖 Yuki恐龍數學王</h2>
<p id="lvInfo"></p>
<div class="pet-box">
<div class="star">⭐ x <span id="star">0</span></div>
<img id="petImg" class="pet-img ani-egg" src="./dino1.png.jpg">
<h3 id="petName"></h3><p id="petSay"></p>
<div class="prog-bg"><div id="progBar" class="prog-fill" style="width:0%">0/50</div></div>
<p>總答 <span id="solved">0</span> | 分 <span id="score">0</span></p>
</div>
<button class="btn btn-go" onclick="startQ()">▶️ 開始做題 (會讀題)</button>
<button class="btn btn-evo" id="evoBtn" onclick="doEvo()">⚡️ 進化下一關！</button>
<div style="margin-top:10px;font-size:13px;color:#666">
🔊有音效+廣東話讀題 🗣️<br>
<a href="#" onclick="clearAll()">清零重玩</a> | 已自動保存進度
</div>
</div>

<div id="mathBox"><div class="math-card">
<div id="mType" style="color:#999"></div>
<h1 id="mQ"></h1>
<input id="mAns" type="number" inputmode="numeric"><br><br>
<button class="btn" style="background:orange;color:white" onclick="checkAns()">確定</button>
<button class="btn" style="background:#eee" onclick="hideBox()">取消</button>
</div></div>

<script>
const pets=[
{img:"./dino1.png.jpg",name:"Lv.1 蛋 - 50內加法",total:50},
{img:"./dino2.png.jpg",name:"Lv.2 奶樽BB - 50內減法",total:50},
{img:"./dino3.png.WEBP",name:"Lv.3 橙色火焰龍 - 1-10乘法",total:100},
{img:"./dino4.png.jpg",name:"Lv.4 龍王 - 99內除法",total:100}
];
// 讀取進度
let petIdx=parseInt(localStorage.getItem('yuki_petIdx')||0);
let solvedLv=parseInt(localStorage.getItem('yuki_solvedLv')||0);
let total=parseInt(localStorage.getItem('yuki_total')||0);
let score=parseInt(localStorage.getItem('yuki_score')||0);
let stars=parseInt(localStorage.getItem('yuki_stars')||0);
let ans=0;
let ac;
function save(){localStorage.setItem('yuki_petIdx',petIdx);localStorage.setItem('yuki_solvedLv',solvedLv);localStorage.setItem('yuki_total',total);localStorage.setItem('yuki_score',score);localStorage.setItem('yuki_stars',stars);}
function beep(f,d){try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();let o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(0.25,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.01,ac.currentTime+d);o.start();o.stop(ac.currentTime+d);}catch(e){}}
function speak(t){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='zh-HK';u.rate=0.95;speechSynthesis.speak(u);}catch(e){}}
function update(){
let p=pets[petIdx];
document.getElementById('petImg').src=p.img;
document.getElementById('petName').innerText=p.name;
document.getElementById('lvInfo').innerText='第'+(petIdx+1)+'關 - 目標'+p.total+'題';
let pct=Math.floor(solvedLv/p.total*100);let bar=document.getElementById('progBar');bar.style.width=pct+'%';bar.innerText=solvedLv+'/'+p.total;
document.getElementById('solved').innerText=total;document.getElementById('score').innerText=score;document.getElementById('star').innerText=stars;
document.getElementById('evoBtn').style.display=solvedLv>=p.total?'block':'none';
document.getElementById('petSay').innerText=solvedLv>=p.total?'🎉完成！快啲進化！':'仲有 '+(p.total-solvedLv)+' 題進化！';
save();
}
function startQ(){
let a,b,qt,qs;
if(petIdx==0){a=Math.floor(Math.random()*26);b=Math.floor(Math.random()*(51-a));ans=a+b;qt=a+' + '+b+' = ?';qs=a+'加'+b+'等於幾多';}
else if(petIdx==1){a=Math.floor(Math.random()*50)+1;b=Math.floor(Math.random()*(a+1));ans=a-b;qt=a+' - '+b+' = ?';qs=a+'減'+b+'等於幾多';}
else if(petIdx==2){a=Math.floor(Math.random()*10)+1;b=Math.floor(Math.random()*10)+1;ans=a*b;qt=a+' × '+b+' = ?';qs=a+'乘'+b+'等於幾多';}
else{b=Math.floor(Math.random()*11)+2;ans=Math.floor(Math.random()*9)+1;a=b*ans;qt=a+' ÷ '+b+' = ?';qs=a+'除以'+b+'等於幾多';}
document.getElementById('mQ').innerText=qt;document.getElementById('mType').innerText='第'+(petIdx+1)+'關';
document.getElementById('mathBox').style.display='flex';document.getElementById('mAns').value='';
setTimeout(()=>{document.getElementById('mAns').focus();speak(qs);},200);
}
function hideBox(){document.getElementById('mathBox').style.display='none';}
function checkAns(){
let v=parseInt(document.getElementById('mAns').value);
if(v===ans){solvedLv++;total++;score+=10;beep(800,0.2);setTimeout(()=>beep(1200,0.2),120);if(total%10==0){stars++;beep(1500,0.4);alert('⭐ 儲到 '+stars+' 粒星！');}hideBox();update();}else{beep(200,0.4);alert('錯咗，係 '+ans);}}
function doEvo(){if(solvedLv>=pets[petIdx].total&&petIdx<3){petIdx++;solvedLv=0;update();beep(400,0.2);setTimeout(()=>beep(800,0.4),200);alert('💥 進化成功！');}else if(petIdx==3){alert('🏆 龍王畢業！');}}
function clearAll(){if(confirm('清零？')){localStorage.clear();location.reload();}}
update();
</script></body></html>
