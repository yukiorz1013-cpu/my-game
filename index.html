<!DOCTYPE html><html lang="zh-HK"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>數學霸恐龍王 V52 鋼琴</title>
<style>body{margin:0;background:#0f0f23;display:flex;justify-content:center;font-family:-apple-system,sans-serif}#game{width:100%;max-width:440px;background:linear-gradient(#fff8e1,#fce4ec);min-height:100vh;padding:14px;box-sizing:border-box;text-align:center;position:relative}.card{background:white;border-radius:22px;padding:14px;margin:10px 0}.pet-wrap{height:280px;display:flex;align-items:flex-end;justify-content:center}.pet-img{object-fit:contain;display:block;transition:width 0.6s cubic-bezier(0.34,1.56,0.64,1),height 0.6s cubic-bezier(0.34,1.56,0.64,1)}.stage-badge{display:inline-block;background:#fce4ec;color:#ad1457;border:2px solid #f48fb1;padding:6px 16px;border-radius:20px;font-size:13px;font-weight:bold;margin:8px 0}.btn{width:100%;padding:14px;border:none;border-radius:14px;font-size:18px;font-weight:bold;margin:5px 0;cursor:pointer}.btn-go{background:#66bb6a;color:white}.btn-leader{background:linear-gradient(135deg,#f48fb1,#ad1457);color:white}.btn-evo{background:gold;display:none}.timer{font-size:20px;font-weight:bold;color:#ad1457;background:#fce4ec;padding:6px 14px;border-radius:20px;display:inline-block;margin-top:6px}.prog-bg{background:#eee;border-radius:12px;height:22px;overflow:hidden;margin:10px 0;position:relative}.prog-fill{height:100%;background:linear-gradient(90deg,#f48fb1,#ad1457);transition:width 0.5s}.prog-text{position:absolute;width:100%;top:3px;font-weight:bold;font-size:12px;text-align:center}#mathBox,#leadBox,#musicBox{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:9999;padding:14px}.box{background:white;width:100%;max-width:380px;border-radius:24px;padding:20px;text-align:center;border:4px solid #f48fb1}.box input{font-size:18px;padding:10px;border:3px solid #f48fb1;border-radius:12px;width:85%;margin:5px 0;text-align:center;font-weight:bold}#toast{position:fixed;top:38%;left:50%;transform:translate(-50%,-50%);padding:14px 22px;border-radius:20px;font-size:18px;font-weight:bold;z-index:10001;display:none;color:white}.lead-row{display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #fce4ec;font-size:13px}.music-btn{position:absolute;top:10px;right:10px;background:white;border-radius:50%;width:40px;height:40px;border:none;font-size:20px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2)}.music-opt{padding:10px;margin:6px 0;border:2px solid #fce4ec;border-radius:12px;cursor:pointer;text-align:left}.music-opt.active{border-color:#f48fb1;background:#fce4ec}@keyframes pop{0%{transform:scale(1)}30%{transform:scale(1.35)}100%{transform:scale(1)}}</style></head><body>
<div id="game">
<button class="music-btn" onclick="openMusic()">🎵</button>
<h2>🦖 數學霸恐龍王</h2><div class="card">
<div class="pet-wrap"><img id="petImg" class="pet-img" src="./dino1.png.jpg"></div>
<h3 id="petName" style="margin:8px 0 0 0"></h3>
<div class="stage-badge" id="stageBadge">1/20段</div>
<br><div class="timer">⏱️ <span id="timer">00:00</span></div>
<div class="prog-bg"><div id="progBar" class="prog-fill"></div><div id="progText" class="prog-text"></div></div>
<p style="font-size:13px;margin:4px 0"><b id="solved">0</b>題 | <b id="score">0</b>分</p></div>
<button class="btn btn-go" onclick="startQ()">▶️ 開始做題</button><button class="btn btn-evo" id="evoBtn" onclick="doEvo()">⚡️ 20級滿！進化</button><button class="btn btn-leader" onclick="openLeader()">👑 霸主榜</button></div>
<div id="mathBox"><div class="box"><h1 id="mQ" style="font-size:36px"></h1><input id="mAns" type="tel"><br><br><button class="btn" style="background:#f48fb1;color:white" onclick="checkAns()">確定</button><button class="btn" style="background:#eee" onclick="hideMath()">取消</button></div></div>
<div id="leadBox"><div class="box"><h2>👑 霸主榜</h2><div id="leadList"></div><div style="margin-top:10px;border-top:3px dashed #f48fb1;padding-top:10px"><input id="playerName" placeholder="霸主名號"><input id="playerPwd" type="password" placeholder="4位密碼"><button class="btn" style="background:#66bb6a;color:white" onclick="uploadScore()">🔒 登榜</button><button class="btn" style="background:#eee" onclick="closeLeader()">關閉</button></div></div></div>
<div id="musicBox"><div class="box"><h2>🎵 背景音樂</h2>
<div class="music-opt active" onclick="setMusic('piano',this)">🎹 柔和鋼琴版 (新)</div>
<div class="music-opt" onclick="setMusic('orchestra',this)">🎺 管弦樂版</div>
<div class="music-opt" onclick="setMusic('crystal_slow',this)">🔮 水晶慢版</div>
<button class="btn" style="background:#eee;margin-top:10px" onclick="closeMusic()">完成</button>
</div></div>
<div id="toast"></div>
<script>
const BUCKET_ID="9xrLimS38pHRafoTWwqfSP",KEY="yuki_leaderboard";
const pets=[{img:"./dino1.png.jpg",name:"Lv.1 蛋蛋龍",total:20},{img:"./dino2.png.jpg",name:"Lv.2 BB龍",total:20},{img:"./dino3.png.WEBP",name:"Lv.3 火焰龍",total:20},{img:"./dino4.png.jpg",name:"Lv.4 霸王龍",total:20}];
let petIdx=0,solvedLv=0,total=0,score=0,ans=0,ac,startTime=0,timerInterval=null,bgmTimer=null;
let currentMusic='piano';
let saved=JSON.parse(localStorage.getItem('yuki_v52')||'{}'); if(saved.petIdx!=null){petIdx=saved.petIdx;solvedLv=saved.solvedLv;total=saved.total;score=saved.score;currentMusic=saved.currentMusic||'piano';}
function save(){localStorage.setItem('yuki_v52',JSON.stringify({petIdx,solvedLv,total,score,startTime,currentMusic}));}
function showToast(t,c){let e=document.getElementById('toast');e.innerText=t;e.style.background=c;e.style.display='block';setTimeout(()=>e.style.display='none',1800);}
function formatTime(ms){let s=Math.floor(ms/1000),m=Math.floor(s/60);s%=60;return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;}
function getElapsed(){return startTime==0?0:Date.now()-startTime;}
function update(){
  let p=pets[petIdx]; document.getElementById('petImg').src=p.img; document.getElementById('petName').innerText=p.name;
  let base=40,max=260; let size=base+(solvedLv/p.total)*(max-base);
  let img=document.getElementById('petImg'); img.style.width=size+'px'; img.style.height=size+'px';
  document.getElementById('stageBadge').innerText='✨ 長大 '+(solvedLv+1<=p.total?solvedLv+1:p.total)+'/20 段';
  if(solvedLv>=p.total) document.getElementById('stageBadge').innerText='🎉 20/20 滿級！可進化';
  let pct=Math.round(solvedLv/p.total*100); document.getElementById('progBar').style.width=pct+'%';
  document.getElementById('progText').innerText=solvedLv+'/20 段';
  document.getElementById('solved').innerText=total; document.getElementById('score').innerText=score;
  document.getElementById('evoBtn').style.display=solvedLv>=p.total?'block':'none';
  document.getElementById('timer').innerText=formatTime(getElapsed()); save();
}
function ensureAudio(){try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended')ac.resume();}catch(e){}}
// 真鋼琴音色：多諧波 + 快速attack + 長decay
function pianoNote(freq,dur=1.8,vol=0.28){
  try{
    ensureAudio(); let t0=ac.currentTime;
    let harmonics=[
      {mult:1, vol:1.0, decay:1.0},
      {mult:2, vol:0.45, decay:1.8},
      {mult:3, vol:0.22, decay:2.5},
      {mult:4, vol:0.12, decay:3.2},
      {mult:5.99, vol:0.06, decay:4.0}
    ];
    harmonics.forEach(h=>{
      let o=ac.createOscillator(), g=ac.createGain();
      o.type='sine'; o.frequency.value=freq*h.mult;
      // 鋼琴包絡：0.005秒attack，之後指數衰減
      g.gain.setValueAtTime(0,t0);
      g.gain.linearRampToValueAtTime(vol*h.vol,t0+0.006);
      g.gain.setValueAtTime(vol*h.vol,t0+0.08);
      g.gain.exponentialRampToValueAtTime(0.001,t0+dur*h.decay*0.6 + 0.5);
      o.connect(g); g.connect(ac.destination);
      o.start(t0); o.stop(t0+dur*1.2);
    });
  }catch(e){}
}
function playPiano(){
  if(bgmTimer) clearInterval(bgmTimer);
  // 寶可夢綠旋律鋼琴版，快返少少
  let melody=[659.25,783.99,1046.5,783.99,659.25,783.99,1046.5,1174.66,1318.51,1174.66,1046.5,783.99,659.25,783.99,1046.5,880,783.99,1046.5,1174.66,1318.51,1568.0,1318.51,1046.5];
  let i=0; pianoNote(melody[0],2.0,0.30);
  bgmTimer=setInterval(()=>{pianoNote(melody[i%melody.length],1.8,0.26); i++;},1100);
}
function playOrchestra(){
  if(bgmTimer) clearInterval(bgmTimer);
  let melody=[659.25,783.99,1046.5,783.99]; let i=0;
  bgmTimer=setInterval(()=>{try{ensureAudio(); let o=ac.createOscillator(),g=ac.createGain(); o.type='sawtooth'; o.frequency.value=melody[i%melody.length]*0.5; g.gain.setValueAtTime(0.08,ac.currentTime); g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+1.0); o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime+1.0);}catch(e){} i++;},900);
}
function playCrystalSlow(){if(bgmTimer) clearInterval(bgmTimer); let m=[659.25,783.99,1046.5]; let i=0; bgmTimer=setInterval(()=>{pianoNote(m[i%m.length],2.5,0.20); i++;},2200);}
function playCurrent(){if(currentMusic==='piano') playPiano(); else if(currentMusic==='orchestra') playOrchestra(); else playCrystalSlow();}
function setMusic(url,el){currentMusic=url; document.querySelectorAll('.music-opt').forEach(o=>o.classList.remove('active')); if(el) el.classList.add('active'); save(); if(startTime!=0) playCurrent(); closeMusic();}
function startQ(){ensureAudio(); if(startTime==0){startTime=Date.now(); timerInterval=setInterval(()=>document.getElementById('timer').innerText=formatTime(getElapsed()),1000);} playCurrent(); let a,b,q;if(petIdx==0){a=Math.floor(Math.random()*26);b=Math.floor(Math.random()*(51-a));ans=a+b;q=a+' + '+b+' = ?';}else if(petIdx==1){a=Math.floor(Math.random()*50)+1;b=Math.floor(Math.random()*(a+1));ans=a-b;q=a+' - '+b+' = ?';}else if(petIdx==2){a=Math.floor(Math.random()*9)+1;b=Math.floor(Math.random()*9)+1;ans=a*b;q=a+' × '+b+' = ?';}else{b=Math.floor(Math.random()*9)+2;ans=Math.floor(Math.random()*9)+1;a=b*ans;q=a+' ÷ '+b+' = ?';}document.getElementById('mQ').innerText=q;document.getElementById('mathBox').style.display='flex';document.getElementById('mAns').value='';}
function hideMath(){document.getElementById('mathBox').style.display='none';}
function checkAns(){
  let v=parseInt(document.getElementById('mAns').value);
  if(v===ans){solvedLv++;total++;score+=10; pianoNote(1318.51,0.8,0.35); setTimeout(()=>pianoNote(1568,1.0,0.35),180); let img=document.getElementById('petImg'); img.style.animation='pop 0.4s'; setTimeout(()=>img.style.animation='',400); hideMath();update();}else{pianoNote(196,0.6,0.25); showToast('❌ 再諗下','#ff5252');document.getElementById('mAns').value='';}
}
function doEvo(){if(solvedLv>=pets[petIdx].total&&petIdx<3){petIdx++;solvedLv=0;update(); showToast('⚡️ 進化！由細BB重新長大','#ff9800');}else openLeader();}
async function loadLeaderboard(){let el=document.getElementById('leadList');el.innerHTML='⏳...';let c=[];try{let r=await fetch(`https://kvdb.io/${BUCKET_ID}/${KEY}?t=${Date.now()}`,{cache:'no-store'});if(r.ok){let t=await r.text();if(t)c=c.concat(JSON.parse(t));}}catch(e){}if(!c.length){el.innerHTML='未有霸主';return;}let m={};c.forEach(x=>{let k=x.name.toLowerCase();if(!m[k]||x.score>m[k].score)m[k]=x;});let u=Object.values(m).sort((a,b)=>b.score-a.score).slice(0,20);el.innerHTML=u.map((r,i)=>`<div class="lead-row"><span>${i+1}. ${r.name}</span><span>${r.score}分 | ⏱️${r.timeStr}</span></div>`).join('');}
async function uploadScore(){let n=document.getElementById('playerName').value.trim(),p=document.getElementById('playerPwd').value.trim();if(!n||!p){showToast('名+密碼必填','#ff9800');return;}let e={name:n,score,timeMs:getElapsed(),timeStr:formatTime(getElapsed()),pwd:p};try{let r=await fetch(`https://kvdb.io/${BUCKET_ID}/${KEY}?t=${Date.now()}`);let d=[];if(r.ok){let t=await r.text();if(t)d=JSON.parse(t);}d=d.filter(x=>x.name.toLowerCase()!=n.toLowerCase());d.push(e);d.sort((a,b)=>b.score-a.score);await fetch(`https://kvdb.io/${BUCKET_ID}/${KEY}`,{method:'POST',body:JSON.stringify(d)});showToast('👑 上榜','#66bb6a');}catch(e){}loadLeaderboard();}
function openLeader(){document.getElementById('leadBox').style.display='flex';loadLeaderboard();}
function closeLeader(){document.getElementById('leadBox').style.display='none';}
function openMusic(){document.getElementById('musicBox').style.display='flex';}
function closeMusic(){document.getElementById('musicBox').style.display='none';}
update();
</script></body></html>
