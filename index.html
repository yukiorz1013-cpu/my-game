<!DOCTYPE html><html lang="zh-HK"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>V170 100寵正式版</title>
<style>
*{touch-action:none;user-select:none;box-sizing:border-box}
body{margin:0;background:#000;display:flex;justify-content:center;font-family:-apple-system,sans-serif}
#game{width:100%;max-width:430px;height:100vh;height:100dvh;background:#e6c87a;position:relative;overflow:hidden;display:flex;flex-direction:column}
#top{height:48px;background:linear-gradient(#1a2a4a,#0e0e1a);border-bottom:2px solid #ffb300;display:flex;justify-content:space-between;align-items:center;padding:0 8px;color:#ffd54f;font-weight:900;font-size:10px}
#mapWrap{flex:1;position:relative;overflow:hidden;background:#e6c87a}
#map{position:absolute;left:0;top:0;width:4800px;height:4800px;background:#e6c87a}
.tile{position:absolute;width:42px;height:42px;margin:-1px;background-color:#e6c87a;background-image:url('./tileset.png');background-size:420px 336px;image-rendering:pixelated}
.desert{background-position:0px 0px}.grass{background-position:-180px 0px}.water{background-position:-300px 0px}.wall{background-position:-260px -80px}
.house1{background-position:-60px -150px}.house2{background-position:-120px -150px}.market{background-position:-60px -235px}.well{background-position:-190px -235px}
.town{border:3px solid #ffb300;z-index:2}.shop{border:3px solid #ff6f00;z-index:2}
#player{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;background:#fff;border:3px solid #ffb300;border-radius:50%;z-index:20;display:flex;align-items:center;justify-content:center;font-size:24px}
#msg{position:absolute;left:6px;right:6px;bottom:88px;background:rgba(0,0,0,.88);border-left:4px solid #ffb300;color:#fff;border-radius:8px;padding:6px 10px;font-size:11px;font-weight:700;z-index:10}
#controls{position:absolute;left:0;right:0;bottom:0;height:84px;background:linear-gradient(rgba(0,0,0,.92),#000);border-top:2px solid #ffb300;display:flex;justify-content:space-between;align-items:center;padding:0 8px 6px 8px;z-index:20;padding-bottom:max(6px,env(safe-area-inset-bottom))}
#joy{width:72px;height:72px;background:rgba(255,255,255,.18);border:2px solid #ffb300;border-radius:50%;position:relative}#knob{position:absolute;left:50%;top:50%;width:34px;height:34px;background:#fff;border-radius:50%;transform:translate(-50%,-50%);border:2px solid #000}
#skills{display:flex;gap:4px}.sbtn{width:50px;height:50px;border-radius:10px;border:2px solid #ffb300;background:#222;color:#ffd54f;font-weight:900;font-size:7px}.sbtn.seal{background:#e91e63;color:#fff}
#battle{position:absolute;inset:0;background:radial-gradient(#1e3a5f,#0a0a14);z-index:30;display:none;flex-direction:column;color:#fff}
#pop{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:100;padding:12px}.box{background:linear-gradient(#fff8e0,#ffe0b2);border:3px solid #ffb300;border-radius:18px;padding:12px;width:100%;max-width:380px;color:#3e2723;text-align:center}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}} .bob{animation:bob 0.7s infinite}
.petImg{width:140px;height:140px;object-fit:contain;image-rendering:pixelated}
</style></head><body>
<div id="game"><div id="top"><span>📖100寵圖鑑</span><span>💰<span id="gold">200</span> 🎀<span id="balls">30</span> <span id="cnt">0/100</span></span></div><div id="mapWrap"><div id="map"></div><div id="player">🧑‍🌾</div><div id="msg">V170 100寵正式版！已讀取你上傳嗰兩張圖！</div><div id="controls"><div id="joy"><div id="knob"></div></div><div id="skills"><button class="sbtn" onclick="doAtk()">🏹攻擊</button><button class="sbtn" onclick="doAtk()">💥乾坤</button><button class="sbtn" onclick="openShop()">🏪商店</button><button class="sbtn" onclick="openDex()">📖100寵</button><button class="sbtn seal" onclick="trySeal()">🎀封印</button></div></div></div><div id="battle"><div style="height:44px;background:#111;border-bottom:2px solid #ffb300;display:flex;justify-content:space-between;align-items:center;padding:0 10px;color:#ffd54f;font-weight:900"><span>⚔️ <span id="ename">九尾狐</span> <span id="ehpT">100%</span></span><button onclick="closeB()" style="background:#222;color:#ffd54f;border:1px solid #ffb300;border-radius:6px;padding:4px 8px">逃</button></div><div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center"><div id="eBox" class="bob" style="width:150px;height:150px;background:#fff;border:3px solid #ffb300;border-radius:20px;display:flex;align-items:center;justify-content:center;overflow:hidden"><img id="eImg" src="" class="petImg"></div><div id="bmsg" style="margin-top:10px;background:rgba(0,0,0,.7);padding:6px 12px;border-radius:8px;font-size:11px">No.051 九尾狐</div><div style="display:flex;gap:8px;width:92%;margin-top:10px"><button class="sbtn" style="flex:1;height:44px" onclick="doAtk()">攻擊</button><button class="sbtn seal" style="flex:1;height:44px" onclick="trySeal()">封印</button></div></div></div><div id="pop"><div class="box" id="popBox"></div></div></div>
<img id="sheetA" src="./6f624645-2a9f-f819-cf87-700a2f37e77b.jpeg" style="display:none"><img id="sheetB" src="./41309d37-8713-e0a3-4015-0e51f44b1f6d.jpeg" style="display:none">
<canvas id="cut" width="100" height="100" style="display:none"></canvas>
<script>
const namesA=["虎紋貓","黑魔貓","妖狐","白兔","棕熊","飛龍","史萊姆","幽靈","蝙蝠","蜘蛛","螳螂","石怪","哥布林","黃蜂","水蜥","灰狼","熊貓","企鵝","倉鼠","貓頭鷹","浣熊","松鼠","烏龜","青蛙","紫蛇","刺蝟","小羊","小牛","小豬","小猴","大象","鱷魚","蠍子","蝸牛","蝴蝶","甲蟲","梅花鹿","山羊","烏鴉","鳳凰","小馬","雪怪","蘑菇","水晶","羅剎","木乃伊","南瓜","鯊魚","海豹","六角龍"];
const namesB=["九尾狐","白虎","黑貓魔","獅子王","熊貓魔","仙人掌","熔岩","水晶","雷龍","天使","紫惡魔","蘑菇人","樹精","沙魔","機械人","風妖","人魚","火鬼","毛熊","毒蛙","幽靈貓","骷髏","吸血蝠","狼人","牛頭","半人馬","獅鷲","獨角獸","天馬","雞蛇","青蛇","獅蛇","雙頭蛇","比蒙","海龍","章魚","雪怪王","骷髏王","喪屍","巫妖","女妖","魅魔","天使","墮天使","聖騎","邪眼","寶箱","骰子","卡牌"];
let allNames=[...namesA,...namesB];
let pets=[];for(let i=0;i<100;i++){pets.push({id:i+1,name:allNames[i]||"寵"+(i+1),top:100+Math.floor(Math.random()*15),attr:["地3風7","水7火3","火3水7","地5風5"][i%4]})}
let px=60,py=60,gold=200,balls=30,dex=new Array(100).fill(false),emy=50,emyHp=100,battle=false,ans=0,input="",mapSize=120;
let map=[];for(let y=0;y<mapSize;y++){map[y]=[];for(let x=0;x<mapSize;x++){
if(x==60&&y==60)map[y][x]=10;else if(x==62&&y==60)map[y][x]=11;else if(x==65&&y==60)map[y][x]=13;else if(x==60&&y==65)map[y][x]=14;
else if(x%15==0&&y%15==0)map[y][x]=5;else if(x%12==1&&y%12==1)map[y][x]=6;else{let r=Math.random();if(r<0.06)map[y][x]=3;else if(r<0.14)map[y][x]=2;else if(r<0.20)map[y][x]=1;else map[y][x]=0;}
}}
const mapEl=document.getElementById('map');
function build(){mapEl.innerHTML='';for(let y=0;y<mapSize;y++)for(let x=0;x<mapSize;x++){let d=document.createElement('div');d.className='tile';let t=map[y][x];
if(t==0)d.classList.add('desert');if(t==1)d.classList.add('cactus');if(t==2)d.classList.add('grass');if(t==3)d.classList.add('water');if(t==4)d.classList.add('wall');
if(t==10){d.classList.add('house1');d.classList.add('town');}if(t==11){d.classList.add('house2');d.classList.add('shop');}if(t==13){d.classList.add('market');d.classList.add('shop');}if(t==14){d.classList.add('well');d.classList.add('town');}
d.style.left=x*40+'px';d.style.top=y*40+'px';mapEl.appendChild(d);}updateCam();}
function updateCam(){let w=document.getElementById('mapWrap');let W=w.clientWidth||430,H=w.clientHeight||600;mapEl.style.left=(W/2-px*40-20)+'px';mapEl.style.top=(H/2-py*40-20)+'px';}
function updateUI(){document.getElementById('gold').innerText=gold;document.getElementById('balls').innerText=balls;document.getElementById('cnt').innerText=dex.filter(x=>x).length+'/100';}
function move(dx,dy){if(battle)return;let nx=px+dx,ny=py+dy;if(nx<0||nx>=mapSize||ny<0||ny>=mapSize)return;if(map[ny][nx]==3)return;px=nx;py=ny;updateCam();if(Math.random()<0.32)startB();}
function getPetImgData(idx){
  let sheet,col,row; if(idx<50){ sheet=document.getElementById('sheetA'); }else{ sheet=document.getElementById('sheetB'); idx-=50; }
  col=idx%10; row=Math.floor(idx/10);
  let canvas=document.getElementById('cut'); let ctx=canvas.getContext('2d');
  canvas.width=100; canvas.height=100; ctx.clearRect(0,0,100,100);
  try{ ctx.drawImage(sheet, col*sheet.width/10, row*sheet.height/5, sheet.width/10, sheet.height/5, 0,0,100,100); }catch(e){}
  return canvas.toDataURL();
}
function startB(){emy=Math.floor(Math.random()*100);let p=pets[emy];emyHp=100;battle=true;document.getElementById('battle').style.display='flex';
document.getElementById('ename').innerText=p.name;document.getElementById('ehpT').innerText=emyHp+'%';
document.getElementById('bmsg').innerText=`No.${String(p.id).padStart(3,'0')} ${p.name} ${p.attr} 頂${p.top}`;
let img=document.getElementById('eImg'); try{ img.src=getPetImgData(emy); }catch(e){}
}
function closeB(){document.getElementById('battle').style.display='none';battle=false;}
function doAtk(){let a=Math.floor(Math.random()*12)+2,b=Math.floor(Math.random()*12)+2;ans=a+b;pop(`<h3>攻擊 ${pets[emy].name}</h3><h1>${a}+${b}=?</h1><div id=ab style="font-size:36px;border:2px solid #000;border-radius:10px;padding:6px">?</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px"><button onclick="addN('1')">1</button><button onclick="addN('2')">2</button><button onclick="addN('3')">3</button><button onclick="addN('4')">4</button><button onclick="addN('5')">5</button><button onclick="addN('6')">6</button><button onclick="addN('7')">7</button><button onclick="addN('8')">8</button><button onclick="addN('9')">9</button><button onclick="clrN()">⌫</button><button onclick="addN('0')">0</button><button style="background:#ffb300" onclick="chk(false)">OK</button></div>`);input="";}
function trySeal(){if(balls<=0){pop('<h3>無卡</h3>');return;}if(emyHp>60){document.getElementById('bmsg').innerText='仲有'+emyHp+'%血！打到60%以下！';return;}let a=Math.floor(Math.random()*10)+1,b=Math.floor(Math.random()*10)+1;ans=a+b;pop(`<h3>🎀 封印 ${pets[emy].name}</h3><h1>${a}+${b}=?</h1><div id=ab style="font-size:36px;border:2px solid #000;border-radius:10px;padding:6px">?</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px"><button onclick="addN('1')">1</button><button onclick="addN('2')">2</button><button onclick="addN('3')">3</button><button onclick="addN('4')">4</button><button onclick="addN('5')">5</button><button onclick="addN('6')">6</button><button onclick="addN('7')">7</button><button onclick="addN('8')">8</button><button onclick="addN('9')">9</button><button onclick="clrN()">⌫</button><button onclick="addN('0')">0</button><button style="background:#e91e63;color:white" onclick="chk(true)">封印</button></div>`);input="";}
function addN(n){input+=n;document.getElementById('ab').innerText=input;}function clrN(){input=input.slice(0,-1);document.getElementById('ab').innerText=input||'?';}
function chk(isSeal){let v=parseInt(input);if(isNaN(v))return;closePop();if(v===ans){if(isSeal){balls--;if(Math.random()<0.85){dex[emy]=true;gold+=30;msg('🎉捉到 '+pets[emy].name+'！圖鑑+1');closeB();}else msg('走甩咗！')}else{emyHp=Math.max(0,emyHp-35);document.getElementById('ehpT').innerText=emyHp+'%';if(emyHp<=0)document.getElementById('bmsg').innerText='倒下！快封印！';}updateUI();}else msg('答錯 正解'+ans);}
function msg(t){document.getElementById('msg').innerText=t;}
function pop(h){document.getElementById('popBox').innerHTML=h;document.getElementById('pop').style.display='flex';}function closePop(){document.getElementById('pop').style.display='none';}
function openShop(){pop(`<h3>🏪商店</h3><button onclick="if(gold>=20){gold-=20;balls++;updateUI();closePop();}" style="width:100%;padding:10px;background:#ffb300;border-radius:10px">買封印卡 20金</button><button onclick="closePop()" style="width:100%;margin-top:6px">關</button>`);}
function openDex(){let h='<h3>📖100寵圖鑑 '+dex.filter(x=>x).length+'/100</h3><div style="max-height:350px;overflow:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px">';pets.forEach((p,i)=>{let img="";try{img=getPetImgData(i);}catch(e){} h+=`<div style="border:2px solid ${dex[i]?'#ffb300':'#aaa'};border-radius:8px;padding:2px;background:${dex[i]?'#fff8e0':'#eee'};text-align:center"><img src="${img}" style="width:46px;height:46px;object-fit:contain"><div style="font-size:7px;font-weight:900;white-space:nowrap;overflow:hidden">${String(p.id).padStart(3,'0')} ${p.name} ${dex[i]?'✅':''}</div></div>`});h+='</div><button onclick="closePop()" style="margin-top:8px">關閉</button>';pop(h);}
let joy=document.getElementById('joy'),knob=document.getElementById('knob'),drag=false,last=0;
joy.addEventListener('touchstart',e=>{drag=true;e.preventDefault();});
window.addEventListener('touchend',()=>{drag=false;knob.style.transform='translate(-50%,-50%)';});
window.addEventListener('touchmove',e=>{if(!drag||battle)return;let r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,x=e.touches[0].clientX-cx,y=e.touches[0].clientY-cy,d=Math.min(Math.sqrt(x*x+y*y),32),a=Math.atan2(y,x),nx=Math.cos(a)*d,ny=Math.sin(a)*d;knob.style.transform=`translate(calc(-50% + ${nx}px), calc(-50% + ${ny}px))`;let now=Date.now();if(now-last<80)return;last=now;let dx=Math.abs(nx)>14?(nx>0?1:-1):0,dy=Math.abs(ny)>14?(ny>0?1:-1):0;if(dx||dy)move(dx,dy);},{passive:false});
window.addEventListener('resize',updateCam);build();updateUI();
</script></body></html>
