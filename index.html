<!DOCTYPE html><html lang="zh-HK"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>V150 美化無限版</title>
<style>
*{touch-action:none;user-select:none;box-sizing:border-box}
body{margin:0;background:#000;display:flex;justify-content:center;font-family:-apple-system,sans-serif}
#game{width:100%;max-width:430px;height:100vh;background:#1a1a2e;position:relative;overflow:hidden;display:flex;flex-direction:column}
#top{height:46px;background:#111;color:#ffd54f;display:flex;justify-content:space-between;align-items:center;padding:0 10px;font-weight:900;font-size:11px;border-bottom:2px solid #ffb300}
#mapWrap{flex:1;position:relative;overflow:hidden;background:#a3d977}
#map{position:absolute;left:0;top:0;width:4800px;height:4800px}
.tile{position:absolute;width:40px;height:40px;border:1px solid rgba(0,0,0,.06);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900}
.path{background:#f1e2b8}.grass{background:#8bc34a}.grass::after{content:'';position:absolute;width:10px;height:10px;background:#7cb342;border-radius:50%;top:8px;left:8px}.bush{background:#3d7a1a}.bush::after{content:'🌳';font-size:20px}.water{background:#7ec8e3}.water::after{content:'💧'}.town{background:#ffcf4d;border:2px solid #ff6f00}.shop{background:#ff8a65;border:2px solid #bf360c}
#player{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;background:white;border:3px solid #ffb300;border-radius:50%;z-index:20;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 0 0 3px #000,0 0 12px #ffb300}
#msg{position:absolute;bottom:118px;left:8px;right:8px;background:rgba(0,0,0,.86);border-left:4px solid #ffb300;color:white;border-radius:8px;padding:7px 10px;font-size:11px;font-weight:700;z-index:10}
#joy{position:absolute;left:12px;bottom:12px;width:110px;height:110px;background:rgba(255,255,255,.18);border:2px solid #ffb300;border-radius:50%;z-index:15}#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;background:white;border:2px solid #000;border-radius:50%;transform:translate(-50%,-50%)}
#skills{position:absolute;right:8px;bottom:10px;display:grid;grid-template-columns:repeat(3,60px);gap:6px;z-index:15}
.sbtn{width:60px;height:60px;border-radius:12px;border:2px solid #ffb300;background:#222;color:#ffd54f;font-weight:900;font-size:9px}
.sbtn.seal{background:#e91e63;color:white}
#battle{position:absolute;inset:0;background:#0a0a14;z-index:30;display:none;flex-direction:column;color:white}
#pop{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:100;padding:12px}
.box{background:linear-gradient(#fff8e0,#ffe0b2);border:3px solid #ffb300;border-radius:20px;padding:14px;width:100%;max-width:340px;color:#222;text-align:center}
</style></head><body>
<div id="game">
<div id="top"><span>Lv<span id="lv">1</span> <span id="pname">蛋蛋</span></span><span>💰<span id="gold">120</span> 🎀<span id="balls">14</span> 圖鑑<span id="dexC">2/4</span> 步<span id="steps">0</span></span></div>
<div id="mapWrap"><div id="map"></div><div id="player">🧑‍🌾</div><div id="msg">V150 美化無限版：用返V148成功嗰個DOM畫法，唔用Canvas，一定見到地圖！無限草原！真恐龍圖！黃🏠法蘭城 橙🏪道具屋 深綠叢林直接封印！</div><div id="joy"><div id="knob"></div></div><div id="skills"><button class="sbtn" onclick="doAtk()">🏹亂射</button><button class="sbtn" onclick="doAtk()">💥乾坤</button><button class="sbtn" onclick="openShop()">🏪商店</button><button class="sbtn" onclick="openDex()">📖圖鑑</button><button class="sbtn seal" onclick="trySeal()">🎀封印</button><button class="sbtn" onclick="msg('家族獸暫未開放')">👨‍👩‍👧家族</button></div></div>
<div id="battle"><div style="height:46px;background:#111;border-bottom:2px solid #ffb300;display:flex;justify-content:space-between;align-items:center;padding:0 10px"><span>⚔️ <span id="ename">水龍蜥</span> <span id="ehpT">65%</span></span><button onclick="closeB()">✕逃走</button></div><div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center"><div style="width:130px;height:130px;background:white;border:3px solid #ffb300;border-radius:18px;display:flex;align-items:center;justify-content:center;overflow:hidden"><img id="eImg" style="width:110px;height:110px;object-fit:contain"></div><div id="bmsg" style="margin-top:10px;background:rgba(0,0,0,.7);padding:8px 12px;border-radius:8px;font-size:12px;font-weight:700">打中 -35% 正解15</div><button class="sbtn" style="width:90%;height:48px;margin-top:12px" onclick="doAtk()">🏹 亂射加法</button><button class="sbtn seal" style="width:90%;height:48px;margin-top:6px" onclick="trySeal()">🎀 封印</button></div></div>
<div id="pop"><div class="box" id="popBox"></div></div>
</div>
<script>
const imgs=["./dino1.png.jpg","./dino2.png.jpg","./dino3.png.WEBP","./dino4.png.jpg"];
const pets=[{name:"蛋蛋龍",img:imgs[0]},{name:"黃蜂",img:imgs[1]},{name:"水龍蜥",img:imgs[2]},{name:"哥布林",img:imgs[3]}];
let px=60,py=60,gold=120,balls=14,dex=[true,true,false,false],steps=0,lv=1,exp=20,emy=2,emyHp=65,battle=false,ans=0,input="";
let mapSize=120;let map=[];for(let y=0;y<mapSize;y++){map[y]=[];for(let x=0;x<mapSize;x++){if(x==60&&y==60)map[y][x]=4;else if(x==55&&y==55)map[y][x]=4;else if(x==65&&y==65)map[y][x]=5;else{let r=Math.random();if(r<0.04)map[y][x]=3;else if(r<0.15)map[y][x]=1;else if(r<0.19)map[y][x]=2;else map[y][x]=0;}}}
const mapEl=document.getElementById('map');
function build(){mapEl.innerHTML='';for(let y=0;y<mapSize;y++)for(let x=0;x<mapSize;x++){let d=document.createElement('div');d.className='tile';let t=map[y][x];if(t==0)d.classList.add('path');if(t==1)d.classList.add('grass');if(t==2)d.classList.add('bush');if(t==3)d.classList.add('water');if(t==4){d.classList.add('town');d.innerText='🏠';}if(t==5){d.classList.add('shop');d.innerText='🏪';}d.style.left=x*40+'px';d.style.top=y*40+'px';mapEl.appendChild(d);}updateCam();updateUI();}
function updateCam(){let wrap=document.getElementById('mapWrap');let W=wrap.clientWidth||430,H=wrap.clientHeight||600;mapEl.style.left=(W/2-px*40-20)+'px';mapEl.style.top=(H/2-py*40-20)+'px';}
function updateUI(){document.getElementById('gold').innerText=gold;document.getElementById('balls').innerText=balls;document.getElementById('dexC').innerText=dex.filter(Boolean).length+'/4';document.getElementById('steps').innerText=steps;document.getElementById('lv').innerText=lv;document.getElementById('pname').innerText=pets[0].name;}
function move(dx,dy){if(battle)return;let nx=px+dx,ny=py+dy;if(nx<0||nx>=mapSize||ny<0||ny>=mapSize)return;if(map[ny][nx]==3)return;px=nx;py=ny;steps++;updateCam();updateUI();let t=map[ny][nx];if(t==4)msg('🏠 法蘭城東門！補血！');if(t==5)openShop();if(t==1||t==2)if(Math.random()<0.18)startB();else msg(`探索中… 步數${steps}`);}
function msg(t){document.getElementById('msg').innerText=t;}
function startB(){emy=Math.floor(Math.random()*4);emyHp=65;battle=true;document.getElementById('battle').style.display='flex';document.getElementById('ename').innerText=pets[emy].name;document.getElementById('eImg').src=pets[emy].img;document.getElementById('eImg').onerror=function(){this.src=imgs[0];};document.getElementById('ehpT').innerText=emyHp+'%';document.getElementById('bmsg').innerText='野生'+pets[emy].name+'！';}
function closeB(){document.getElementById('battle').style.display='none';battle=false;}
function doAtk(){let a=Math.floor(Math.random()*12)+2,b=Math.floor(Math.random()*12)+2;ans=a+b;pop(`<h3>🏹 亂射！加法</h3><h1 style="font-size:32px">${a}+${b}=?</h1><div id=ansBox style="font-size:36px;border:2px solid #000;border-radius:10px;padding:6px">?</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px"><button onclick="addN('1')">1</button><button onclick="addN('2')">2</button><button onclick="addN('3')">3</button><button onclick="addN('4')">4</button><button onclick="addN('5')">5</button><button onclick="addN('6')">6</button><button onclick="addN('7')">7</button><button onclick="addN('8')">8</button><button onclick="addN('9')">9</button><button onclick="clrN()">⌫</button><button onclick="addN('0')">0</button><button style="background:#ff9800;color:white" onclick="chk(false)">OK</button></div>`);input="";}
function trySeal(){if(balls<=0){pop(`<h3>無卡</h3><button onclick="openShop()">去商店</button>`);return;}if(emyHp>60){document.getElementById('bmsg').innerText='仲有'+emyHp+'%血！打到60%以下！';return;}let a=Math.floor(Math.random()*10)+1,b=Math.floor(Math.random()*10)+1;ans=a+b;pop(`<h3>🎀 封印！加法</h3><h1 style="font-size:32px">${a}+${b}=?</h1><div id=ansBox style="font-size:36px;border:2px solid #000;border-radius:10px;padding:6px">?</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px"><button onclick="addN('1')">1</button><button onclick="addN('2')">2</button><button onclick="addN('3')">3</button><button onclick="addN('4')">4</button><button onclick="addN('5')">5</button><button onclick="addN('6')">6</button><button onclick="addN('7')">7</button><button onclick="addN('8')">8</button><button onclick="addN('9')">9</button><button onclick="clrN()">⌫</button><button onclick="addN('0')">0</button><button style="background:#e91e63;color:white" onclick="chk(true)">封印</button></div>`);input="";}
function addN(n){input+=n;document.getElementById('ansBox').innerText=input;}
function clrN(){input=input.slice(0,-1);document.getElementById('ansBox').innerText=input||'?';}
function chk(isSeal){let v=parseInt(input);if(isNaN(v))return;closePop();if(v===ans){if(isSeal){balls--;if(Math.random()<0.85){dex[emy]=true;gold+=20;msg('🎉捉到'+pets[emy].name+'！+20金！');closeB();}else msg('走甩咗！');}else{emyHp=Math.max(0,emyHp-35);document.getElementById('ehpT').innerText=emyHp+'%';document.getElementById('bmsg').innerText='打中-35%！正解'+ans;if(emyHp<=0)document.getElementById('bmsg').innerText='倒下！快封印！';}updateUI();}else msg('答錯！正解'+ans);}
function pop(h){document.getElementById('popBox').innerHTML=h;document.getElementById('pop').style.display='flex';}
function closePop(){document.getElementById('pop').style.display='none';}
function openShop(){pop(`<h3>🏪道具屋</h3><p>🎀封印卡 20金 💰${gold} 🎀${balls}</p><button onclick="if(gold>=20){gold-=20;balls++;updateUI();closePop();msg('買到！');}else msg('金幣唔夠')" style="width:100%;padding:10px;background:#ffb300;border-radius:10px;font-weight:900">買1張</button><button onclick="closePop()" style="width:100%;padding:8px;margin-top:6px">關閉</button>`);}
function openDex(){let h='<h3>圖鑑</h3>';pets.forEach((p,i)=>{h+=`<div style="display:flex;gap:8px;align-items:center;border:2px solid ${dex[i]?'#ffb300':'#aaa'};border-radius:8px;padding:4px;margin:4px 0"><img src="${p.img}" style="width:40px;height:40px;object-fit:contain"><span>${p.name} ${dex[i]?'已捉':'未見'}</span></div>`});h+=`<button onclick="closePop()">關閉</button>`;pop(h);}
let joy=document.getElementById('joy'),knob=document.getElementById('knob'),drag=false,last=0;
joy.addEventListener('touchstart',e=>{drag=true;e.preventDefault();});
window.addEventListener('touchend',()=>{drag=false;knob.style.transform='translate(-50%,-50%)';});
window.addEventListener('touchmove',e=>{if(!drag||battle)return;let r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,x=e.touches[0].clientX-cx,y=e.touches[0].clientY-cy,d=Math.min(Math.sqrt(x*x+y*y),42),a=Math.atan2(y,x),nx=Math.cos(a)*d,ny=Math.sin(a)*d;knob.style.transform=`translate(calc(-50% + ${nx}px), calc(-50% + ${ny}px))`;let now=Date.now();if(now-last<85)return;last=now;let dx=Math.abs(nx)>16?(nx>0?1:-1):0,dy=Math.abs(ny)>16?(ny>0?1:-1):0;if(dx||dy)move(dx,dy);},{passive:false});
window.addEventListener('load',()=>{build();setTimeout(build,200);});
build();
</script></body></html>
