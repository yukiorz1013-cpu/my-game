<!DOCTYPE html><html lang="zh-HK"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>V148 終極修復</title>
<style>
*{touch-action:none;user-select:none;box-sizing:border-box}
body{margin:0;background:#000;display:flex;justify-content:center;font-family:-apple-system,sans-serif}
#game{width:100%;max-width:430px;height:100vh;background:#111;position:relative;overflow:hidden;display:flex;flex-direction:column}
#top{height:44px;background:#1a1a1a;color:#ffd54f;display:flex;justify-content:space-between;align-items:center;padding:0 8px;font-weight:900;font-size:11px;border-bottom:2px solid #ffd54f}
#mapWrap{flex:1;position:relative;background:#7bb86f;overflow:hidden}
#mapCanvas{position:absolute;left:0;top:0;width:100%;height:100%;}
#player{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;background:white;border:3px solid #ffd54f;border-radius:50%;z-index:10;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 0 0 3px black}
#msg{position:absolute;bottom:120px;left:8px;right:8px;background:rgba(0,0,0,.85);color:white;border:1px solid #ffd54f;border-radius:8px;padding:6px;font-size:11px;z-index:5}
#joy{position:absolute;left:12px;bottom:12px;width:110px;height:110px;background:rgba(255,255,255,.2);border:2px solid #ffd54f;border-radius:50%;z-index:20}
#knob{position:absolute;left:50%;top:50%;width:50px;height:50px;background:white;border:2px solid #000;border-radius:50%;transform:translate(-50%,-50%)}
#skills{position:absolute;right:8px;bottom:10px;display:grid;grid-template-columns:repeat(3,56px);gap:5px;z-index:20}
.sbtn{width:56px;height:56px;border-radius:10px;border:2px solid #ffd54f;background:#222;color:white;font-weight:900;font-size:9px}
.sbtn.seal{background:#e91e63}
#battle{position:absolute;inset:0;background:#111;z-index:30;display:none;flex-direction:column;padding:8px;color:white}
#pop{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:100;padding:12px}
.box{background:white;border-radius:16px;padding:12px;width:100%;max-width:320px;color:#222;text-align:center}
</style></head><body>
<div id="game">
<div id="top"><span>Lv<span id="lv">1</span> 💰<span id="gold">100</span> 🎀<span id="balls">5</span></span><span>圖鑑 <span id="dexC">1/4</span> 步<span id="steps">0</span></span></div>
<div id="mapWrap"><canvas id="mapCanvas"></canvas><div id="player">🧑‍🌾</div><div id="msg">V148 Canvas版：一定見到地圖！唔再綠！黃🏠法蘭城 橙🏪商店 深綠草叢遇怪 搖桿試下！</div><div id="joy"><div id="knob"></div></div><div id="skills"><button class="sbtn" onclick="doAtk()">🏹亂射</button><button class="sbtn" onclick="doAtk()">💥乾坤</button><button class="sbtn" onclick="openShop()">🏪商店</button><button class="sbtn" onclick="openDex()">📖圖鑑</button><button class="sbtn seal" onclick="trySeal()">🎀封印</button><button class="sbtn" onclick="msg('家族暫未開放')">👨‍👩‍👧家族</button></div></div>
<div id="battle"><h3>⚔️ <span id="ename">怪</span> <span id="ehp"></span> <button onclick="closeB()">逃走</button></h3><img id="eImg" style="width:100px;height:100px;background:white;border-radius:12px"><div id="bmsg" style="background:#222;padding:8px;border-radius:8px;margin:8px 0;font-size:12px">打到60%封印</div><button class="sbtn" style="width:100%;height:44px" onclick="doAtk()">攻擊</button><button class="sbtn seal" style="width:100%;height:44px" onclick="trySeal()">封印</button></div>
<div id="pop"><div class="box" id="popBox"></div></div>
</div>
<script>
const pets=[{img:"./dino1.png.jpg",name:"螳螂"},{img:"./dino2.png.jpg",name:"黃蜂"},{img:"./dino3.png.WEBP",name:"水龍蜥"},{img:"./dino4.png.jpg",name:"哥布林"}];
let px=15,py=15,gold=100,balls=5,dex=[true,false,false,false],lv=1,exp=0,emy=1,emyHp=100,battle=false,ans=0,input="",steps=0;
let map=[];for(let y=0;y<30;y++){map[y]=[];for(let x=0;x<30;x++){if(x==15&&y==15)map[y][x]=4;else if(x==6&&y==6)map[y][x]=4;else if(x==22&&y==22)map[y][x]=5;else{let r=Math.random();if(r<0.05)map[y][x]=3;else if(r<0.20)map[y][x]=1;else if(r<0.26)map[y][x]=2;else map[y][x]=0;}}}
const canvas=document.getElementById('mapCanvas'),ctx=canvas.getContext('2d');
function resize(){canvas.width=canvas.clientWidth*2;canvas.height=canvas.clientHeight*2;draw();}
function draw(){let w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);let tile=40*2,cx=w/2,cy=h/2;let offsetX=cx-px*tile-tile/2,offsetY=cy-py*tile-tile/2;for(let y=0;y<30;y++)for(let x=0;x<30;x++){let sx=x*tile+offsetX,sy=y*tile+offsetY;if(sx<-tile||sx>w+tile||sy<-tile||sy>h+tile)continue;let t=map[y][x];if(t==0){ctx.fillStyle='#e8d5a8';ctx.fillRect(sx,sy,tile,tile);ctx.strokeStyle='rgba(0,0,0,.05)';ctx.strokeRect(sx,sy,tile,tile);}else if(t==1){ctx.fillStyle='#8bc34a';ctx.fillRect(sx,sy,tile,tile);ctx.fillStyle='#7cb342';ctx.fillRect(sx+5,sy+5,tile-10,4);}else if(t==2){ctx.fillStyle='#3d7a1a';ctx.fillRect(sx,sy,tile,tile);ctx.fillStyle='#2a5a1a';ctx.beginPath();ctx.arc(sx+tile/2,sy+tile/2,tile/3,0,Math.PI*2);ctx.fill();}else if(t==3){ctx.fillStyle='#6ec6ff';ctx.fillRect(sx,sy,tile,tile);}else if(t==4){ctx.fillStyle='#ffd54f';ctx.fillRect(sx,sy,tile,tile);ctx.fillStyle='#000';ctx.font=`${18*2}px serif`;ctx.fillText('🏠',sx+8,sy+tile-8);}else if(t==5){ctx.fillStyle='#ff8a65';ctx.fillRect(sx,sy,tile,tile);ctx.fillText('🏪',sx+8,sy+tile-8);}}ctx.fillStyle='rgba(255,0,0,.0)';}
function updateUI(){document.getElementById('lv').innerText=lv;document.getElementById('gold').innerText=gold;document.getElementById('balls').innerText=balls;document.getElementById('dexC').innerText=dex.filter(Boolean).length+'/4';document.getElementById('steps').innerText=steps;}
function move(dx,dy){if(battle)return;let nx=px+dx,ny=py+dy;if(nx<0||nx>=30||ny<0||ny>=30)return;if(map[ny][nx]==3)return;px=nx;py=ny;steps++;draw();updateUI();let t=map[ny][nx];if(t==4)msg('🏠法蘭城補血！');if(t==5)openShop();if(t==1||t==2)if(Math.random()<0.22)startB();msg(t==1?'草叢...':'行走中...步數'+steps);}
function msg(t){document.getElementById('msg').innerText=t;}
function startB(){emy=Math.floor(Math.random()*4);emyHp=100;battle=true;document.getElementById('battle').style.display='flex';document.getElementById('ename').innerText=pets[emy].name;document.getElementById('eImg').src=pets[emy].img;document.getElementById('ehp').innerText='100%';document.getElementById('bmsg').innerText='野生'+pets[emy].name+'！打到60%以下封印！';}
function closeB(){document.getElementById('battle').style.display='none';battle=false;}
function doAtk(){pop(`<h3>⚔️ 亂射！加法</h3><h1 id=q style="font-size:32px">?+?=?</h1><div id=ans style="font-size:36px;border:2px solid #000;border-radius:10px;padding:6px">?</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px"><button onclick="addN('1')">1</button><button onclick="addN('2')">2</button><button onclick="addN('3')">3</button><button onclick="addN('4')">4</button><button onclick="addN('5')">5</button><button onclick="addN('6')">6</button><button onclick="addN('7')">7</button><button onclick="addN('8')">8</button><button onclick="addN('9')">9</button><button onclick="clrN()">⌫</button><button onclick="addN('0')">0</button><button style="background:#ff9800;color:white" onclick="chk(false)">OK</button></div>`);let a=Math.floor(Math.random()*15)+1,b=Math.floor(Math.random()*15)+1;ans=a+b;document.getElementById('q').innerText=a+' + '+b+' = ?';input="";}
function trySeal(){if(balls<=0){pop(`<h3>無卡啦！</h3><button onclick="openShop()">去商店</button>`);return;}if(emyHp>60){document.getElementById('bmsg').innerText='仲有'+emyHp+'%血！打到60%以下！';return;}pop(`<h3>🎀 封印！加法</h3><h1 id=q style="font-size:32px">?+?=?</h1><div id=ans style="font-size:36px;border:2px solid #000;border-radius:10px;padding:6px">?</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px"><button onclick="addN('1')">1</button><button onclick="addN('2')">2</button><button onclick="addN('3')">3</button><button onclick="addN('4')">4</button><button onclick="addN('5')">5</button><button onclick="addN('6')">6</button><button onclick="addN('7')">7</button><button onclick="addN('8')">8</button><button onclick="addN('9')">9</button><button onclick="clrN()">⌫</button><button onclick="addN('0')">0</button><button style="background:#e91e63;color:white" onclick="chk(true)">封印</button></div>`);let a=Math.floor(Math.random()*10)+1,b=Math.floor(Math.random()*10)+1;ans=a+b;document.getElementById('q').innerText=a+' + '+b+' = ?';input="";}
function addN(n){input+=n;let el=document.getElementById('ans');if(el)el.innerText=input;}
function clrN(){input=input.slice(0,-1);let el=document.getElementById('ans');if(el)el.innerText=input||'?';}
function chk(isSeal){let v=parseInt(input);if(isNaN(v))return;closePop();if(v===ans){if(isSeal){balls--;if(Math.random()<0.8){dex[emy]=true;gold+=20;msg('🎉封印成功！捉到'+pets[emy].name);closeB();}else{msg('封印失敗！再試！');}}else{emyHp=Math.max(0,emyHp-35);document.getElementById('ehp').innerText=emyHp+'%';document.getElementById('bmsg').innerText='打中！-'+35+'% 正解'+ans;if(emyHp<=0)document.getElementById('bmsg').innerText='倒下！快封印！';}updateUI();}else{msg('答錯！正解'+ans);}}
function pop(html){document.getElementById('popBox').innerHTML=html;document.getElementById('pop').style.display='flex';}
function closePop(){document.getElementById('pop').style.display='none';}
function openShop(){pop(`<h3>🏪道具屋</h3><p>🎀封印卡 20金<br>💰你有 ${gold}</p><button onclick="buy()" style="width:100%;padding:10px;background:#ff9800;border-radius:8px;font-weight:900">買1張</button><button onclick="closePop()" style="width:100%;padding:8px;margin-top:6px">關閉</button>`);}
function buy(){if(gold>=20){gold-=20;balls++;updateUI();closePop();msg('買到封印卡！');}else msg('金幣唔夠！');}
function openDex(){let h='<h3>圖鑑</h3>';pets.forEach((p,i)=>{h+=`<div style="display:flex;gap:8px;align-items:center;border:2px solid ${dex[i]?'#ff9800':'#ccc'};border-radius:8px;padding:4px;margin:4px 0"><img src="${p.img}" style="width:40px;height:40px;object-fit:contain"><span>${p.name} ${dex[i]?'已捉':'未見'}</span></div>`});h+=`<button onclick="closePop()">關閉</button>`;pop(h);}
let joy=document.getElementById('joy'),knob=document.getElementById('knob'),drag=false,last=0;
joy.addEventListener('touchstart',e=>{drag=true;e.preventDefault();});
window.addEventListener('touchend',()=>{drag=false;knob.style.transform='translate(-50%,-50%)';});
window.addEventListener('touchmove',e=>{if(!drag||battle)return;let r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,x=e.touches[0].clientX-cx,y=e.touches[0].clientY-cy,d=Math.min(Math.sqrt(x*x+y*y),40),a=Math.atan2(y,x),nx=Math.cos(a)*d,ny=Math.sin(a)*d;knob.style.transform=`translate(calc(-50% + ${nx}px), calc(-50% + ${ny}px))`;let now=Date.now();if(now-last<90)return;last=now;let dx=Math.abs(nx)>15?(nx>0?1:-1):0,dy=Math.abs(ny)>15?(ny>0?1:-1):0;if(dx||dy)move(dx,dy);},{passive:false});
window.addEventListener('resize',resize);
resize();draw();updateUI();
</script></body></html>
